<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簿記2級">
<meta name="description" content="日商簿記2級の仕訳問題をスマホで練習できるアプリ">
<title>簿記2級 仕訳トレーニング</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E簿%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --text:#1f2933; --sub:#5f6b7a; --line:#e2e6ea;
  --accent:#0f766e; --accent-weak:#e0f2f1; --accent-text:#ffffff;
  --debit:#1d4ed8; --debit-weak:#eff4ff; --credit:#c2410c; --credit-weak:#fff4ed;
  --ok:#15803d; --ok-weak:#e8f7ee; --yt:#c4302b; --yt-weak:#fdeceb; --ng:#dc2626; --ng-weak:#fdecec; --warn:#b45309; --warn-weak:#fff7e0;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111518; --card:#1b2126; --text:#e6e9ec; --sub:#9aa5b1; --line:#2d353c;
    --accent:#2dd4bf; --accent-weak:#123a37; --accent-text:#06201d;
    --debit:#7aa2ff; --debit-weak:#18223a; --credit:#ff9a62; --credit-weak:#3a2216;
    --ok:#4ade80; --ok-weak:#123222; --yt:#ff7b72; --yt-weak:#3a1a19; --ng:#f87171; --ng-weak:#3a1717; --warn:#fbbf24; --warn-weak:#3a2e10;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
#view{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.quiz #view{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 2px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--line);color:var(--text)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.warn{background:var(--warn-weak);color:var(--warn)}
.btn.danger{background:var(--ng-weak);color:var(--ng)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.actions{display:flex;gap:10px}
.actions .btn{margin:0}
.actions .btn.ghost{flex:0 0 38%}
.link{background:none;border:none;color:var(--sub);padding:6px 0;font-size:14px}

/* home */
.hero{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;line-height:1.3}
.stat span{font-size:11px;color:var(--sub)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:9px 4px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub)}
.chip.on{border-color:var(--accent);background:var(--accent-weak);color:var(--text);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:4px 0 6px}
.review{display:flex;align-items:center;gap:12px}
.review .num{font-size:28px;font-weight:800;color:var(--warn);min-width:48px;text-align:center}
.review .num.zero{color:var(--sub)}
.review div{flex:1}
.note{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 0}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:center}
.prog{font-weight:700;font-size:14px;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--sub)}
.tag.g1{background:var(--debit-weak);color:var(--debit)}
.tag.g2{background:var(--credit-weak);color:var(--credit)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.qtext{margin:0;font-size:16px;line-height:1.75}
.hist{margin:8px 0 0;font-size:12px;color:var(--sub)}
.side{border-radius:12px;padding:10px;margin-bottom:10px}
.side.d{background:var(--debit-weak)}
.side.c{background:var(--credit-weak)}
.sh{font-weight:800;font-size:14px;margin:0 0 6px}
.side.d .sh{color:var(--debit)}
.side.c .sh{color:var(--credit)}
.row{display:flex;gap:6px;margin-bottom:6px}
.row select,.row input{
  font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);
  padding:9px 8px;min-width:0;height:44px;
}
.row select{flex:1.35;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);
  background-position:calc(100% - 14px) 19px,calc(100% - 9px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.row input{flex:1;text-align:right}
.row select:focus,.row input:focus{outline:none;border-color:var(--accent)}
.row .del{flex:0 0 32px;border:none;background:transparent;color:var(--sub);font-size:18px;padding:0}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:9px;width:100%;padding:7px;font-size:13px;color:var(--sub)}
.locked select,.locked input{opacity:.75}
.locked .del,.locked .add{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* feedback */
.fb{border-width:2px}
.fb.ok{border-color:var(--ok)}
.fb.ng{border-color:var(--ng)}
.verdict{font-size:22px;font-weight:800;margin:0 0 8px}
.fb.ok .verdict{color:var(--ok)}
.fb.ng .verdict{color:var(--ng)}
.jt{width:100%;border-collapse:collapse;table-layout:fixed;margin:4px 0 12px;font-size:14px}
.jt th{font-size:12px;padding:4px 6px;text-align:left}
.jt th:first-child{color:var(--debit);background:var(--debit-weak)}
.jt th:last-child{color:var(--credit);background:var(--credit-weak)}
.jt td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;word-break:break-all}
.jt td:first-child{border-right:1px solid var(--line)}
.jt .a{display:block;font-weight:600;line-height:1.35}
.jt .m{display:block;text-align:right;font-variant-numeric:tabular-nums}
.jt td.okc .a{color:var(--ok)}
.jt td.ngc{background:var(--ng-weak)}
.jt td.ngc .a{color:var(--ng)}
.jlabel{font-size:12px;font-weight:700;color:var(--sub);margin:6px 0 0}
.expl{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;line-height:1.75;margin:0}
.expl b{color:var(--accent)}

/* result list */
.big{font-size:44px;font-weight:800;line-height:1.2}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.rlist li:last-child{border-bottom:none}
.mk{font-weight:800;font-size:16px;line-height:1.3;min-width:18px}
.mk.o{color:var(--ok)} .mk.x{color:var(--ng)}

/* stats */
.cat{padding:10px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:none}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat-h b{font-size:14px}
.cat-h .rate{font-weight:800;font-size:15px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter span{display:block;height:100%;border-radius:4px}
.cat-f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
.yts{display:flex;flex-wrap:wrap;gap:6px}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;color:var(--yt);background:var(--yt-weak);border-radius:8px;padding:7px 12px}
.yt svg{width:18px;height:18px;flex:0 0 18px}
a.mini{text-decoration:none;display:inline-block}
.mini{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700}
.r-good{color:var(--ok)} .r-mid{color:var(--warn)} .r-bad{color:var(--ng)} .r-none{color:var(--sub)}
.bg-good{background:var(--ok)} .bg-mid{background:var(--warn)} .bg-bad{background:var(--ng)}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:15px}
.set-row .d{font-size:12px;color:var(--sub)}
.switch{position:relative;width:52px;height:30px;flex:0 0 52px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(22px)}
input[type=date]{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);color:var(--text)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1.5px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--text)}
.help{font-size:14px;line-height:1.8;padding-left:1.2em;margin:0}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--accent);font-weight:700}
body.quiz #nav{display:none}
</style>
</head>
<body>
<main id="view"></main>
<nav id="nav">
  <button data-act="go" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>ホーム</button>
  <button data-act="go" data-v="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>成績</button>
  <button data-act="go" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
</nav>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   分野（カテゴリ）
   ========================================================= */
const CATS = [
  {id:'shohin',  grp:'商業', name:'商品売買・収益', yt:['商品売買 売上原価対立法']},
  {id:'tegata',  grp:'商業', name:'手形・電子記録債権', yt:['手形 電子記録債権']},
  {id:'yuka',    grp:'商業', name:'有価証券', yt:['有価証券']},
  {id:'kotei',   grp:'商業', name:'固定資産・リース', yt:['固定資産','リース取引']},
  {id:'hikiate', grp:'商業', name:'引当金', yt:['引当金']},
  {id:'gaika',   grp:'商業', name:'外貨建取引', yt:['外貨換算 外貨建取引']},
  {id:'zei',     grp:'商業', name:'税金・税効果', yt:['法人税 消費税','税効果会計']},
  {id:'junshi',  grp:'商業', name:'純資産・合併', yt:['株式の発行 剰余金の配当','合併']},
  {id:'honshi',  grp:'商業', name:'本支店・その他', yt:['本支店会計']},
  {id:'renketsu',grp:'商業', name:'連結会計', yt:['連結会計']},
  {id:'zairyo',  grp:'工業', name:'材料費', yt:['工業簿記 材料費']},
  {id:'romu',    grp:'工業', name:'労務費', yt:['工業簿記 労務費']},
  {id:'keihi',   grp:'工業', name:'経費・製造間接費', yt:['工業簿記 経費 製造間接費']},
  {id:'seihin',  grp:'工業', name:'製品・標準原価・差異', yt:['標準原価計算','原価差異']},
  {id:'kojo',    grp:'工業', name:'本社工場会計', yt:['本社工場会計']},
];

/* =========================================================
   ふくしままさゆきさんのYouTube講義へのリンク
   yt のキーワードで「ふくしままさゆき 簿記2級 ＋ キーワード」を検索します
   ========================================================= */
const YT_PLAYLISTS = [
  {name:'簿記2級 商業簿記（連結会計以外）', url:'https://www.youtube.com/playlist?list=PLJr7GuMySVGKZQqoE3cUiPnTZ5IAxXGjP'},
  {name:'簿記2級 工業簿記（全35回）',       url:'https://www.youtube.com/playlist?list=PLJr7GuMySVGIIt7yWt2GNWqw0dBHOWim5'},
];
const ytUrl = kw => 'https://www.youtube.com/results?search_query=' + encodeURIComponent('ふくしままさゆき 簿記2級 ' + kw);
function ytLinks(cid){
  const c = CATS.find(x => x.id === cid);
  return `<div class="yts">${c.yt.map(k => `<a class="yt" href="${ytUrl(k)}" target="_blank" rel="noopener">${YT_ICON}${esc(k.replace('工業簿記 ',''))}</a>`).join('')}</div>`
    + (cid === 'renketsu' ? '<p class="sub" style="margin:4px 0 0;font-size:11px">※連結会計の講義はメンバーシップ限定の回があります</p>' : '');
}
const YT_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23 7.2a3 3 0 0 0-2.1-2.1C19 4.6 12 4.6 12 4.6s-7 0-8.9.5A3 3 0 0 0 1 7.2 31 31 0 0 0 .5 12 31 31 0 0 0 1 16.8a3 3 0 0 0 2.1 2.1c1.9.5 8.9.5 8.9.5s7 0 8.9-.5a3 3 0 0 0 2.1-2.1 31 31 0 0 0 .5-4.8 31 31 0 0 0-.5-4.8zM9.7 15.1V8.9L15.5 12z"/></svg>';

/* =========================================================
   問題データ
   d: 借方 [[勘定科目, 金額], ...]
   c: 貸方 [[勘定科目, 金額], ...]
   x: 選択肢に混ぜる「ひっかけ」の勘定科目
   e: 解説
   ※ 問題を追加するときは、この形式で1行ずつ足せばOKです
   ========================================================= */
const QS = [
/* ---------- 商品売買・収益 ---------- */
{id:'s01',cat:'shohin',q:'商品200,000円を仕入れ、代金は掛けとした。なお、商品売買は「売上原価対立法」で記帳している。',
 d:[['商品',200000]],c:[['買掛金',200000]],x:['仕入','売上原価','未払金','現金'],
 e:'売上原価対立法では、仕入時に<b>「商品」勘定（資産）</b>で記録します。三分法の「仕入」と混同しないように注意。'},
{id:'s02',cat:'shohin',q:'原価150,000円の商品を240,000円で販売し、代金は掛けとした。なお、商品売買は「売上原価対立法」で記帳している。',
 d:[['売掛金',240000],['売上原価',150000]],c:[['売上',240000],['商品',150000]],x:['仕入','繰越商品','未収入金'],
 e:'売上原価対立法では、販売のつど ①売上の計上（売価240,000円）と ②商品→<b>売上原価</b>への振替（原価150,000円）の2つを行います。'},
{id:'s03',cat:'shohin',q:'決算にあたり、売上原価を「仕入」勘定で算定する。期首商品棚卸高は80,000円、期末商品棚卸高は95,000円である（三分法）。',
 d:[['仕入',80000],['繰越商品',95000]],c:[['繰越商品',80000],['仕入',95000]],x:['商品','売上原価','売上'],
 e:'合言葉は<b>「しーくり・くりしー」</b>。期首商品を 繰越商品→仕入 に、期末商品を 仕入→繰越商品 に振り替えます。同じ勘定科目が借方・貸方の両方に出てきます。'},
{id:'s04',cat:'shohin',q:'期末商品の帳簿棚卸数量は100個、実地棚卸数量は96個、1個あたりの原価は500円、正味売却価額は450円であった。棚卸減耗損と商品評価損を計上する（三分法。売上原価の算定は済んでいる）。',
 d:[['棚卸減耗損',2000],['商品評価損',4800]],c:[['繰越商品',6800]],x:['仕入','商品','売上原価'],

/* =========================================================
   保存データ（スマホのブラウザ内 localStorage）
   ========================================================= */
const KEY = 'boki2_trainer_v1';
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CMAP = Object.fromEntries(CATS.map(c => [c.id, c]));

function defaults(){
  return {v:1, rec:{}, days:{}, set:{amount:true, scope:'all', cats:[], count:10, exam:''}};
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.rec){ const d = defaults(); return {...d, ...s, set:{...d.set, ...(s.set||{})}}; }
  }catch(e){}
  return defaults();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('記録を保存できませんでした（プライベートブラウズでは保存されません）'); } }

function todayKey(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function record(id, ok){
  const r = S.rec[id] || {n:0, c:0};
  r.n++; if(ok) r.c++; r.last = ok; r.ts = Date.now();
  S.rec[id] = r;
  const t = todayKey(); S.days[t] = (S.days[t]||0) + 1;
  save();
}
function wrongIds(){ return QS.filter(q => S.rec[q.id] && S.rec[q.id].last === false).map(q => q.id); }
function streak(){
  let n = 0; const d = new Date();
  if(!S.days[todayKey(d)]) d.setDate(d.getDate()-1);
  while(S.days[todayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const yen = n => Number(n).toLocaleString('ja-JP');
const plain = html => html.replace(/<[^>]+>/g, '');
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 2200); }
function rateClass(r){ return r===null ? 'none' : r>=80 ? 'good' : r>=60 ? 'mid' : 'bad'; }
function merge(lines){ const m=new Map(); lines.forEach(([a,v])=>m.set(a,(m.get(a)||0)+v)); return m; }

function collect(side){
  const lines = []; let err = null;
  view.querySelectorAll(`.rows[data-side="${side}"] .row`).forEach(r => {
    const a = r.querySelector('.acc').value;
    const amtEl = r.querySelector('.amt');
    const raw = amtEl ? amtEl.value.replace(/[^0-9]/g,'') : '';
    if(!a && !raw) return;
    if(!a){ err = '勘定科目が選ばれていない行があります'; return; }
    if(S.set.amount && !raw){ err = '金額が入力されていない行があります'; return; }
    lines.push([a, S.set.amount ? Number(raw) : 0]);
  });
  return {lines, err};
}
function sameMap(a, b, useAmt){
  if(a.size !== b.size) return false;
  for(const [k,v] of a){ if(!b.has(k)) return false; if(useAmt && b.get(k)!==v) return false; }
  return true;
}
function jtable(d, c, opt = {}){
  // d, c: [[勘定科目, 金額]]  opt.check: {d:Map, c:Map} 正解との照合用
  const n = Math.max(d.length, c.length, 1);
  const cell = (l, side) => {
    if(!l) return '<td></td>';
    let cls = '';
    if(opt.check){ const m = opt.check[side]; cls = (m.has(l[0]) && (!opt.useAmt || m.get(l[0])===l[1])) ? 'okc' : 'ngc'; }
    return `<td class="${cls}"><span class="a">${esc(l[0])}</span>${opt.noAmt?'':`<span class="m">${yen(l[1])}</span>`}</td>`;
  };
  let h = '<table class="jt"><thead><tr><th>借方</th><th>貸方</th></tr></thead><tbody>';
  for(let i=0;i<n;i++) h += `<tr>${cell(d[i],'d')}${cell(c[i],'c')}</tr>`;
  return h + '</tbody></table>';
}
function grade(giveup){
  if(sess.done) return;
  const q = QMAP[sess.ids[sess.i]];
  const useAmt = S.set.amount;
  let ok = false, ud = [], uc = [];
  if(!giveup){
    const D = collect('d'), C = collect('c');
    if(D.err || C.err){ toast(D.err || C.err); return; }
    if(!D.lines.length || !C.lines.length){ toast('借方・貸方の両方を入力してください'); return; }
    const um = {d:merge(D.lines), c:merge(C.lines)};
    ud = [...um.d]; uc = [...um.c];
    ok = sameMap(um.d, merge(q.d), useAmt) && sameMap(um.c, merge(q.c), useAmt);
  }
  sess.done = true;
  record(q.id, ok);
  sess.results.push({id:q.id, ok});
  document.getElementById('ans').classList.add('locked');
  view.querySelectorAll('#ans select, #ans input').forEach(el => el.disabled = true);
  const last = sess.i === sess.ids.length-1;
  const yours = giveup ? '' : `<p class="jlabel">あなたの解答</p>${jtable(ud, uc, {check:{d:merge(q.d), c:merge(q.c)}, useAmt, noAmt:!useAmt})}`;
  document.getElementById('fb').innerHTML = `
    <div class="card fb ${ok?'ok':'ng'}" id="fbcard">
      <p class="verdict">${ok?'○ 正解！':(giveup?'答え':'× 不正解')}</p>
      <p class="jlabel">正解の仕訳</p>
      ${jtable(q.d, q.c)}
      ${ok ? '' : yours}
      <p class="jlabel" style="margin-bottom:4px">解説</p>
      <p class="expl">${q.e}</p>
      <p class="jlabel" style="margin:12px 0 6px">📺 この単元を動画で復習（ふくしままさゆき）</p>
      ${ytLinks(q.cat)}
    </div>`;
  document.getElementById('actions').innerHTML = `<button class="btn primary" data-act="next">${last?'結果を見る':'次の問題へ →'}</button>`;
  document.getElementById('fbcard').scrollIntoView({behavior:'smooth', block:'start'});
}
function next(){
  if(sess.i < sess.ids.length-1){ sess.i++; renderQuiz(); window.scrollTo(0,0); }
  else renderDone();
}
function renderDone(){
  cur = 'done';
  const n = sess.results.length, ok = sess.results.filter(r=>r.ok).length;
  const wrong = sess.results.filter(r=>!r.ok).map(r=>r.id);
  const rate = n ? Math.round(ok/n*100) : 0;
  const msg = rate===100 ? 'パーフェクト！' : rate>=80 ? 'よくできました！' : rate>=60 ? 'あと少し！' : '復習でしっかり定着させよう';
  view.innerHTML = `
    <div class="card center">
      <p class="sub" style="margin:0">${sess.mode==='review'?'復習':'ランダム出題'}の結果</p>
      <div class="big">${ok} / ${n}</div>
      <p style="margin:0;font-weight:700" class="r-${rateClass(rate)}">正答率 ${rate}%　${msg}</p>
    </div>
    <div class="card">
      <ul class="rlist">${sess.results.map(r => { const q=QMAP[r.id]; const t=plain(q.q);
        return `<li><span class="mk ${r.ok?'o':'x'}">${r.ok?'○':'×'}</span><span><span class="tag" style="margin-right:4px">${esc(CMAP[q.cat].name)}</span>${esc(t.length>48?t.slice(0,48)+'…':t)}</span></li>`; }).join('')}</ul>
    </div>
    ${wrong.length ? `<div class="card"><h2>📺 間違えた単元を動画で復習</h2>${[...new Set(wrong.map(id=>QMAP[id].cat))].map(cid=>`<p class="label" style="margin:8px 0 6px">${esc(CMAP[cid].name)}</p>${ytLinks(cid)}`).join('')}</div>` : ''}
    ${wrong.length ? `<button class="btn warn" data-act="retry">間違えた${wrong.length}問をもう一度</button>` : ''}
    <button class="btn primary" data-act="again">続けて出題する</button>
    <button class="btn ghost" data-act="go" data-v="home">ホームへ戻る</button>`;
  sess.wrong = wrong;
  window.scrollTo(0,0);
}

/* ---------- 成績 ---------- */
function catStats(cid){
  const qs = QS.filter(q=>q.cat===cid); let n=0, c=0, learned=0, wrong=0;
  qs.forEach(q => { const r=S.rec[q.id]; if(r){ n+=r.n; c+=r.c; learned++; if(r.last===false) wrong++; } });
  return {total:qs.length, n, c, learned, wrong, rate: n ? Math.round(c/n*100) : null};
}
function renderStats(){
  let tot=0, ok=0; Object.entries(S.rec).forEach(([id,r]) => { if(QMAP[id]){ tot+=r.n; ok+=r.c; } });
  const learned = Object.keys(S.rec).filter(id=>QMAP[id]).length;
  const groups = ['商業','工業'].map(g => {
    const rows = CATS.filter(c=>c.grp===g).map(c => {
      const s = catStats(c.id), rc = rateClass(s.rate);
      return `<div class="cat">
        <div class="cat-h"><b>${esc(c.name)}</b><span class="rate r-${rc}">${s.rate===null?'未学習':s.rate+'%'}</span></div>
        <div class="meter"><span class="bg-${rc}" style="width:${s.rate||0}%"></span></div>
        <div class="cat-f"><span>正解 ${s.c}/${s.n}回・学習 ${s.learned}/${s.total}問${s.wrong?`・<span class="r-bad">要復習 ${s.wrong}</span>`:''}</span>
        <span style="display:flex;gap:6px;flex:0 0 auto"><a class="mini" style="border-color:var(--yt);color:var(--yt)" href="${ytUrl(c.yt[0])}" target="_blank" rel="noopener">動画</a><button class="mini" data-act="catstart" data-id="${c.id}">解く</button></span></div>
      </div>`;
    }).join('');
    let gn=0, gc=0; CATS.filter(c=>c.grp===g).forEach(c=>{ const s=catStats(c.id); gn+=s.n; gc+=s.c; });
    return `<div class="card"><h2>${g}簿記 <span class="sub" style="font-weight:400">${gn?`正答率 ${Math.round(gc/gn*100)}%`:''}</span></h2>${rows}</div>`;
  }).join('');
  // 苦手分野（回答3回以上で正答率が低い順）
  const weak = CATS.map(c=>({c, s:catStats(c.id)})).filter(o=>o.s.n>=3 && o.s.rate<80).sort((a,b)=>a.s.rate-b.s.rate).slice(0,3);
  view.innerHTML = `
    <h1>成績</h1>
    <div class="hero" style="margin-top:10px">
      <div class="stat"><b>${tot}</b><span>総回答数</span></div>
      <div class="stat"><b>${tot?Math.round(ok/tot*100)+'%':'-'}</b><span>正答率</span></div>
      <div class="stat"><b>${learned}<small style="font-size:12px">/${QS.length}</small></b><span>学習済み</span></div>
      <div class="stat"><b class="${wrongIds().length?'r-bad':''}">${wrongIds().length}</b><span>要復習</span></div>
    </div>
    ${weak.length ? `<div class="card"><h2>苦手な分野</h2>${weak.map(o=>`<div class="cat-f" style="padding:4px 0;font-size:14px"><span>${esc(o.c.name)}　<b class="r-${rateClass(o.s.rate)}">${o.s.rate}%</b></span><button class="mini" data-act="catstart" data-id="${o.c.id}">解く</button></div>`).join('')}</div>` : ''}
    ${groups}
    <p class="note">正答率＝その分野で正解した回数÷回答した回数</p>`;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  const s = S.set;
  view.innerHTML = `
    <h1>設定</h1>
    <div class="card" style="margin-top:10px">
      <div class="set-row"><div><div class="t">金額も入力する</div><div class="d">オフにすると勘定科目だけで採点（スキマ時間向け）</div></div>
        <label class="switch"><input type="checkbox" id="optAmt" ${s.amount?'checked':''}><span></span></label></div>
      <div class="set-row"><div><div class="t">試験日</div><div class="d">ホームにカウントダウンを表示</div></div>
        <input type="date" id="optExam" value="${esc(s.exam)}"></div>
    </div>
    <div class="card">
      <h2>📺 ふくしままさゆき 講義動画</h2>
      <p class="sub" style="margin:0 0 10px">YouTubeの再生リストを開きます。単元ごとの動画は、解答後の画面や「成績」タブの「動画」ボタンから開けます。</p>
      <div class="yts">${YT_PLAYLISTS.map(p=>`<a class="yt" href="${p.url}" target="_blank" rel="noopener">${YT_ICON}${esc(p.name)}</a>`).join('')}</div>
    </div>
    <div class="card">
      <h2>使い方</h2>
      <ol class="help">
        <li>ホームで出題範囲と問題数を選んで「スタート」</li>
        <li>借方・貸方それぞれ勘定科目を選び、金額を入力して「解答する」</li>
        <li>わからないときは「答えを見る」（不正解として記録されます）</li>
        <li>間違えた問題は「間違えた問題を復習」で解き直せます</li>
        <li>「成績」タブで分野ごとの正答率を確認できます</li>
      </ol>
      <p class="sub" style="margin:10px 0 0">スマホのブラウザで「ホーム画面に追加」すると、アプリのように起動できます。</p>
    </div>
    <div class="card">
      <h2>学習記録のバックアップ</h2>
      <p class="sub" style="margin:0 0 10px">記録はこの端末のブラウザに保存されています。ブラウザのデータを消したり機種変更すると消えるため、ときどきバックアップをとっておくと安心です。</p>
      <button class="btn" data-act="export">バックアップ用の文字列を表示</button>
      <div id="exp"></div>
      <button class="btn" data-act="import">バックアップから復元</button>
      <div id="imp"></div>
    </div>
    <div class="card">
      <button class="btn danger" data-act="reset">学習記録をすべて消去</button>
    </div>
    <p class="note">簿記2級 仕訳トレーニング・全${QS.length}問</p>`;
  document.getElementById('optAmt').onchange = e => { S.set.amount = e.target.checked; save(); toast(S.set.amount?'金額も採点します':'勘定科目のみで採点します'); };
  document.getElementById('optExam').onchange = e => { S.set.exam = e.target.value; save(); toast('試験日を保存しました'); };
}

/* =========================================================
   ボタン操作
   ========================================================= */
const ACT = {
  go: b => go(b.dataset.v),
  scope: b => { S.set.scope = b.dataset.v; save(); renderHome(); },
  count: b => { S.set.count = Number(b.dataset.v); save(); renderHome(); },
  cat: b => { const id=b.dataset.id, a=S.set.cats; S.set.cats = a.includes(id) ? a.filter(x=>x!==id) : [...a, id]; save(); renderHome(); },
  start: () => { const ids = shuffle(scopePool().map(q=>q.id)); startSession(S.set.count ? ids.slice(0, S.set.count) : ids, 'random'); },
  review: () => startSession(shuffle(wrongIds()), 'review'),
  catstart: b => { const ids = shuffle(QS.filter(q=>q.cat===b.dataset.id).map(q=>q.id)); startSession(S.set.count ? ids.slice(0, S.set.count) : ids, 'random'); },
  addrow: b => { if(sess.done) return; b.previousElementSibling.insertAdjacentHTML('beforeend', rowHTML(sess.opts)); },
  delrow: b => {
    if(sess.done) return;
    const row = b.closest('.row'), rows = row.parentElement;
    if(rows.children.length > 1) row.remove();
    else { row.querySelector('.acc').value=''; const a=row.querySelector('.amt'); if(a) a.value=''; }
  },
  submit: () => grade(false),
  giveup: () => grade(true),
  next: () => next(),
  quit: () => { if(confirm('中断してホームに戻りますか？\n（ここまでの回答は記録されています）')) go('home'); },
  retry: () => startSession(shuffle(sess.wrong), 'review'),
  again: () => sess.mode==='review' ? ACT.review() : ACT.start(),
  export: () => {
    document.getElementById('exp').innerHTML = `<textarea readonly id="expText" style="margin-top:10px">${esc(JSON.stringify(S))}</textarea>
      <button class="btn primary" data-act="copy" style="margin-top:6px">コピーする</button>
      <p class="sub" style="margin:6px 0 10px">コピーした文字列をメモアプリなどに貼り付けて保存してください。</p>`;
  },
  copy: () => {
    const t = document.getElementById('expText');
    const done = () => toast('コピーしました');
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); });
    else { t.select(); document.execCommand('copy'); done(); }
  },
  import: () => {
    document.getElementById('imp').innerHTML = `<textarea id="impText" placeholder="バックアップの文字列を貼り付け" style="margin-top:10px"></textarea>
      <button class="btn primary" data-act="doimport" style="margin-top:6px">この内容で復元する</button>`;
  },
  doimport: () => {
    try{
      const s = JSON.parse(document.getElementById('impText').value);
      if(!s || typeof s.rec !== 'object') throw 0;
      if(!confirm('現在の記録を上書きして復元します。よろしいですか？')) return;
      const d = defaults(); S = {...d, ...s, set:{...d.set, ...(s.set||{})}}; save(); toast('復元しました'); go('home');
    }catch(e){ toast('文字列の形式が正しくありません'); }
  },
  reset: () => {
    if(!confirm('学習記録をすべて消去します。元に戻せません。よろしいですか？')) return;
    const set = S.set; S = defaults(); S.set = set; save(); toast('記録を消去しました'); go('home');
  },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  ACT[b.dataset.act]?.(b);
});
// 金額入力：全角数字→半角、3桁カンマ区切り
document.addEventListener('input', e => {
  if(!e.target.classList.contains('amt')) return;
  const d = e.target.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'').slice(0,12);
  e.target.value = d ? Number(d).toLocaleString('ja-JP') : '';
});
// Enterキーで解答
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && cur==='quiz' && e.target.classList?.contains('amt')){ e.preventDefault(); if(!sess.done) grade(false); }
});

go('home');
</script>
</body>
</html>
