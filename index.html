}
function toggleDocFilter(){
  if(!docv) return;
  docv.filter = !docv.filter;
  view.querySelector('.filtbtn').classList.toggle('on', docv.filter);
  const left = docv.items.map((_, i) => i).filter(i => !(docv.marks[i] && docv.marks[i].v === 'o'));
  if(!docv.filter){ toast('すべての問題を表示'); return; }
  if(!left.length){ toast('×・△の問題はありません 🎉'); return; }
  toast(`○以外の${left.length}問を順に解き直します`);
  if(!left.includes(docv.qi)) showDocQ(left[0]);
}
function clearPage(){
  const g = INKS.doc, k = g?.pages[g.cur];
  const any = g && g.pages.some(p => p && p.strokes.length);
  if(!any){ toast('この問題に書き込みはありません'); return; }
  if(!confirm('この問題の書き込み（解答用紙・問題とも）を消しますか？')) return;
  g.pages.forEach((p, i) => { if(p && p.strokes.length){ g.cur = i; p.clear(); } });
  toast('書き込みを消しました（↶で戻せます）');
}

/* ---------- 問題セットをファイルにして、ほかの端末（iPhone → iPad など）に送る ----------
   形式（.boki2）："BOKI2SET" ＋ ヘッダー長（4バイト）＋ ヘッダーJSON ＋ 画像データを順に連結 */
const SET_MAGIC = 'BOKI2SET';
async function buildSetFile(id){
  const d = toV2(await DB.doc(id)), marks = await docMarks(id), ink = {};
  for(let i = 0; i < d.pages.length; i++){ const st = await DB.ink(id+':'+i).catch(() => null); if(st && st.length) ink[i] = st; }
  const meta = pg => ({w:pg.w, h:pg.h, q:pg.q, role:pg.role, size:pg.blob.size, type:pg.blob.type || 'image/jpeg'});
  const head = new TextEncoder().encode(JSON.stringify({v:1, name:d.name, ts:d.ts, pages:d.pages.map(meta), ans:(d.ans || []).map(meta), marks, ink}));
  const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, head.length, true);
  const blob = new Blob([SET_MAGIC, len, head, ...d.pages.map(p => p.blob), ...(d.ans || []).map(p => p.blob)], {type:'application/octet-stream'});
  const fname = d.name.replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40) + '.boki2';
  return {file: new File([blob], fname, {type:'application/octet-stream'}), d};
}
async function shareDoc(id){
  toast('共有ファイルを作っています…');
  let file, d;
  try{ ({file, d} = await buildSetFile(id)); }catch(e){ console.warn(e); toast('ファイルを作れませんでした'); return; }
  const mb = (file.size/1048576).toFixed(1);
  // iPhone / iPad：共有メニュー（AirDrop・ファイルに保存 など）を出す
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:d.name}); toast('送りました。受け取った端末で「📥 共有ファイルから取り込む」'); return; }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  // 共有メニューが使えないとき：ファイルとして保存
  const url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast(`「${file.name}」（${mb}MB）を保存しました。AirDrop などで送ってください`);
}
async function importSetFile(file){
  const box = document.getElementById('doclist'); if(box) box.innerHTML = '<p class="sub" style="margin:10px 0 0">⏳ 共有ファイルを読み込み中…</p>';
  try{
    const magic = await file.slice(0, 8).text();
    if(magic !== SET_MAGIC) throw new Error('format');
    const hl = new DataView(await file.slice(8, 12).arrayBuffer()).getUint32(0, true);
    const h = JSON.parse(await file.slice(12, 12 + hl).text());
    if(h.v !== 1 || !Array.isArray(h.pages)) throw new Error('format');
    let off = 12 + hl;
    const take = async m => { const b = new Blob([await file.slice(off, off + m.size).arrayBuffer()], {type:m.type || 'image/jpeg'}); off += m.size;
      if(b.size !== m.size) throw new Error('format'); return {blob:b, w:m.w, h:m.h, q:m.q, role:m.role}; };
    const pages = []; for(const m of h.pages) pages.push(await take(m));
    const ans = []; for(const m of (h.ans || [])){ const pg = await take(m); delete pg.role; ans.push(pg); }
    const id = 'd' + Date.now();
    await DB.putDoc({id, name:String(h.name || '受け取った問題').slice(0, 60), v:2, pages, ans, ts:Date.now()});
    for(const [i, st] of Object.entries(h.ink || {})) if(Array.isArray(st) && pages[i]) await DB.putInk(id+':'+i, st);
    if(h.marks && Object.keys(h.marks).length) await DB.putInk(id+':marks', h.marks);
    toast(`「${h.name}」を取り込みました`);
    openDoc(id);
  }catch(e){
    console.warn(e);
    toast(e && e.message === 'format' ? 'このアプリの共有ファイル（.boki2）ではないようです' : '取り込めませんでした（容量不足の可能性）');
    renderDocList();
  }
}
async function delDoc(id){
  const d = await DB.doc(id); if(!d) return;
  if(!confirm(`「${d.name}」と書き込みを削除しますか？`)) return;
  await DB.delDoc(d); toast('削除しました'); renderDocList();
}


/* ---------- 予想得点（いまの実力で本試験を受けたら何点か） ---------- */
function jRate(g){
  const qs = QS.filter(q => CMAP[q.cat].grp === g); let learned = 0, ok = 0;
  qs.forEach(q => { const r = S.rec[q.id]; if(r){ learned++; if(r.last !== false) ok++; } });
  return {rate: learned ? ok/learned : null, learned, total: qs.length};
}
function exRate(part){
  const ps = EXAMS.filter(p => p.part === part && S.exr && S.exr[p.id]);
  if(!ps.length) return {rate:null, n:0, total:EXAMS.filter(p => p.part === part).length};
  return {rate: ps.reduce((a, p) => a + S.exr[p.id].last / exTotal(p), 0) / ps.length, n:ps.length, total:EXAMS.filter(p => p.part === part).length};
}
function predict(){
  const js = jRate('商業'), jk = jRate('工業'), e2 = exRate('第2問'), e3 = exRate('第3問'), e4 = exRate('第4問(2)'), e5 = exRate('第5問');
  const pt = (r, full) => r.rate === null ? 0 : Math.round(r.rate * full);
  const rows = [
    {n:'第1問', d:'仕訳（商業）', full:20, pts:pt(js, 20), none:js.rate === null, note:`学習 ${js.learned}/${js.total}問`, act:'smart'},
    {n:'第2問', d:'個別論点・連結など', full:20, pts:pt(e2, 20), none:e2.rate === null, note:`${e2.n}/${e2.total}題`, act:'exams'},
    {n:'第3問', d:'財務諸表の作成', full:20, pts:pt(e3, 20), none:e3.rate === null, note:`${e3.n}/${e3.total}題`, act:'exams'},
    {n:'第4問', d:'工業 仕訳＋計算', full:28, pts:pt(jk, 12) + pt(e4, 16), none:jk.rate === null && e4.rate === null, part: jk.rate === null || e4.rate === null, note:`仕訳 ${jk.learned}/${jk.total}問・計算 ${e4.n}/${e4.total}題`, act: jk.rate === null ? 'smart' : 'exams'},
    {n:'第5問', d:'標準原価・CVPなど', full:12, pts:pt(e5, 12), none:e5.rate === null, note:`${e5.n}/${e5.total}題`, act:'exams'},
  ];
  const total = rows.reduce((a, r) => a + r.pts, 0), none = rows.filter(r => r.none || r.part).length;
  const lowCov = js.learned < js.total*0.5 || jk.learned < jk.total*0.5;
  const weak = rows.slice().sort((a, b) => (a.pts/a.full) - (b.pts/b.full))[0];
  return {rows, total, none, lowCov, weak, any: rows.some(r => !r.none)};
}
function predictHTML(){
  const P = predict(), last = (S.mock || []).slice(-1)[0];
  return `<div class="card pred"><h2>🎯 予想得点　<b class="big2 r-${P.total>=70?'good':P.total>=60?'mid':'bad'}">${P.total}</b><span class="sub">/100点（合格70点）</span></h2>
    ${P.rows.map(r => `<div class="prow"><span class="pn"><b>${r.n}</b><small>${r.d}</small></span>

    ${P.any ? `<button class="btn primary" style="margin-top:10px" data-act="${P.weak.act === 'smart' ? 'smart' : 'go'}" data-v="exams">いちばん伸ばせる ${P.weak.n}（${P.weak.d}）を練習</button>` : `<button class="btn primary" style="margin-top:10px" data-act="go" data-v="exams">模擬試験・本試験形式に挑戦</button>`}
  </div>`;
}

function catStats(cid){
  const qs = QS.filter(q=>q.cat===cid); let n=0, c=0, learned=0, wrong=0, master=0;
  qs.forEach(q => { const r=S.rec[q.id]; if(r){ n+=r.n; c+=r.c; learned++; if(r.last===false) wrong++; } if(stars(q.id)>=3) master++; });
  return {total:qs.length, n, c, learned, wrong, master, rate: n ? Math.round(c/n*100) : null};
}

function calcInsert(){
  const el = lastAnsInput;
  if(!el || !document.contains(el) || el.disabled){ toast('先に解答欄（⌨️ 入力モード）や金額欄をタップしてから押してください'); return; }
  const v = (CS.fresh && CS.acc !== null && CS.op) ? CS.acc : Number(CS.cur);
  el.value = Number.isInteger(v) ? v.toLocaleString('ja-JP') : String(v);
  el.dispatchEvent(new Event('input', {bubbles:true}));
  toast(`${el.value} を入れました`);
}
document.addEventListener('keydown', e => {
  const b = document.body.classList;
  if(!b.contains('pad-calc') || !b.contains('pad-on') || !b.contains('padable') || e.target.matches?.('input, select, textarea') || e.metaKey || e.ctrlKey) return;
  const map = {'+':'＋', '-':'−', '*':'×', '/':'÷', 'Enter':'=', '=':'=', 'Backspace':'←', 'Escape':'C', 'Delete':'C', '%':'%', '.':'.'};
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if(k){ e.preventDefault(); calcKey(k); }
});

/* ---------- 計算メモ（画面の右側／下側に出る手書き用紙） ---------- */
function setupPad(){
  document.body.insertAdjacentHTML('beforeend', `<aside id="pad" aria-label="計算メモ">
    <div class="padhead"><b>✏️ 計算メモ</b><div class="seg padtabs"><button class="on" data-act="padtab" data-v="memo">✏️<span> メモ</span></button><button data-act="padtab" data-v="calc">🧮<span> 電卓</span></button><button class="tab-prob" data-act="padtab" data-v="prob">📄<span> 問題</span></button><button class="tab-ans" data-act="padtab" data-v="ans">📖<span> 解答</span></button></div>${inkBarHTML('pad')}<button class="tool zbtn" data-act="padzoom" aria-label="拡大">🔍</button><button class="tool sidebtn" data-act="padside" aria-label="メモを左右に移動">⇆</button><button class="tool" data-act="pad" aria-label="計算メモを閉じる">✕</button></div>
    <div class="inkwrap padpaper" id="padInk"></div><div class="padans padprob" id="padProb"></div><div class="padans" id="padAns"></div>${calcHTML()}</aside>`);
  INKS.pad = new Ink(document.getElementById('padInk'), {name:'pad', width:2, noScroll:true});
  syncBar('pad');
  document.body.classList.toggle('pad-on', !!S.set.pad);
  document.body.classList.toggle('pad-left', !!S.set.padLeft);
}
function setPadSide(left){
  S.set.padLeft = left; save();
  document.body.classList.toggle('pad-left', left);
  toast(left ? '計算メモを左側に表示します（左利き用）' : '計算メモを右側に表示します');
}
function setPadable(on){ document.body.classList.toggle('padable', on); }
function padBtnHTML(){ return `<button class="homebtn padbtn ${S.set[padKey()]?'on':''}" data-act="pad" aria-label="計算メモ">✏️ メモ</button>`; }
function newPage(){ const k = INKS.pad; if(!k) return; k.clear(); if(k.tool === 'eraser') k.setTool('ink'); } // 問題が変わったら計算メモを新しいページに（↶で戻せる）

/* =========================================================
   ボタン操作
   ========================================================= */
const ACT = {
  go: b => go(b.dataset.v),
  scope: b => { S.set.scope = b.dataset.v; save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  count: b => { S.set.count = Number(b.dataset.v); save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  cat: b => { const id=b.dataset.id, a=S.set.cats; S.set.cats = a.includes(id) ? a.filter(x=>x!==id) : [...a, id]; save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  goal: b => { S.set.goal = Number(b.dataset.v); save(); renderSettings(); toast(`1日の目標を${S.set.goal}問にしました`); },
  introOk: () => { S.seenIntro = true; save(); ACT.smart(); },
  smart: () => { if(!S.seenIntro){ S.seenIntro = true; save(); } startSession(smartPick(5), 'smart'); },
  one: () => startSession(smartPick(1), 'one'),
  ox: () => startOx(),
  start: () => { const ids = shuffle(scopePool().map(q=>q.id)); startSession(S.set.count ? ids.slice(0, S.set.count) : ids, 'random'); },
  review: () => startSession(shuffle(wrongIds()), 'review'),
  catstart: b => { const pool = QS.filter(q=>q.cat===b.dataset.id); startSession(smartPick(S.set.count || pool.length, pool), 'cat', {catId:b.dataset.id}); },
  basics: () => showBasics(),
  closeModal: () => closeModal(),
  closeCeleb: () => closeCeleb(),
  home: () => {
    if(cur === 'exsheet' && ex?.mode === 'mock' && !ex.graded){ if(!confirm('模擬試験を中断しますか？（「続きから」で再開できます）')) return; clearTimeout(mockTimer); saveMockState(); go('exams'); toast('途中まで保存しました'); return; }
    if(cur === 'exsheet'){ if(ex && !ex.saved && (INKS.sheet?.strokes.length || ex.graded) && !confirm('一覧に戻りますか？（この問題の書き込みは消えます）')) return; go('exams'); return; }
    if(cur === 'doc'){ go('exams'); return; }
    leaveToHome();
  },
  resume: () => resumeSession(),
  dropResume: () => { if(confirm('途中の問題を破棄しますか？（回答済みの記録は残ります）')){ delete S.resume; save(); renderHome(); } },
  amtchip: b => fillAmount(Number(b.dataset.v)),
  badge: b => { const x = BADGES.find(y=>y.id===b.dataset.id); toast(`${x.i} ${x.n}：${x.d}${S.badges[x.id]?'（獲得済み）':''}`); },
  chip: b => fillChip(b.dataset.acc),
  pickrow: b => { if(!sess.done) setActive(b.closest('.row')); },
  addrow: b => {
    if(sess.done) return;
    const rows = b.previousElementSibling;
    rows.insertAdjacentHTML('beforeend', rowHTML());
    setActive(rows.lastElementChild);
  },
  delrow: b => {
    if(sess.done) return;
    const row = b.closest('.row'), rows = row.parentElement;
    if(rows.children.length > 1){ const wasActive = row === sess.active; row.remove(); if(wasActive) setActive(firstEmpty('d') || firstEmpty('c')); }
    else { delete row.dataset.acc; const ab=row.querySelector('.accbtn'); ab.textContent='勘定科目'; ab.classList.add('empty'); const a=row.querySelector('.amt'); if(a) a.value=''; setActive(row); }
  },
  hint: () => showHint(),
  ink: b => inkOp(b.closest('.inkbar').dataset.ink, b.dataset.op),
  pad: () => {
    const k = padKey(); S.set[k] = !S.set[k]; save();
    document.body.classList.toggle('pad-on', S.set[k]);
    document.querySelectorAll('.padbtn').forEach(x => x.classList.toggle('on', S.set[k]));
  },
  padside: () => setPadSide(!S.set.padLeft),
  padsideSet: b => { setPadSide(b.dataset.v === 'left'); renderSettings(); },
  exopen: b => startExam(b.dataset.id),
  exinput: b => setExInput(b.dataset.v),
  chs: b => chooseEx(b),
  exgrade: () => gradeExam(),
  mark: b => markEx(b),
  markrest: () => { Object.keys(ex.akeys).forEach(k => { if(ex.mk[k] === undefined) ex.mk[k] = true; }); paintMarks(); updateExScore(); },
  msec: b => showSec(+b.dataset.v),
  mockstart: async () => { const st = await DB.ink('mock:state').catch(() => null); if(st && !confirm('途中の模擬試験があります。破棄して新しく始めますか？')) return; startMock(); },
  mockresume: () => resumeMock(),
  exsave: () => saveExam(),
  exagain: () => ex.mode === 'mock' ? startMock() : startExam(ex.cfg.id),
  exlist: () => go('exams'),
  finger: () => {
    S.set.finger = !S.set.finger; save();
    Object.values(INKS).forEach(k => k.syncTouch());
    document.querySelectorAll('.fingerbtn').forEach(x => x.classList.toggle('on', S.set.finger));
    toast(S.set.finger ? '指で書けます（そのあいだ用紙はスクロールしません）' : '指はスクロール、書くのは Apple Pencil');
  },
  docopen: b => openDoc(b.dataset.id),
  docdel: b => delDoc(b.dataset.id),
  docshare: b => shareDoc(b.dataset.id),
  tomydocs: () => document.getElementById('mydocs')?.scrollIntoView({behavior:'smooth', block:'start'}),
  docans: () => showAnswers(),
  docfilter: () => toggleDocFilter(),
  pmark: b => markPage(b),
  pclear: () => clearPage(),
  docq: b => docGo(+b.dataset.v),
  docprob: () => openPad('prob'),
  padzoom: () => setZoom(),
  wiznew0: () => openWizard(null, null),
  wiznew: () => docv && openWizard(docv.id, null),
  wizadd: () => docv && openWizard(docv.id, docv.qi),
  wizmode: b => { document.getElementById('wiz-one').hidden = b.dataset.v !== 'one'; document.getElementById('wiz-bulk').hidden = b.dataset.v !== 'bulk'; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); },
  wizgroup: b => { wiz.group = +b.dataset.v; b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); bulkPreview(); },
  wizgo: () => { if(!wiz) return; const f = wiz.files; if(wiz.q == null && !f.prob.length){ toast('① 問題の写真を選んでください'); return; } if(!f.prob.length && !f.sheet.length && !f.ans.length){ toast('写真を選んでください'); return; } wizImport([f]); },
  wizbulk: () => { if(!wiz || !wiz.bulk.length) return; const g = wiz.group, roles = BULK_ROLES[g], groups = [];
    wiz.bulk.forEach((file, i) => { const gi = Math.floor(i/g); (groups[gi] = groups[gi] || {prob:[], sheet:[], ans:[]})[roles[i%g]].push(file); }); wizImport(groups); },
  padtab: b => setPadTab(b.dataset.v),
  ck: b => calcKey(b.dataset.k),
  calcins: () => calcInsert(),

  submit: () => grade(false),
  giveup: () => grade(true),
  next: () => next(),
  retry: () => startSession(shuffle(sess.wrong), 'review'),
  again: () => {
    const m = sess.mode;
    if(m === 'review') return wrongIds().length ? ACT.review() : ACT.smart();
    if(m === 'random') return ACT.start();
    if(m === 'cat') return ACT.catstart({dataset:{id:sess.catId}});
    ACT.smart();
  },
  oxans: b => answerOx(b.dataset.v === '1'),
  oxnext: () => oxNext(),
  export: () => {
    document.getElementById('exp').innerHTML = `<textarea readonly id="expText" style="margin-top:10px">${esc(JSON.stringify(S))}</textarea>
      <button class="btn primary" data-act="copy" style="margin-top:6px">コピーする</button>
      <p class="sub" style="margin:6px 0 10px">コピーした文字列をメモアプリなどに貼り付けて保存してください。</p>`;
  },
  copy: () => {
    const t = document.getElementById('expText');
    const done = () => toast('コピーしました');
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); });
    else { t.select(); document.execCommand('copy'); done(); }
  },
  import: () => {
    document.getElementById('imp').innerHTML = `<textarea id="impText" placeholder="バックアップの文字列を貼り付け" style="margin-top:10px"></textarea>
      <button class="btn primary" data-act="doimport" style="margin-top:6px">この内容で復元する</button>`;
  },
  doimport: () => {
    try{
      const s = JSON.parse(document.getElementById('impText').value);
      if(!s || typeof s.rec !== 'object') throw 0;
      if(!confirm('現在の記録を上書きして復元します。よろしいですか？')) return;
      localStorage.setItem(KEY, JSON.stringify(s)); S = load(); save(); toast('復元しました'); go('home');
    }catch(e){ toast('文字列の形式が正しくありません'); }
  },
  reset: () => {
    if(!confirm('学習記録（XP・バッジを含む）をすべて消去します。元に戻せません。よろしいですか？')) return;
    const set = S.set; S = defaults(); S.set = set; S.seenIntro = true; save(); toast('記録を消去しました'); go('home');
  },
};
document.addEventListener('click', e => {
  if(e.target.id === 'modal'){ closeModal(); return; }
  if(e.target.id === 'celebrate'){ closeCeleb(); return; }
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  ACT[b.dataset.act]?.(b);
});
// 過去問・問題集の取り込み
document.addEventListener('change', e => {
  if(e.target.id === 'docqsel'){ showDocQ(+e.target.value); return; }
  if(e.target.classList.contains('wizfile')){ wizSet(e.target.dataset.role, [...e.target.files]); return; }
  if(e.target.id === 'setfile'){ const f = e.target.files[0]; e.target.value = ''; if(f) importSetFile(f); return; }
  if(e.target.id === 'bulkfile' && wiz){ wiz.bulk = [...e.target.files]; bulkPreview(); return; }
});
// 本試験形式：数字入力欄は3桁カンマ、Enterで次の欄へ
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' || !e.target.matches?.('.exin, .jamt')) return;
  e.preventDefault(); const all = [...view.querySelectorAll('.msec.on .exin, .msec.on .jamt, .msec:only-of-type .exin')], i = all.indexOf(e.target);
  (all[i+1] || e.target).focus(); if(!all[i+1]) e.target.blur();
});
document.addEventListener('input', e => { if(e.target.matches?.('.exin, .jamt')) mockDirty(); });
document.addEventListener('change', e => { if(e.target.matches?.('.jsel')) mockDirty(); });
document.addEventListener('focusout', e => { if(e.target.matches?.('.exin, .jamt')){ const n = toNum(e.target.value); if(n !== null && Number.isInteger(n) && Math.abs(n) >= 1000) e.target.value = n.toLocaleString('ja-JP'); } });
// 金額入力：全角数字→半角、3桁カンマ区切り
document.addEventListener('input', e => {
  if(!e.target.classList.contains('amt')) return;
  const d = e.target.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'').slice(0,12);
  e.target.value = d ? Number(d).toLocaleString('ja-JP') : '';
});
// 金額欄をタップしたら、その行を選択中にする
document.addEventListener('focusin', e => { if(e.target.classList?.contains('amt') && sess && !sess.done) setActive(e.target.closest('.row')); });
// Enterキーで解答
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && cur==='quiz' && e.target.classList?.contains('amt')){ e.preventDefault(); if(!sess.done) grade(false); }
});

// iPad でアプリを切り替えたときも、模擬試験の途中経過を保存
document.addEventListener('visibilitychange', () => { if(document.hidden && cur === 'exsheet' && ex?.mode === 'mock' && !ex.graded){ clearTimeout(mockTimer); saveMockState(); } });
// スマホの「戻る」操作：出題中ならホームへ戻る（アプリからは抜けない）
window.addEventListener('popstate', () => {
  closeModal();
  if(cur === 'exsheet' && ex?.mode === 'mock' && !ex.graded){ clearTimeout(mockTimer); saveMockState(); }
  if(cur === 'exsheet' || cur === 'doc') go('exams');
  else if(PLAY.includes(cur)) leaveToHome();
});
if(location.hash === '#play') history.replaceState(null, '', location.pathname + location.search);

// 学習記録・取り込んだ写真が消えにくいよう、保存領域の保護をお願いする
try{ navigator.storage?.persist?.(); }catch(e){}
// オフラインでも開けるようにする（電車の中など）
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

checkBadges();
celebQ.length = 0; // 起動時は演出しない
setupPad();
go('home');
</script>
