<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簿記2級">
<meta name="description" content="日商簿記2級の仕訳問題をスマホで練習できるアプリ">
<title>簿記2級 仕訳トレーニング</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E簿%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --text:#1f2933; --sub:#5f6b7a; --line:#e2e6ea;
  --accent:#0f766e; --accent-weak:#e0f2f1; --accent-text:#ffffff;
  --debit:#1d4ed8; --debit-weak:#eff4ff; --credit:#c2410c; --credit-weak:#fff4ed;
  --ok:#15803d; --ok-weak:#e8f7ee; --ng:#dc2626; --ng-weak:#fdecec; --warn:#b45309; --warn-weak:#fff7e0;
  --yt:#c4302b; --yt-weak:#fdeceb; --gold:#d97706; --gold-weak:#fef3c7; --violet:#7c3aed; --violet-weak:#f1ebff;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111518; --card:#1b2126; --text:#e6e9ec; --sub:#9aa5b1; --line:#2d353c;
    --accent:#2dd4bf; --accent-weak:#123a37; --accent-text:#06201d;
    --debit:#7aa2ff; --debit-weak:#18223a; --credit:#ff9a62; --credit-weak:#3a2216;
    --ok:#4ade80; --ok-weak:#123222; --ng:#f87171; --ng-weak:#3a1717; --warn:#fbbf24; --warn-weak:#3a2e10;
    --yt:#ff7b72; --yt-weak:#3a1a19; --gold:#fbbf24; --gold-weak:#3a2e10; --violet:#b69cff; --violet-weak:#2a2140;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
#view{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.quiz #view{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 2px;line-height:1.35}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--line);color:var(--text);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.warn{background:var(--warn-weak);color:var(--warn)}
.btn.danger{background:var(--ng-weak);color:var(--ng)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.actions{display:flex;gap:8px}
.actions .btn{margin:0}
.actions .btn.ghost{flex:0 0 auto;width:auto;padding:14px 12px;font-size:14px}
.link{background:none;border:none;color:var(--sub);padding:6px 0;font-size:14px}

/* ---------- home ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.hello .sub{margin:0}
.lvcard{display:flex;align-items:center;gap:12px}
.lvbadge{flex:0 0 52px;height:52px;border-radius:14px;background:var(--violet-weak);color:var(--violet);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.lvbadge small{font-size:10px;font-weight:700}
.lvbadge b{font-size:20px}
.lvbody{flex:1;min-width:0}
.lvtitle{font-weight:800;font-size:15px}
.xpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#c084fc);border-radius:4px;transition:width .6s}
.today{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:0 0 84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .num b{font-size:22px}
.ring .num span{font-size:10px;color:var(--sub)}
.today-r{flex:1;min-width:0}
.kpis{display:flex;gap:14px;margin-bottom:6px}
.kpi b{font-size:18px;display:block;line-height:1.2}
.kpi span{font-size:11px;color:var(--sub)}
.week{display:flex;gap:5px;align-items:flex-end;height:44px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:18px;border-radius:4px;background:var(--line);min-height:4px}
.week i.on{background:var(--accent)}
.week i.goal{background:var(--gold)}
.week span{font-size:9px;color:var(--sub);line-height:1}
.week .t span{color:var(--text);font-weight:800}
.bigbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.bigbtn .ic{font-size:26px;line-height:1}
.bigbtn b{display:block;font-size:18px}
.bigbtn small{display:block;font-size:12px;font-weight:600;opacity:.85}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--shadow);transition:transform .08s;position:relative}
.quick button:active{transform:scale(.97)}
.quick button:disabled{opacity:.5}
.quick .ic{font-size:22px;line-height:1.2;display:block}
.quick b{display:block;font-size:15px;margin-top:2px}
.quick small{display:block;font-size:11px;color:var(--sub)}
.quick .dot{position:absolute;top:10px;right:10px;background:var(--ng);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;line-height:18px}
details.card>summary{list-style:none;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--sub)}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:12px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:9px 4px;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub)}
.chip.on{border-color:var(--accent);background:var(--accent-weak);color:var(--text);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:4px 0 6px}
.intro{border:2px solid var(--accent);background:var(--accent-weak)}
.intro ol{margin:6px 0 12px;padding-left:1.3em;font-size:14px;line-height:1.8}
.note{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 0}

/* ---------- quiz ---------- */
.qhead{position:sticky;top:0;z-index:6;background:var(--bg);margin:-16px -16px 0;padding:calc(8px + env(safe-area-inset-top)) 16px 2px}
.homebtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--text)}
.actions.sticky,.oxbtns.sticky{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,rgba(0,0,0,0))}
.resume{display:flex;align-items:center;gap:10px;border:2px solid var(--accent)}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block}
.resume .btn{width:auto;padding:10px 16px}
.amtchip{font-variant-numeric:tabular-nums;color:var(--accent)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtop-r{display:flex;align-items:center;gap:8px}
.prog{font-weight:700;font-size:14px;color:var(--sub)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;width:32px;height:32px;font-weight:800;color:var(--sub);padding:0}
.combo{font-weight:800;color:var(--gold);font-size:14px;animation:pop .35s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--sub)}
.tag.g1{background:var(--debit-weak);color:var(--debit)}
.tag.g2{background:var(--credit-weak);color:var(--credit)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.tag.new{background:var(--violet-weak);color:var(--violet)}
.stars{font-size:12px;color:var(--gold);letter-spacing:1px;margin-left:auto}
.stars .off{color:var(--line)}
.qtext{margin:0;font-size:16px;line-height:1.75}
.hist{margin:8px 0 0;font-size:12px;color:var(--sub)}
.pal-h{font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:600}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;line-height:1.3;transition:transform .08s}
.pchip:active{transform:scale(.95);border-color:var(--accent)}
.side{border-radius:12px;padding:10px;margin-bottom:10px}
.side.d{background:var(--debit-weak)}
.side.c{background:var(--credit-weak)}
.sh{font-weight:800;font-size:14px;margin:0 0 6px}
.sh small{font-weight:600;font-size:11px;opacity:.8}
.side.d .sh{color:var(--debit)}
.side.c .sh{color:var(--credit)}
.row{display:flex;gap:6px;margin-bottom:6px}
.accbtn,.row input{
  font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);
  padding:8px;min-width:0;height:46px;
}
.accbtn{flex:1.35;text-align:left;font-size:14px;font-weight:700;line-height:1.25;overflow:hidden}
.accbtn.empty{color:var(--sub);font-weight:500}
.row.active .accbtn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.row.active .accbtn.empty::after{content:" ← ここに入ります";font-size:11px;color:var(--accent)}
.row input{flex:1;text-align:right}
.row input:focus{outline:none;border-color:var(--accent)}
.row .del{flex:0 0 28px;border:none;background:transparent;color:var(--sub);font-size:18px;padding:0}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:9px;width:100%;padding:7px;font-size:13px;color:var(--sub)}
.locked .palette,.locked .pal-h,.locked .del,.locked .add{display:none}
.locked .accbtn,.locked input{opacity:.8}
.hintcard{background:var(--gold-weak);border-color:transparent}
.hintcard b{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- feedback ---------- */
.fb{border-width:2px}
.fb.ok{border-color:var(--ok)}
.fb.ng{border-color:var(--ng)}
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.verdict b{font-size:24px;font-weight:800;animation:pop .4s}
.fb.ok .verdict b{color:var(--ok)}
.fb.ng .verdict b{color:var(--ng)}
.xpgain{font-weight:800;color:var(--violet);font-size:14px;animation:rise .6s}
.combo-msg{font-weight:800;color:var(--gold);font-size:14px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
.jt{width:100%;border-collapse:collapse;table-layout:fixed;margin:4px 0 12px;font-size:14px}
.jt th{font-size:12px;padding:4px 6px;text-align:left}
.jt th:first-child{color:var(--debit);background:var(--debit-weak)}
.jt th:last-child{color:var(--credit);background:var(--credit-weak)}
.jt td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;word-break:break-all}
.jt td:first-child{border-right:1px solid var(--line)}
.jt .a{display:block;font-weight:600;line-height:1.35}
.jt .m{display:block;text-align:right;font-variant-numeric:tabular-nums}
.jt td.okc .a{color:var(--ok)}
.jt td.ngc{background:var(--ng-weak)}
.jt td.ngc .a{color:var(--ng)}
.jlabel{font-size:12px;font-weight:700;color:var(--sub);margin:6px 0 0}
.expl{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;line-height:1.75;margin:0}
.expl b{color:var(--accent)}
.point{background:var(--accent-weak);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.7;margin:4px 0 10px}
.point span,.trap span{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.point span{color:var(--accent)}
.trap{background:var(--warn-weak);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;margin:10px 0 0}
.trap span{color:var(--warn)}
.think-box{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.think-box summary{font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.think{list-style:none;margin:8px 0 0;padding:0}
.think li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.think .sub{font-size:12px}
.sd{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-top:2px}
.sd.d{background:var(--debit-weak);color:var(--debit)}
.sd.c{background:var(--credit-weak);color:var(--credit)}
.yts{display:flex;flex-wrap:wrap;gap:6px}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;color:var(--yt);background:var(--yt-weak);border-radius:8px;padding:7px 12px}
.yt svg{width:18px;height:18px;flex:0 0 18px}

/* ---------- ○× ---------- */
.oxq{font-size:15px;line-height:1.7;margin:0 0 10px}
.oxask{font-weight:800;font-size:14px;margin:4px 0 6px;color:var(--sub)}
.oxbtns{display:flex;gap:10px}
.oxbtns button{flex:1;border:none;border-radius:18px;padding:18px 0;font-size:30px;font-weight:800;line-height:1;transition:transform .08s}
.oxbtns button:active{transform:scale(.95)}
.oxbtns small{display:block;font-size:12px;margin-top:6px}
.oxo{background:var(--ok-weak);color:var(--ok)}
.oxx{background:var(--ng-weak);color:var(--ng)}
.card.flash-ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-weak)}
.card.flash-ng{border-color:var(--ng);box-shadow:0 0 0 3px var(--ng-weak)}

/* ---------- result ---------- */
.big{font-size:44px;font-weight:800;line-height:1.2;animation:pop .5s}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.rlist li:last-child{border-bottom:none}
.mk{font-weight:800;font-size:16px;line-height:1.3;min-width:18px}
.mk.o{color:var(--ok)} .mk.x{color:var(--ng)}
.gain{display:flex;justify-content:center;gap:18px;margin-top:10px}
.gain div b{display:block;font-size:20px}
.gain div span{font-size:11px;color:var(--sub)}

/* ---------- stats ---------- */
.cat{padding:10px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:none}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat-h b{font-size:14px}
.cat-h .rate{font-weight:800;font-size:15px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter span{display:block;height:100%;border-radius:4px}
.cat-f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.mini{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
a.mini{text-decoration:none;display:inline-block}
.r-good{color:var(--ok)} .r-mid{color:var(--warn)} .r-bad{color:var(--ng)} .r-none{color:var(--sub)}
.bg-good{background:var(--ok)} .bg-mid{background:var(--warn)} .bg-bad{background:var(--ng)}
.hero{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.3}
.stat span{font-size:11px;color:var(--sub)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{border-radius:12px;background:var(--bg);padding:8px 2px;text-align:center;font-size:10px;line-height:1.3;color:var(--sub)}
.badge i{display:block;font-style:normal;font-size:26px;line-height:1.3}
.badge.on{background:var(--gold-weak);color:var(--text);font-weight:700}
.badge:not(.on) i{filter:grayscale(1);opacity:.35}

/* ---------- settings ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:15px}
.set-row .d{font-size:12px;color:var(--sub)}
.switch{position:relative;width:52px;height:30px;flex:0 0 52px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(22px)}
input[type=date]{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);color:var(--text)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1.5px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--text)}
.help{font-size:14px;line-height:1.8;padding-left:1.2em;margin:0}

/* ---------- modal / celebration ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.basics{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.basics th,.basics td{padding:8px;border:1px solid var(--line);text-align:center}
.basics th:first-child{background:var(--debit-weak);color:var(--debit)}
.basics th:last-child{background:var(--credit-weak);color:var(--credit)}
#celebrate{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);padding:24px}
#celebrate.show{display:flex}
#celebrate .box{background:var(--card);border-radius:22px;padding:24px 20px;text-align:center;max-width:320px;width:100%;animation:pop .4s}
#celebrate .ic{font-size:56px;line-height:1.2}
#celebrate h2{margin:6px 0 4px;font-size:20px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}

/* ---------- nav ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#nav button{flex:1;border:none;background:none;padding:8px 0 10px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--accent);font-weight:700}
body.quiz #nav{display:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

s05:{p:'クレジット販売は、手数料を差し引いた額を「クレジット売掛金」にする。',t:'手数料を払うのはこちらなので「受取手数料」ではなく「支払手数料」（費用）。売上は手数料を引く前の金額です。'},
s06:{p:'サービス業は、サービスを提供し終えたら「役務収益」を計上する。',t:'物を売るのではないので「売上」ではありません。前受金で受け取っていたら、前受金（負債）を減らします。'},
s07:{p:'返品は、売上の仕訳を逆にするだけ。',t:'返品された分だけ「売上」を取り消し、売掛金も減らします。'},
t01:{p:'電子記録債務は「電子版の支払手形」。',t:'発生記録で 買掛金 → 電子記録債務 に置き換わります。受け取る側は電子記録債権（電子版の受取手形）です。'},
t02:{p:'電子記録債権の割引・譲渡で生じた損は「電子記録債権売却損」。',t:'手形なら「手形売却損」、電子記録債権なら「電子記録債権売却損」。科目名をセットで覚えましょう。支払利息ではありません。'},
t03:{p:'裏書譲渡は「持っている受取手形を相手に渡す」だけ。',t:'支払手形を使いたくなりますが、自分が振り出した手形ではありません。手元から受取手形が出ていく（資産の減少＝貸方）です。'},
t04:{p:'手形の割引＝手形を銀行に売ること。割引料は「手形売却損」。',t:'「割引料＝利息っぽいから支払利息」はひっかけ。2級では手形売却損で処理します。'},
t05:{p:'不渡りになったら「受取手形」→「不渡手形」に振り替える。',t:'償還請求にかかった費用も相手に請求できるので、費用にせず不渡手形に含めます。'},
t06:{p:'商品以外の売却で受け取った手形は「営業外受取手形」。',t:'受取手形は商品売買（本業）専用。売却益は「売価 −（取得原価 − 減価償却累計額）」で計算します。'},
t07:{p:'商品以外の購入で振り出した手形は「営業外支払手形」。',t:'支払手形は商品の仕入専用。備品の後払いが手形でなければ「未払金」ですが、手形なら営業外支払手形です。'},
y01:{p:'有価証券の購入手数料は取得原価に含める。',t:'手数料を支払手数料にしないこと。有価証券は商品ではないので、代金の後払いは買掛金ではなく未払金です。'},
y02:{p:'有価証券売却益（損）＝ 売却価額 − 帳簿価額。',t:'代金の後受けは売掛金ではなく「未収入金」。商品以外のツケは「未」のつく科目、と覚えましょう。'},
y03:{p:'社債を買うとき前の持ち主に払う端数利息は「有価証券利息」の借方。',t:'「払ったから支払利息？」はひっかけ。次の利払日に利息をまるごと受け取るので、先に払った分を有価証券利息のマイナスにしておく、という考え方です。'},
y04:{p:'償却原価法（定額法）＝ 額面との差額を毎期少しずつ帳簿価額に足していく。',t:'相手科目は「有価証券利息」（収益）。差額は金利の調整なので評価損益ではありません。年数で割るのを忘れずに。'},
y05:{p:'その他有価証券の評価差額は、損益にせず純資産へ（全部純資産直入法）。',t:'売買目的 →「有価証券評価損益」（損益計算書）、その他 →「その他有価証券評価差額金」（貸借対照表の純資産）。保有目的で行き先が変わります。'},
y06:{p:'売買目的有価証券は決算で時価に評価替えし、差額は「有価証券評価損益」。',t:'時価が下がれば借方（損）、上がれば貸方（益）。売っていないので「売却損益」ではありません。'},
y07:{p:'支配している会社（50%超）の株式は「子会社株式」。',t:'20%以上で重要な影響を与える会社なら関連会社株式。子会社株式・関連会社株式は決算で時価評価しない（取得原価のまま）のもポイントです。'},
k01:{p:'完成前に払った工事代金は「建設仮勘定」。完成・引渡しで建物へ振り替える。',t:'「建設仮勘定を建物に振り替える」＋「残りを支払う」を1本の仕訳にまとめます。前払金ではありません。'},
k02:{p:'価値アップ ＝ 資本的支出（資産に加算）、元に戻すだけ ＝ 収益的支出（修繕費）。',t:'「改良」「耐用年数の延長」というキーワードがあれば資本的支出です。'},
k03:{p:'除却＝使うのをやめること。処分価値は「貯蔵品」、残りは「固定資産除却損」。',t:'売ったわけではないので「売却損」ではありません。除却損 ＝ 帳簿価額 − 見積処分価額。'},
k04:{p:'期中に売ったら、まず当期分の減価償却費（月割）を計上してから売却損益を出す。',t:'4月〜7月は4か月。月数の数え間違いが一番多いミスです。帳簿価額 ＝ 取得原価 − 期首累計額 − 当期の減価償却費。'},
k05:{p:'圧縮記帳（直接減額方式）＝ 補助金の分だけ資産を減らし「固定資産圧縮損」を計上。',t:'国庫補助金受贈益（収益）と圧縮損（費用）が打ち消し合い、補助金を受け取った年に税金がかからないようにする仕組みです。'},
k06:{p:'ファイナンス・リースは「借りているけど実質は買った」。利子抜き法は見積現金購入価額で計上。',t:'利子込み法ならリース料総額（120,000円×5年＝600,000円）。「支払リース料」はオペレーティング・リースで使う科目なのでひっかけです。'},
k07:{p:'利子抜き法のリース料の支払い ＝「リース債務の返済」＋「支払利息」。',t:'利息総額（リース料総額 − 見積現金購入価額）÷ 年数 ＝ 1年分の利息。利子込み法なら支払利息は出てきません。'},
k08:{p:'無形固定資産（ソフトウェア・のれん）は直接法で償却する。',t:'減価償却累計額は使いません。科目名も「ソフトウェア償却」。自社利用のソフトウェアは5年以内の定額法が基本です。'},
k09:{p:'保険金額が決まるまでは、帳簿価額を「未決算」に振り替えておく。',t:'すぐ火災損失にしないこと。保険金が確定してから損失か差益かが決まります（次の問題とセットで覚えましょう）。'},
k10:{p:'保険金が確定したら未決算を取り崩し、差額を「火災損失」か「保険差益」に。',t:'保険金 ＜ 未決算 → 火災損失（費用）、保険金 ＞ 未決算 → 保険差益（収益）。'},
h01:{p:'前期以前の債権が貸し倒れたら、まず貸倒引当金を使う。足りない分は貸倒損失。',t:'「いつ発生した債権か」で処理が変わります。次の問題（当期に発生した債権）と見比べておきましょう。'},
h02:{p:'当期に発生した債権の貸倒れは、引当金を使わず全額「貸倒損失」。',t:'貸倒引当金は前期末に「前期までの債権」のために設定したもの。当期の債権には使えません。'},
h03:{p:'前期に売った商品の保証修理は、商品保証引当金を取り崩す。',t:'当期に売った商品の修理なら引当金はないので、費用（商品保証費など）になります。'},
h04:{p:'決算で当期負担分を見積もり「賞与引当金繰入 ／ 賞与引当金」。',t:'繰入 ＝ 費用、引当金 ＝ 負債。引当金の設定はいつも「〇〇引当金繰入 ／ 〇〇引当金」の形です。'},
h05:{p:'支給時は、引当金を設定していた分は取り崩し、超えた分は「賞与」。',t:'前期の決算で費用にした分（引当金）を、当期にもう一度費用にしないための処理です。'},
h06:{p:'退職金の支払いは退職給付引当金を取り崩す。',t:'「退職給付費用」は決算で引当金を設定するときの科目。支払時には使いません。'},
h07:{p:'修繕引当金を取り崩し、超える分は修繕費。',t:'引当金の取崩しはどれも同じ形。超過分は普通の費用です。'},
g01:{p:'外貨建取引は、取引日の為替相場（HR）で円に換算する。',t:'外貨 × レート で円にするだけ。この時点では為替差損益は出ません。'},
g02:{p:'決済時のレートとの差は「為替差損益」。',t:'買掛金（負債）は、円安なら支払いが増えて損、円高なら支払いが減って益。今回は150円→148円の円高なので益（貸方）です。'},
g03:{p:'決算では、売掛金・買掛金などの外貨建の金銭債権債務を決算日レート（CR）で換算替えする。',t:'前払金・前受金・商品などは換算替えしません（すでにお金のやり取りが済んでいるため）。'},
g04:{p:'前払金は支払ったときのレートのまま。残りだけ当日のレートで換算する。',t:'仕入の金額は「前払金 ＋ 買掛金」の合計。仕入全体を当日レートで計算するのはひっかけです。'},
g05:{p:'取引と同時に為替予約をしたら、予約レートで換算する（振当処理）。',t:'予約したので為替変動の影響を受けず、為替差損益は出ません。直物レート150円はひっかけの数字です。'},
z01:{p:'法人税等の中間納付は「仮払法人税等」（資産）。',t:'1年分の税額がまだ確定していないので、いったん「仮払」にします。決算で法人税等に振り替えます。'},
z02:{p:'決算で1年分の法人税等を計上し、中間納付分を差し引いた残りが「未払法人税等」。',t:'仮払法人税等を取り崩すのを忘れずに。費用の科目名は「法人税、住民税及び事業税」です。'},
z03:{p:'決算で仮受消費税と仮払消費税を相殺し、差額を「未払消費税」にする。',t:'受け取った消費税（仮受）＞ 支払った消費税（仮払）なら納付 ＝ 未払消費税。逆なら還付 ＝ 未収還付消費税です。'},
z04:{p:'税抜方式では、支払った消費税を「仮払消費税」として分けて記録する。',t:'税込金額 ÷ 1.1 ＝ 本体価格。仕入は本体価格だけで記録します。'},
z05:{p:'税法とのズレ（将来減算一時差異）× 税率 ＝ 繰延税金資産。相手は「法人税等調整額」。',t:'損金不算入 ＝ 今は税金を多めに払っている → 将来取り戻せるので「資産」。'},
z06:{p:'その他有価証券の評価差額に税効果を適用すると、税率分は繰延税金負債（資産）、残りが評価差額金。',t:'評価差額金は純資産に直接入るので「法人税等調整額」は使いません。ここが最大のひっかけです。'},
j01:{p:'株式の払込金額のうち、最低2分の1を資本金、残りを資本準備金にできる。',t:'「会社法が定める最低限度額」＝ 2分の1。この指示がなければ全額資本金です。'},
j02:{p:'払込期日に「株式申込証拠金 → 資本金・資本準備金」と「別段預金 → 当座預金」の2つを行う。',t:'申込証拠金を受け取った時点ではまだ株主ではないので、資本金ではなく株式申込証拠金で処理していました。'},
j03:{p:'利益準備金 ＝ 配当額の10分の1。ただし準備金の合計が資本金の4分の1に達するまで。',t:'「配当額 × 1/10」と「資本金 × 1/4 − 準備金合計」の小さい方。配当金はすぐ払わないので「未払配当金」（負債）です。'},
j04:{p:'当期純利益は、損益勘定から繰越利益剰余金へ振り替える。',t:'純利益 ＝ 損益勘定の貸方残高。借方に記入して残高をゼロにし、繰越利益剰余金（純資産）を増やします。'},
j05:{p:'合併では、受け入れた純資産（時価）と交付した株式との差額が「のれん」。',t:'資産・負債は「時価」で受け入れます。対価の方が大きければのれん（資産）、小さければ負ののれん発生益（収益）。'},
j06:{p:'のれんは20年以内に定額法・直接法で償却する。',t:'減価償却累計額は使いません。科目は「のれん償却」です。'},
b01:{p:'本店の帳簿では、支店とのやり取りはすべて「支店」勘定で処理する。',t:'本店の「支店」勘定と支店の「本店」勘定は、いつも貸借逆で同じ金額になります（照合勘定）。'},
b02:{p:'支店の帳簿では、本店とのやり取りはすべて「本店」勘定で処理する。',t:'本店側の仕訳（支店 ／ 仕入）とセットで考えると間違えません。'},
b03:{p:'支店に立て替えてもらった → 本店は「支店」勘定の貸方（支店への借り）。',t:'自分の帳簿にどの勘定があるかを意識しましょう。本店の帳簿に「本店」勘定はありません。'},
b04:{p:'研究開発のためだけに使うものは、すべて「研究開発費」（費用）。',t:'機械を買っても「機械装置」にせず、給料も「給料」にしないのがポイントです。'},
r01:{p:'子会社の資本と親会社の投資（子会社株式）を消し、差額は「のれん」、外部株主の分は「非支配株主持分」。',t:'連結では「資本金」「利益剰余金」を使います。非支配株主持分 ＝ 子会社の資本 × 非支配株主の割合。'},
r02:{p:'連結上ののれんも定額法で償却し「のれん償却」とする。',t:'金額 ÷ 年数。個別会計ののれんと同じ考え方です。'},
r03:{p:'子会社の利益のうち非支配株主の分は「非支配株主に帰属する当期純利益」に振り替える。',t:'子会社の当期純利益 × 非支配株主の持分割合。同じ金額だけ非支配株主持分も増えます。'},
r04:{p:'グループ内の売買は「売上高」と「売上原価」を相殺消去する。',t:'連結では「売上」ではなく「売上高」、「仕入」ではなく「売上原価」を使います。'},
r05:{p:'グループ内の債権と債務（売掛金と買掛金など）を相殺消去する。',t:'貸倒引当金を設定している場合は、その調整も必要になります（今回は考慮しない）。'},
m01:{p:'材料の購入原価 ＝ 購入代価 ＋ 付随費用（引取運賃など）。',t:'引取運賃を費用にしないこと。3級の「仕入諸掛」と同じ考え方です。'},
m02:{p:'特定の製品に使った材料 ＝ 仕掛品、共通的に使った材料 ＝ 製造間接費。',t:'「製造指図書No.〇」と書いてあれば直接材料費 → 仕掛品。補修用・消耗品などは間接材料費 → 製造間接費。'},
m03:{p:'材料消費価格差異 ＝（予定価格 − 実際価格）× 実際消費量。マイナスなら不利差異（借方）。',t:'必ず「予定 − 実際」の順で計算。マイナス ＝ 借方差異（不利）、プラス ＝ 貸方差異（有利）。'},
m04:{p:'正常な範囲の棚卸減耗は間接経費 ＝ 製造間接費。',t:'帳簿 − 実地 ＝ 減耗額。異常な減耗なら原価に含めません（非原価項目）。'},
w01:{p:'賃金を支払ったら、総額を「賃金・給料」の借方に記入する。',t:'源泉所得税などを差し引いた分は「預り金」（負債）。会社が後で納めます。'},
w02:{p:'直接工の直接作業時間 ＝ 直接労務費（仕掛品）、間接作業時間と間接工 ＝ 間接労務費（製造間接費）。',t:'直接工でも「間接作業」の時間分は製造間接費！ここが一番のひっかけです。'},
w03:{p:'賃率差異 ＝ 予定消費額 − 実際消費額。マイナスなら不利差異（借方）。',t:'予定で消費した額と実際の差を、賃金・給料勘定から賃率差異勘定へ振り替えます。'},
w04:{p:'要支払額 ＝ 当月支払高 − 前月末未払高 ＋ 当月末未払高。',t:'「前月分を引いて、今月分を足す」。間接工の賃金は製造間接費へ。'},
e01:{p:'予定配賦額 ＝ 予定配賦率 × 実際の配賦基準（直接作業時間など）。',t:'製造間接費（集めた箱）から仕掛品へ移すので「仕掛品 ／ 製造間接費」。'},
e02:{p:'配賦差異 ＝ 予定配賦額 − 実際発生額。マイナス（配賦不足）なら不利差異（借方）。',t:'実際の方が多い ＝ 予定では足りなかった（配賦不足）＝ 不利差異。製造間接費勘定に残った分を差異勘定へ移します。'},
e03:{p:'外注加工賃は特定の製品のための「直接経費」＝ 仕掛品。',t:'直接経費の代表は外注加工賃と特許権使用料。それ以外の経費はたいてい間接経費です。'},
e04:{p:'電力料・ガス代・水道料は、その月の測定額を間接経費（製造間接費）にする。',t:'支払額ではなく「測定額」を使うのがポイントです。'},
e05:{p:'工場の機械の減価償却費は間接経費 ＝ 製造間接費。',t:'本社（営業部門）の減価償却費なら、製造原価ではなく販売費及び一般管理費になります。'},
p01:{p:'完成したら仕掛品から製品へ振り替える。',t:'仕掛品 ＝ 作りかけ、製品 ＝ 完成品（どちらも資産）。'},
p02:{p:'製品を売ったら「売上」と「製品 → 売上原価」の2本の仕訳。',t:'商業簿記の売上原価対立法と同じ形。「商品」が「製品」に変わるだけです。'},
p03:{p:'標準原価計算では、完成品は「標準原価 × 数量」で製品勘定へ振り替える。',t:'パーシャル・プランでもシングル・プランでも、完成品は標準原価で記入します。'},
p04:{p:'パーシャル・プランは、仕掛品勘定の借方に「実際原価」を記入する。',t:'シングル・プラン ＝ 仕掛品勘定はすべて標準原価、パーシャル・プラン ＝ 投入は実際原価・完成品は標準原価。'},
p05:{p:'不利差異（借方残高）は、年度末に売上原価に加算する。',t:'差異勘定の反対側（貸方）に記入して残高をゼロにするイメージです。'},

function defaults(){
  return {v:2, rec:{}, days:{}, xp:0, badges:{}, ox:{n:0, c:0}, best:{combo:0, perfect:false, oxTime:0}, seenIntro:false,
          set:{amount:true, scope:'all', cats:[], count:10, exam:'', goal:10}};
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && s.rec){
      const d = defaults();
      const m = {...d, ...s, set:{...d.set, ...(s.set||{})}, best:{...d.best, ...(s.best||{})}, ox:{...d.ox, ...(s.ox||{})}, badges:s.badges||{}};
      if(typeof s.xp !== 'number'){ // 旧バージョンの記録からXPを引き継ぐ
        m.xp = Object.values(s.rec).reduce((a, r) => a + r.c*10 + (r.n - r.c)*2, 0);
        m.seenIntro = Object.keys(s.rec).length > 0;
      }
      return m;
    }
  }catch(e){}
  return defaults();
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('記録を保存できませんでした（プライベートブラウズでは保存されません）'); } }

function todayKey(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function countToday(){ const t = todayKey(); S.days[t] = (S.days[t]||0) + 1; }
function record(id, ok){
  const r = S.rec[id] || {n:0, c:0};
  if(r.s === undefined) r.s = r.last ? 1 : 0;
  r.n++; if(ok) r.c++; r.last = ok; r.s = ok ? r.s + 1 : 0; r.ts = Date.now();
  S.rec[id] = r;
  countToday(); save();
}
function wrongIds(){ return QS.filter(q => S.rec[q.id] && S.rec[q.id].last === false).map(q => q.id); }
function stars(id){ const r = S.rec[id]; if(!r) return 0; return Math.min(r.s !== undefined ? r.s : (r.last ? 1 : 0), 3); }
function masteredCount(){ return QS.filter(q => stars(q.id) >= 3).length; }
function totalAnswers(){ return Object.values(S.days).reduce((a, b) => a + b, 0); }
function streak(){
  let n = 0; const d = new Date();
  if(!S.days[todayKey(d)]) d.setDate(d.getDate()-1);
  while(S.days[todayKey(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

function lvInfo(xp){
  let lv = 1, need = 100, rest = xp;
  while(rest >= need){ rest -= need; lv++; need = 100 + (lv-1)*20; }
  const title = TITLES.filter(t => lv >= t[0]).pop()[1];
  return {lv, cur:rest, need, title};
}

const celebQ = [];
let celebTimer;
function closeCeleb(){ clearTimeout(celebTimer); document.getElementById('celebrate').classList.remove('show'); flushCelebrate(); }
function queueCelebrate(icon, title, sub, big){ celebQ.push({icon, title, sub, big}); }
function flushCelebrate(){
  const el = document.getElementById('celebrate');
  if(el.classList.contains('show') || !celebQ.length) return;
  const c = celebQ.shift();
  el.innerHTML = `<div class="box"><div class="ic">${c.icon}</div><h2>${esc(c.title)}</h2><p class="sub" style="margin:0 0 16px">${esc(c.sub)}</p><button class="btn primary" data-act="closeCeleb">やったね！</button></div>`;
  el.classList.add('show');
  clearTimeout(celebTimer); celebTimer = setTimeout(closeCeleb, 3500);
  confetti(c.big ? 140 : 70); buzz([20, 40, 20]);
}
function confetti(n = 80){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#0f766e','#2dd4bf','#f59e0b','#ef4444','#7c3aed','#3b82f6','#22c55e'];
  const ps = Array.from({length:n}, () => ({x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4,
    s:Math.random()*6+4, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if(p.y < H + 20){ alive++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
    });
    if(alive && ++frames < 240) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  })();
}
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- おすすめ出題（苦手・復習時期・未学習を優先） ---------- */
const DAY = 86400000, GAP = [0, 1, 3, 7, 14];
function smartPick(n, pool = QS){
  const now = Date.now();
  return pool.map(q => {
    const r = S.rec[q.id]; let w;
    if(!r) w = 1.6;                       // 未学習
    else if(r.last === false) w = 3;      // 前回まちがえた
    else {
      const s = Math.min(r.s !== undefined ? r.s : 1, 4);
      w = (now - (r.ts||0) >= GAP[s]*DAY) ? (s >= 3 ? 1.2 : 2) : 0.15; // 復習のタイミングが来たか
    }
    return {id:q.id, k:Math.pow(Math.random(), 1/w)};
  }).sort((a, b) => b.k - a.k).slice(0, n).map(o => o.id);
}

let sess = null;
function startSession(ids, mode, extra = {}){
  if(!ids.length){ toast('出題できる問題がありません'); return; }
  sess = {ids, mode, i:0, results:[], combo:0, xp:0, newBadges:[], ...extra};
  saveResume(0);
  go('quiz'); renderQuiz();
}
// 途中で抜けても「続きから」再開できるように、進み具合を保存
function saveResume(nextI){
  if(nextI >= sess.ids.length) delete S.resume;
  else S.resume = {ids:sess.ids, mode:sess.mode, i:nextI, results:sess.results, combo:sess.combo, xp:sess.xp, catId:sess.catId};
  save();
}
function resumeSession(){
  const r = S.resume; if(!r) return;
  const ids = r.ids.filter(id => QMAP[id]);
  if(r.i >= ids.length){ delete S.resume; save(); renderHome(); return; }
  sess = {ids, mode:r.mode, i:r.i, results:(r.results||[]).filter(x => QMAP[x.id]), combo:r.combo||0, xp:r.xp||0, catId:r.catId, newBadges:[]};
  go('quiz'); renderQuiz();
}

function fillChip(acc){
  if(sess.done) return;
  let row = sess.active || firstEmpty('d') || firstEmpty('c');
  if(!row){ toast('入れたい欄をタップするか、行を追加してください'); return; }

  const b = row.querySelector('.accbtn'); b.textContent = acc; b.classList.remove('empty');
  buzz(8);

function collect(side){
  const lines = []; let err = null;
  view.querySelectorAll(`.rows[data-side="${side}"] .row`).forEach(r => {
    const a = r.dataset.acc || '';
    const amtEl = r.querySelector('.amt');
    const raw = amtEl ? amtEl.value.replace(/[^0-9]/g,'') : '';
    if(!a && !raw) return;
    if(!a){ err = '勘定科目が入っていない行があります'; return; }
    if(S.set.amount && !raw){ err = '金額が入力されていない行があります'; return; }
    lines.push([a, S.set.amount ? Number(raw) : 0]);
  });
  return {lines, err};
}
function jtable(d, c, opt = {}){
  const n = Math.max(d.length, c.length, 1);
  const cell = (l, side) => {
    if(!l) return '<td></td>';
    let cls = '';
    if(opt.check){ const m = opt.check[side]; cls = (m.has(l[0]) && (!opt.useAmt || m.get(l[0])===l[1])) ? 'okc' : 'ngc'; }
    return `<td class="${cls}"><span class="a">${esc(l[0])}</span>${opt.noAmt?'':`<span class="m">${yen(l[1])}</span>`}</td>`;
  };
  let h = '<table class="jt"><thead><tr><th>借方</th><th>貸方</th></tr></thead><tbody>';
  for(let i=0;i<n;i++) h += `<tr>${cell(d[i],'d')}${cell(c[i],'c')}</tr>`;
  return h + '</tbody></table>';
}

function grade(giveup){
  if(sess.done) return;
  const q = QMAP[sess.ids[sess.i]];
  const useAmt = S.set.amount;
  let ok = false, ud = [], uc = [];
  if(!giveup){
    const D = collect('d'), C = collect('c');
    if(D.err || C.err){ toast(D.err || C.err); return; }
    if(!D.lines.length || !C.lines.length){ toast('借方・貸方の両方を入力してください'); return; }
    const um = {d:merge(D.lines), c:merge(C.lines)};
    ud = [...um.d]; uc = [...um.c];
    ok = sameMap(um.d, merge(q.d), useAmt) && sameMap(um.c, merge(q.c), useAmt);
  }
  sess.done = true;
  record(q.id, ok);
  sess.results.push({id:q.id, ok});
  sess.combo = ok ? sess.combo + 1 : 0;
  saveResume(sess.i + 1);
  if(sess.combo > S.best.combo) S.best.combo = sess.combo;
  if(ok && sess.mode === 'review') S.best.revenge = (S.best.revenge||0) + 1;
  const xp = ok ? (sess.hint ? 5 : 10) + (sess.combo >= 3 ? 5 : 0) : (giveup ? 1 : 2);
  sess.xp += xp; addXP(xp);
  checkBadges();
  setActive(null);
  document.getElementById('ans').classList.add('locked');
  view.querySelectorAll('#ans input, #ans .accbtn').forEach(el => el.disabled = true);
  const last = sess.i === sess.ids.length-1;
  const yours = giveup ? '' : `<p class="jlabel">あなたの解答</p>${jtable(ud, uc, {check:{d:merge(q.d), c:merge(q.c)}, useAmt, noAmt:!useAmt})}`;
  const verdict = ok ? `<b>○ 正解！</b><span class="xpgain">+${xp} XP</span>${sess.combo>=2?`<span class="combo-msg">🔥 ${sess.combo}連続正解！</span>`:''}`
                     : `<b>${giveup?'答えはこちら':'× おしい！'}</b><span class="xpgain">+${xp} XP</span>`;
  document.getElementById('fb').innerHTML = `
    <div class="card fb ${ok?'ok':'ng'}" id="fbcard">
      <div class="verdict">${verdict}<span style="margin-left:auto">${starHTML(q.id)}</span></div>
      <p class="jlabel">正解の仕訳</p>
      ${jtable(q.d, q.c)}
      ${ok ? '' : yours}
      ${explainHTML(q, ok)}
    </div>`;
  document.getElementById('actions').innerHTML = `<button class="btn primary" data-act="next">${last?'結果を見る':'次の問題へ →'}</button>`;
  if(ok){ confetti(sess.combo >= 3 ? 60 : 30); buzz(15); }
  else { document.getElementById('ans').classList.add('shake'); buzz([30, 50, 30]); }
  setTimeout(() => document.getElementById('fbcard')?.scrollIntoView({behavior:'smooth', block:'start'}), ok ? 250 : 400);
  flushCelebrate();
}

/* =========================================================
   ○×スピード（表示された仕訳が正しいか1タップで答える）
   ========================================================= */
let oxs = null, oxTimer = null;
function makeOx(q){
  if(Math.random() < 0.5) return {id:q.id, d:q.d, c:q.c, truth:true};
  const nums = [...new Set((q.q.match(/[\d,]+(?=円)/g)||[]).map(s => +s.replace(/,/g,'')).filter(n => n >= 1000))];
  for(let k = 0; k < 12; k++){
    let d = q.d.map(l => [...l]), c = q.c.map(l => [...l]);
    const kind = pick(['swap','acc','acc','amt']);
    if(kind === 'swap'){ [d, c] = [c, d]; }
    else if(kind === 'acc'){
      const used = new Set([...d, ...c].map(l => l[0])), cands = q.x.filter(x => !used.has(x));
      if(!cands.length) continue;
      pick([...d, ...c])[0] = pick(cands);
    } else {
      if(d.length === 1 && c.length === 1){ const alt = nums.filter(n => n !== d[0][1]); if(!alt.length) continue; d[0][1] = c[0][1] = pick(alt); }
      else { const l = pick([...d, ...c]), alt = nums.filter(n => n !== l[1]); if(!alt.length) continue; l[1] = pick(alt); }
    }
    if(!(sameMap(merge(d), merge(q.d), true) && sameMap(merge(c), merge(q.c), true))) return {id:q.id, d, c, truth:false};
  }
  return {id:q.id, d:q.d, c:q.c, truth:true};
}
function startOx(){
  oxs = {cards:smartPick(10).map(id => makeOx(QMAP[id])), i:0, ok:0, combo:0, xp:0, t0:Date.now(), results:[]};
  sess = {newBadges:[]};
  go('ox'); renderOx();
  oxTimer = setInterval(() => { const t = document.getElementById('oxtime'); if(t) t.textContent = ((Date.now()-oxs.t0)/1000).toFixed(1)+'秒'; }, 100);
}
function renderOx(){
  const card = oxs.cards[oxs.i], q = QMAP[card.id], cat = CMAP[q.cat];
  oxs.answered = false;
  view.innerHTML = `
    <div class="qhead"><div class="qtop"><button class="homebtn" data-act="home">🏠 ホーム</button>
      <div class="qtop-r">${oxs.combo>=2?`<span class="combo">🔥${oxs.combo}</span>`:''}<span class="timer" id="oxtime">${((Date.now()-oxs.t0)/1000).toFixed(1)}秒</span><span class="prog">${oxs.i+1} / ${oxs.cards.length}</span></div></div>
    <div class="bar"><span style="width:${oxs.i/oxs.cards.length*100}%"></span></div></div>
    <div class="card" id="oxcard">
      <div class="tags"><span class="tag ${cat.grp==='商業'?'g1':'g2'}">${cat.grp}簿記</span><span class="tag">${esc(cat.name)}</span></div>
      <p class="oxq">${esc(q.q)}</p>
      <p class="oxask">この仕訳は正しい？</p>
      ${jtable(card.d, card.c)}
    </div>
    <div id="oxfb"></div>
    <div class="oxbtns sticky" id="oxbtns">
      <button class="oxo" data-act="oxans" data-v="1">○<small>正しい</small></button>
      <button class="oxx" data-act="oxans" data-v="0">×<small>まちがい</small></button>
    </div>`;
}
function answerOx(choice){
  if(oxs.answered) return;
  oxs.answered = true;
  const card = oxs.cards[oxs.i], q = QMAP[card.id], ok = (choice === card.truth);
  oxs.results.push({id:card.id, ok});
  S.ox.n++; if(ok){ S.ox.c++; oxs.ok++; }
  oxs.combo = ok ? oxs.combo + 1 : 0;
  if(oxs.combo > S.best.combo) S.best.combo = oxs.combo;
  const xp = ok ? 3 : 1; oxs.xp += xp;
  countToday(); addXP(xp); checkBadges();
  document.getElementById('oxcard').classList.add(ok ? 'flash-ok' : 'flash-ng');
  const lastCard = oxs.i === oxs.cards.length - 1;
  if(ok && card.truth){
    buzz(12); confetti(20);
    document.getElementById('oxfb').innerHTML = `<div class="verdict center" style="justify-content:center"><b style="color:var(--ok)">○ 正解！</b><span class="xpgain">+${xp} XP</span></div>`;
    document.getElementById('oxbtns').style.visibility = 'hidden';
    setTimeout(() => { if(celebQ.length){ flushCelebrate(); showOxNext(lastCard); } else oxNext(); }, 650);
    return;
  }
  if(ok) buzz(12); else { buzz([30,50,30]); document.getElementById('oxcard').classList.add('shake'); }
  document.getElementById('oxfb').innerHTML = `
    <div class="card fb ${ok?'ok':'ng'}">
      <div class="verdict"><b>${ok?'○ 正解！':'× ざんねん'}</b><span class="xpgain">+${xp} XP</span></div>
      <p style="margin:0 0 4px;font-size:14px">${card.truth ? 'さっきの仕訳は<b>正しい</b>仕訳でした。' : 'さっきの仕訳は<b>まちがい</b>。正しくはこちら：'}</p>
      ${card.truth ? '' : jtable(q.d, q.c)}
      <div class="point"><span>💡 ポイント</span>${esc(EX[q.id].p)}</div>
    </div>`;
  showOxNext(lastCard);
  flushCelebrate();
}
function showOxNext(lastCard){
  document.getElementById('oxbtns').outerHTML = `<div class="actions sticky" id="oxbtns"><button class="btn primary" data-act="oxnext">${lastCard?'結果を見る':'次へ →'}</button></div>`;
}
function oxNext(){
  if(oxs.i < oxs.cards.length - 1){ oxs.i++; renderOx(); window.scrollTo(0,0); }
  else oxDone();
}
function oxDone(){
  clearInterval(oxTimer);
  cur = 'done';
  const n = oxs.cards.length, sec = (Date.now() - oxs.t0)/1000;
  let best = '';
  if(oxs.ok === n){
    if(!S.best.oxTime || sec < S.best.oxTime){ best = '<p style="margin:6px 0 0;font-weight:800;color:var(--gold)">🏁 全問正解の自己ベスト更新！</p>'; S.best.oxTime = sec; }
    confetti(120);
  }
  save();
  const wrongCats = [...new Set(oxs.results.filter(r=>!r.ok).map(r=>QMAP[r.id].cat))];
  view.innerHTML = `
    <div class="card center">
      <p class="sub" style="margin:0">⚡ ○×スピードの結果</p>
      <div class="big">${oxs.ok} / ${n}</div>
      <p style="margin:0;font-weight:700">タイム ${sec.toFixed(1)}秒${S.best.oxTime?`（全問正解ベスト ${S.best.oxTime.toFixed(1)}秒）`:''}</p>
      ${best}
      <div class="gain"><div><b style="color:var(--violet)">+${oxs.xp}</b><span>XP</span></div><div><b>${S.days[todayKey()]||0}/${S.set.goal}</b><span>今日の問題数</span></div></div>
    </div>
    ${wrongCats.length ? `<div class="card"><h2>📺 まちがえた単元を動画で復習</h2>${wrongCats.map(cid=>`<p class="label" style="margin:8px 0 6px">${esc(CMAP[cid].name)}</p>${ytLinks(cid)}`).join('')}</div>` : ''}
    <button class="btn primary" data-act="ox">もう1回 ⚡</button>
    <button class="btn" data-act="smart">仕訳を書く練習（5問）</button>
    <button class="btn ghost" data-act="go" data-v="home">ホームへ戻る</button>`;
  window.scrollTo(0,0);
  flushCelebrate();
}

/* ---------- 成績 ---------- */
function catStats(cid){
  const qs = QS.filter(q=>q.cat===cid); let n=0, c=0, learned=0, wrong=0, master=0;
  qs.forEach(q => { const r=S.rec[q.id]; if(r){ n+=r.n; c+=r.c; learned++; if(r.last===false) wrong++; } if(stars(q.id)>=3) master++; });
  return {total:qs.length, n, c, learned, wrong, master, rate: n ? Math.round(c/n*100) : null};
}
function renderStats(){
  let tot=0, ok=0; Object.entries(S.rec).forEach(([id,r]) => { if(QMAP[id]){ tot+=r.n; ok+=r.c; } });
  const lv = lvInfo(S.xp);
  const groups = ['商業','工業'].map(g => {
    const rows = CATS.filter(c=>c.grp===g).map(c => {
      const s = catStats(c.id), rc = rateClass(s.rate);
      return `<div class="cat">
        <div class="cat-h"><b>${esc(c.name)}</b><span class="rate r-${rc}">${s.rate===null?'未学習':s.rate+'%'}</span></div>
        <div class="meter"><span class="bg-${rc}" style="width:${s.rate||0}%"></span></div>
        <div class="cat-f"><span>学習 ${s.learned}/${s.total}問・⭐${s.master}${s.wrong?`・<span class="r-bad">要復習 ${s.wrong}</span>`:''}</span>
        <span style="display:flex;gap:6px;flex:0 0 auto"><a class="mini" style="border-color:var(--yt);color:var(--yt)" href="${ytUrl(c.yt[0])}" target="_blank" rel="noopener">動画</a><button class="mini" data-act="catstart" data-id="${c.id}">解く</button></span></div>
      </div>`;
    }).join('');
    let gn=0, gc=0; CATS.filter(c=>c.grp===g).forEach(c=>{ const s=catStats(c.id); gn+=s.n; gc+=s.c; });
    return `<div class="card"><h2>${g}簿記 <span class="sub" style="font-weight:400">${gn?`正答率 ${Math.round(gc/gn*100)}%`:''}</span></h2>${rows}</div>`;
  }).join('');
  const weak = CATS.map(c=>({c, s:catStats(c.id)})).filter(o=>o.s.n>=3 && o.s.rate<80).sort((a,b)=>a.s.rate-b.s.rate).slice(0,3);
  view.innerHTML = `
    <h1>成績</h1>
    <div class="card lvcard" style="margin-top:10px">
      <div class="lvbadge"><small>Lv.</small><b>${lv.lv}</b></div>
      <div class="lvbody"><div class="lvtitle">${esc(lv.title)}</div>
        <div class="xpbar"><span style="width:${lv.cur/lv.need*100}%"></span></div>
        <div class="sub" style="font-size:11px">累計 ${S.xp} XP ・ 次のレベルまで ${lv.need - lv.cur} XP</div></div>
    </div>
    <div class="hero">
      <div class="stat"><b>${tot}</b><span>仕訳の回答</span></div>
      <div class="stat"><b>${tot?Math.round(ok/tot*100)+'%':'-'}</b><span>正答率</span></div>
      <div class="stat"><b>⭐${masteredCount()}<small style="font-size:11px">/${QS.length}</small></b><span>マスター</span></div>
      <div class="stat"><b>${S.ox.n?Math.round(S.ox.c/S.ox.n*100)+'%':'-'}</b><span>○×正答率</span></div>
    </div>
    <div class="card"><h2>🏅 バッジ <span class="sub" style="font-weight:400">${Object.keys(S.badges).length}/${BADGES.length}</span></h2>
      <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?'on':''}" data-act="badge" data-id="${b.id}"><i>${b.i}</i>${esc(b.n)}</div>`).join('')}</div></div>
    ${weak.length ? `<div class="card"><h2>苦手な分野</h2>${weak.map(o=>`<div class="cat-f" style="padding:4px 0;font-size:14px"><span>${esc(o.c.name)}　<b class="r-${rateClass(o.s.rate)}">${o.s.rate}%</b></span><button class="mini" data-act="catstart" data-id="${o.c.id}">解く</button></div>`).join('')}</div>` : ''}
    ${groups}
    <p class="note">⭐＝3回連続正解でマスター。正答率＝正解した回数÷回答した回数</p>`;
}

/* ---------- 設定 ---------- */
function renderSettings(){
  const s = S.set;
  view.innerHTML = `
    <h1>設定</h1>
    <div class="card" style="margin-top:10px">
      <div class="set-row"><div><div class="t">金額も入力する</div><div class="d">オフにすると勘定科目だけで採点（スキマ時間向け）</div></div>
        <label class="switch"><input type="checkbox" id="optAmt" ${s.amount?'checked':''}><span></span></label></div>
      <div class="set-row" style="display:block"><div class="t">1日の目標</div><div class="d" style="margin-bottom:8px">ホームのリングが満タンになる問題数</div>
        <div class="seg" style="margin:0">${[5,10,20,30].map(g=>`<button class="${s.goal===g?'on':''}" data-act="goal" data-v="${g}">${g}問</button>`).join('')}</div></div>
      <div class="set-row"><div><div class="t">試験日</div><div class="d">ホームにカウントダウンを表示</div></div>
        <input type="date" id="optExam" value="${esc(s.exam)}"></div>
    </div>
    <div class="card">
      <h2>📺 ふくしままさゆき 講義動画</h2>
      <p class="sub" style="margin:0 0 10px">YouTubeの再生リストを開きます。単元ごとの動画は、解答後の画面や「成績」タブの「動画」ボタンから開けます。</p>
      <div class="yts">${YT_PLAYLISTS.map(p=>`<a class="yt" href="${p.url}" target="_blank" rel="noopener">${YT_ICON}${esc(p.name)}</a>`).join('')}</div>
    </div>
    <div class="card">
      <h2>使い方</h2>
      <ol class="help">
        <li><b>サクッと5問</b>：苦手・未学習・復習どきの問題を自動で選びます</li>
        <li><b>○×スピード</b>：表示された仕訳が正しいか1タップで答えます</li>
        <li>仕訳は、勘定科目を<b>タップ</b>すると選択中の欄に入ります</li>
        <li>3回連続で正解すると ⭐マスター。まちがえた問題は「まちがい復習」へ</li>
        <li>正解でXPがたまってレベルアップ。バッジも集めよう</li>
      </ol>
      <button class="btn" style="margin-top:12px" data-act="basics">📖 仕訳のきほんを見る</button>
      <p class="sub" style="margin:10px 0 0">スマホのブラウザで「ホーム画面に追加」すると、アプリのように起動できます。</p>
    </div>
    <div class="card">
      <h2>学習記録のバックアップ</h2>
      <p class="sub" style="margin:0 0 10px">記録はこの端末のブラウザに保存されています。ブラウザのデータを消したり機種変更すると消えるため、ときどきバックアップをとっておくと安心です。</p>
      <button class="btn" data-act="export">バックアップ用の文字列を表示</button>
      <div id="exp"></div>
      <button class="btn" data-act="import">バックアップから復元</button>
      <div id="imp"></div>
    </div>
    <div class="card">
      <button class="btn danger" data-act="reset">学習記録をすべて消去</button>
    </div>
    <p class="note">簿記2級 仕訳トレーニング・全${QS.length}問</p>`;
  document.getElementById('optAmt').onchange = e => { S.set.amount = e.target.checked; save(); toast(S.set.amount?'金額も採点します':'勘定科目のみで採点します'); };
  document.getElementById('optExam').onchange = e => { S.set.exam = e.target.value; save(); toast('試験日を保存しました'); };
}

/* =========================================================
   ボタン操作
   ========================================================= */
const ACT = {
  go: b => go(b.dataset.v),
  scope: b => { S.set.scope = b.dataset.v; save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  count: b => { S.set.count = Number(b.dataset.v); save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  cat: b => { const id=b.dataset.id, a=S.set.cats; S.set.cats = a.includes(id) ? a.filter(x=>x!==id) : [...a, id]; save(); sessionStorage.setItem('openDetails','1'); renderHome(); },
  goal: b => { S.set.goal = Number(b.dataset.v); save(); renderSettings(); toast(`1日の目標を${S.set.goal}問にしました`); },
  introOk: () => { S.seenIntro = true; save(); ACT.smart(); },
  smart: () => { if(!S.seenIntro){ S.seenIntro = true; save(); } startSession(smartPick(5), 'smart'); },
  one: () => startSession(smartPick(1), 'one'),
  ox: () => startOx(),
  start: () => { const ids = shuffle(scopePool().map(q=>q.id)); startSession(S.set.count ? ids.slice(0, S.set.count) : ids, 'random'); },
  review: () => startSession(shuffle(wrongIds()), 'review'),
  catstart: b => { const pool = QS.filter(q=>q.cat===b.dataset.id); startSession(smartPick(S.set.count || pool.length, pool), 'cat', {catId:b.dataset.id}); },
  basics: () => showBasics(),
  closeModal: () => closeModal(),
  closeCeleb: () => closeCeleb(),
  home: () => leaveToHome(),
  resume: () => resumeSession(),
  dropResume: () => { if(confirm('途中の問題を破棄しますか？（回答済みの記録は残ります）')){ delete S.resume; save(); renderHome(); } },
  amtchip: b => fillAmount(Number(b.dataset.v)),
  badge: b => { const x = BADGES.find(y=>y.id===b.dataset.id); toast(`${x.i} ${x.n}：${x.d}${S.badges[x.id]?'（獲得済み）':''}`); },
  chip: b => fillChip(b.dataset.acc),
  pickrow: b => { if(!sess.done) setActive(b.closest('.row')); },
  addrow: b => {
    if(sess.done) return;
    const rows = b.previousElementSibling;
    rows.insertAdjacentHTML('beforeend', rowHTML());
    setActive(rows.lastElementChild);
  },
  delrow: b => {
    if(sess.done) return;
    const row = b.closest('.row'), rows = row.parentElement;
    if(rows.children.length > 1){ const wasActive = row === sess.active; row.remove(); if(wasActive) setActive(firstEmpty('d') || firstEmpty('c')); }
    else { delete row.dataset.acc; const ab=row.querySelector('.accbtn'); ab.textContent='勘定科目'; ab.classList.add('empty'); const a=row.querySelector('.amt'); if(a) a.value=''; setActive(row); }
  },
  hint: () => showHint(),
  submit: () => grade(false),
  giveup: () => grade(true),
  next: () => next(),
  retry: () => startSession(shuffle(sess.wrong), 'review'),
  again: () => {
    const m = sess.mode;
    if(m === 'review') return wrongIds().length ? ACT.review() : ACT.smart();
    if(m === 'random') return ACT.start();
    if(m === 'cat') return ACT.catstart({dataset:{id:sess.catId}});
    ACT.smart();
  },
  oxans: b => answerOx(b.dataset.v === '1'),
  oxnext: () => oxNext(),
  export: () => {
    document.getElementById('exp').innerHTML = `<textarea readonly id="expText" style="margin-top:10px">${esc(JSON.stringify(S))}</textarea>
      <button class="btn primary" data-act="copy" style="margin-top:6px">コピーする</button>
      <p class="sub" style="margin:6px 0 10px">コピーした文字列をメモアプリなどに貼り付けて保存してください。</p>`;
  },
  copy: () => {
    const t = document.getElementById('expText');
    const done = () => toast('コピーしました');
    if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t.value).then(done, () => { t.select(); document.execCommand('copy'); done(); });
    else { t.select(); document.execCommand('copy'); done(); }
  },
  import: () => {
    document.getElementById('imp').innerHTML = `<textarea id="impText" placeholder="バックアップの文字列を貼り付け" style="margin-top:10px"></textarea>
      <button class="btn primary" data-act="doimport" style="margin-top:6px">この内容で復元する</button>`;
  },
  doimport: () => {
    try{
      const s = JSON.parse(document.getElementById('impText').value);
      if(!s || typeof s.rec !== 'object') throw 0;
      if(!confirm('現在の記録を上書きして復元します。よろしいですか？')) return;
      localStorage.setItem(KEY, JSON.stringify(s)); S = load(); save(); toast('復元しました'); go('home');
    }catch(e){ toast('文字列の形式が正しくありません'); }
  },
  reset: () => {
    if(!confirm('学習記録（XP・バッジを含む）をすべて消去します。元に戻せません。よろしいですか？')) return;
    const set = S.set; S = defaults(); S.set = set; S.seenIntro = true; save(); toast('記録を消去しました'); go('home');
  },
};
document.addEventListener('click', e => {
  if(e.target.id === 'modal'){ closeModal(); return; }
  if(e.target.id === 'celebrate'){ closeCeleb(); return; }
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  ACT[b.dataset.act]?.(b);
});
// 金額入力：全角数字→半角、3桁カンマ区切り
document.addEventListener('input', e => {
  if(!e.target.classList.contains('amt')) return;
  const d = e.target.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[^0-9]/g,'').replace(/^0+(?=\d)/,'').slice(0,12);
  e.target.value = d ? Number(d).toLocaleString('ja-JP') : '';
});
// 金額欄をタップしたら、その行を選択中にする
document.addEventListener('focusin', e => { if(e.target.classList?.contains('amt') && sess && !sess.done) setActive(e.target.closest('.row')); });
// Enterキーで解答
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && cur==='quiz' && e.target.classList?.contains('amt')){ e.preventDefault(); if(!sess.done) grade(false); }
});

// スマホの「戻る」操作：出題中ならホームへ戻る（アプリからは抜けない）
window.addEventListener('popstate', () => {
  closeModal();
  if(PLAY.includes(cur)) leaveToHome();
});
if(location.hash === '#play') history.replaceState(null, '', location.pathname + location.search);

checkBadges();
celebQ.length = 0; // 起動時は演出しない
go('home');
</script>
</body>
</html>
