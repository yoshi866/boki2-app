<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="簿記2級">
<meta name="description" content="日商簿記2級の仕訳・本試験形式の問題を、iPad＋Apple Pencil やスマホで練習できるアプリ">
<title>簿記2級 トレーニング</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f766e'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E簿%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f5f7; --card:#ffffff; --text:#1f2933; --sub:#5f6b7a; --line:#e2e6ea;
  --accent:#0f766e; --accent-weak:#e0f2f1; --accent-text:#ffffff;
  --debit:#1d4ed8; --debit-weak:#eff4ff; --credit:#c2410c; --credit-weak:#fff4ed;
  --ok:#15803d; --ok-weak:#e8f7ee; --ng:#dc2626; --ng-weak:#fdecec; --warn:#b45309; --warn-weak:#fff7e0;
  --yt:#c4302b; --yt-weak:#fdeceb; --gold:#d97706; --gold-weak:#fef3c7; --violet:#7c3aed; --violet-weak:#f1ebff;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111518; --card:#1b2126; --text:#e6e9ec; --sub:#9aa5b1; --line:#2d353c;
    --accent:#2dd4bf; --accent-weak:#123a37; --accent-text:#06201d;
    --debit:#7aa2ff; --debit-weak:#18223a; --credit:#ff9a62; --credit-weak:#3a2216;
    --ok:#4ade80; --ok-weak:#123222; --ng:#f87171; --ng-weak:#3a1717; --warn:#fbbf24; --warn-weak:#3a2e10;
    --yt:#ff7b72; --yt-weak:#3a1a19; --gold:#fbbf24; --gold-weak:#3a2e10; --violet:#b69cff; --violet-weak:#2a2140;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
html{touch-action:manipulation}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:16px; line-height:1.6; -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
#view{max-width:640px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
body.quiz #view{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 2px;line-height:1.35}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.center{text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:700;background:var(--line);color:var(--text);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--sub)}
.btn.warn{background:var(--warn-weak);color:var(--warn)}
.btn.danger{background:var(--ng-weak);color:var(--ng)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.actions{display:flex;gap:8px}
.actions .btn{margin:0}
.actions .btn.ghost{flex:0 0 auto;width:auto;padding:14px 12px;font-size:14px}
.link{background:none;border:none;color:var(--sub);padding:6px 0;font-size:14px}

/* ---------- home ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.hello .sub{margin:0}
.lvcard{display:flex;align-items:center;gap:12px}
.lvbadge{flex:0 0 52px;height:52px;border-radius:14px;background:var(--violet-weak);color:var(--violet);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.1}
.lvbadge small{font-size:10px;font-weight:700}
.lvbadge b{font-size:20px}
.lvbody{flex:1;min-width:0}
.lvtitle{font-weight:800;font-size:15px}
.xpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 2px}
.xpbar span{display:block;height:100%;background:linear-gradient(90deg,var(--violet),#c084fc);border-radius:4px;transition:width .6s}
.today{display:flex;align-items:center;gap:14px}
.ring{position:relative;flex:0 0 84px;height:84px}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring .num b{font-size:22px}
.ring .num span{font-size:10px;color:var(--sub)}
.today-r{flex:1;min-width:0}
.kpis{display:flex;gap:14px;margin-bottom:6px}
.kpi b{font-size:18px;display:block;line-height:1.2}
.kpi span{font-size:11px;color:var(--sub)}
.week{display:flex;gap:5px;align-items:flex-end;height:44px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:18px;border-radius:4px;background:var(--line);min-height:4px}
.week i.on{background:var(--accent)}
.week i.goal{background:var(--gold)}
.week span{font-size:9px;color:var(--sub);line-height:1}
.week .t span{color:var(--text);font-weight:800}
.bigbtn{display:flex;align-items:center;gap:12px;text-align:left;padding:16px 18px;border-radius:18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,118,110,.25)}
.bigbtn .ic{font-size:26px;line-height:1}
.bigbtn b{display:block;font-size:18px}
.bigbtn small{display:block;font-size:12px;font-weight:600;opacity:.85}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--shadow);transition:transform .08s;position:relative}
.quick button:active{transform:scale(.97)}
.quick button:disabled{opacity:.5}
.quick .ic{font-size:22px;line-height:1.2;display:block}
.quick b{display:block;font-size:15px;margin-top:2px}
.quick small{display:block;font-size:11px;color:var(--sub)}
.quick .dot{position:absolute;top:10px;right:10px;background:var(--ng);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:0 7px;line-height:18px}
details.card>summary{list-style:none;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--sub)}
details.card[open]>summary::after{content:"－"}
details.card[open]>summary{margin-bottom:12px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:transparent;border-radius:8px;padding:9px 4px;font-size:14px;color:var(--sub);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.label{font-size:13px;color:var(--sub);margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--sub)}
.chip.on{border-color:var(--accent);background:var(--accent-weak);color:var(--text);font-weight:700}
.grp{font-size:12px;font-weight:700;color:var(--sub);margin:4px 0 6px}
.intro{border:2px solid var(--accent);background:var(--accent-weak)}
.intro ol{margin:6px 0 12px;padding-left:1.3em;font-size:14px;line-height:1.8}
.note{font-size:12px;color:var(--sub);text-align:center;margin:6px 0 0}

/* ---------- quiz ---------- */
.qhead{position:sticky;top:0;z-index:6;background:var(--bg);margin:-16px -16px 0;padding:calc(8px + env(safe-area-inset-top)) 16px 2px}
.homebtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--text)}
.actions.sticky,.oxbtns.sticky{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 78%,rgba(0,0,0,0))}
.resume{display:flex;align-items:center;gap:10px;border:2px solid var(--accent)}
.resume .t{flex:1;min-width:0}
.resume .t b{display:block}
.resume .btn{width:auto;padding:10px 16px}
.amtchip{font-variant-numeric:tabular-nums;color:var(--accent)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtop-r{display:flex;align-items:center;gap:8px}
.prog{font-weight:700;font-size:14px;color:var(--sub)}
.iconbtn{border:1.5px solid var(--line);background:var(--card);border-radius:999px;width:32px;height:32px;font-weight:800;color:var(--sub);padding:0}
.combo{font-weight:800;color:var(--gold);font-size:14px;animation:pop .35s}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--sub);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 14px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--line);color:var(--sub)}
.tag.g1{background:var(--debit-weak);color:var(--debit)}
.tag.g2{background:var(--credit-weak);color:var(--credit)}
.tag.warn{background:var(--warn-weak);color:var(--warn)}
.tag.new{background:var(--violet-weak);color:var(--violet)}
.stars{font-size:12px;color:var(--gold);letter-spacing:1px;margin-left:auto}
.stars .off{color:var(--line)}
.qtext{margin:0;font-size:16px;line-height:1.75}
.hist{margin:8px 0 0;font-size:12px;color:var(--sub)}
.pal-h{font-size:12px;color:var(--sub);margin:0 0 6px;font-weight:600}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pchip{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:14px;font-weight:600;line-height:1.3;transition:transform .08s}
.pchip:active{transform:scale(.95);border-color:var(--accent)}
.side{border-radius:12px;padding:10px;margin-bottom:10px}
.side.d{background:var(--debit-weak)}
.side.c{background:var(--credit-weak)}
.sh{font-weight:800;font-size:14px;margin:0 0 6px}
.sh small{font-weight:600;font-size:11px;opacity:.8}
.side.d .sh{color:var(--debit)}
.side.c .sh{color:var(--credit)}
.row{display:flex;gap:6px;margin-bottom:6px}
.accbtn,.row input{
  font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);
  padding:8px;min-width:0;height:46px;
}
.accbtn{flex:1.35;text-align:left;font-size:14px;font-weight:700;line-height:1.25;overflow:hidden}
.accbtn.empty{color:var(--sub);font-weight:500}
.row.active .accbtn{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.row.active .accbtn.empty::after{content:" ← ここに入ります";font-size:11px;color:var(--accent)}
.row input{flex:1;text-align:right}
.row input:focus{outline:none;border-color:var(--accent)}
.row .del{flex:0 0 28px;border:none;background:transparent;color:var(--sub);font-size:18px;padding:0}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:9px;width:100%;padding:7px;font-size:13px;color:var(--sub)}
.locked .palette,.locked .pal-h,.locked .del,.locked .add{display:none}
.locked .accbtn,.locked input{opacity:.8}
.hintcard{background:var(--gold-weak);border-color:transparent}
.hintcard b{color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90%;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- feedback ---------- */
.fb{border-width:2px}
.fb.ok{border-color:var(--ok)}
.fb.ng{border-color:var(--ng)}
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 8px}
.verdict b{font-size:24px;font-weight:800;animation:pop .4s}
.fb.ok .verdict b{color:var(--ok)}
.fb.ng .verdict b{color:var(--ng)}
.xpgain{font-weight:800;color:var(--violet);font-size:14px;animation:rise .6s}
.combo-msg{font-weight:800;color:var(--gold);font-size:14px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(8px);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
.jt{width:100%;border-collapse:collapse;table-layout:fixed;margin:4px 0 12px;font-size:14px}
.jt th{font-size:12px;padding:4px 6px;text-align:left}
.jt th:first-child{color:var(--debit);background:var(--debit-weak)}
.jt th:last-child{color:var(--credit);background:var(--credit-weak)}
.jt td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;word-break:break-all}
.jt td:first-child{border-right:1px solid var(--line)}
.jt .a{display:block;font-weight:600;line-height:1.35}
.jt .m{display:block;text-align:right;font-variant-numeric:tabular-nums}
.jt td.okc .a{color:var(--ok)}
.jt td.ngc{background:var(--ng-weak)}
.jt td.ngc .a{color:var(--ng)}
.jlabel{font-size:12px;font-weight:700;color:var(--sub);margin:6px 0 0}
.expl{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;line-height:1.75;margin:0}
.expl b{color:var(--accent)}
.point{background:var(--accent-weak);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;line-height:1.7;margin:4px 0 10px}
.point span,.trap span{display:block;font-size:12px;font-weight:800;margin-bottom:2px}
.point span{color:var(--accent)}
.trap{background:var(--warn-weak);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;margin:10px 0 0}
.trap span{color:var(--warn)}
.think-box{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.think-box summary{font-size:13px;font-weight:700;color:var(--sub);cursor:pointer}
.think{list-style:none;margin:8px 0 0;padding:0}
.think li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.5}
.think .sub{font-size:12px}
.sd{flex:0 0 auto;font-size:11px;font-weight:800;border-radius:5px;padding:1px 6px;margin-top:2px}
.sd.d{background:var(--debit-weak);color:var(--debit)}
.sd.c{background:var(--credit-weak);color:var(--credit)}
.yts{display:flex;flex-wrap:wrap;gap:6px}
.yt{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:13px;font-weight:700;color:var(--yt);background:var(--yt-weak);border-radius:8px;padding:7px 12px}
.yt svg{width:18px;height:18px;flex:0 0 18px}

/* ---------- ○× ---------- */
.oxq{font-size:15px;line-height:1.7;margin:0 0 10px}
.oxask{font-weight:800;font-size:14px;margin:4px 0 6px;color:var(--sub)}
.oxbtns{display:flex;gap:10px}
.oxbtns button{flex:1;border:none;border-radius:18px;padding:18px 0;font-size:30px;font-weight:800;line-height:1;transition:transform .08s}
.oxbtns button:active{transform:scale(.95)}
.oxbtns small{display:block;font-size:12px;margin-top:6px}
.oxo{background:var(--ok-weak);color:var(--ok)}
.oxx{background:var(--ng-weak);color:var(--ng)}
.card.flash-ok{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok-weak)}
.card.flash-ng{border-color:var(--ng);box-shadow:0 0 0 3px var(--ng-weak)}

/* ---------- result ---------- */
.big{font-size:44px;font-weight:800;line-height:1.2;animation:pop .5s}
.rlist{list-style:none;margin:0;padding:0}
.rlist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:flex-start}
.rlist li:last-child{border-bottom:none}
.mk{font-weight:800;font-size:16px;line-height:1.3;min-width:18px}
.mk.o{color:var(--ok)} .mk.x{color:var(--ng)}
.gain{display:flex;justify-content:center;gap:18px;margin-top:10px}
.gain div b{display:block;font-size:20px}
.gain div span{font-size:11px;color:var(--sub)}

/* ---------- stats ---------- */
.cat{padding:10px 0;border-bottom:1px solid var(--line)}
.cat:last-child{border-bottom:none}
.cat-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.cat-h b{font-size:14px}
.cat-h .rate{font-weight:800;font-size:15px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 4px}
.meter span{display:block;height:100%;border-radius:4px}
.cat-f{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.mini{border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
a.mini{text-decoration:none;display:inline-block}
.r-good{color:var(--ok)} .r-mid{color:var(--warn)} .r-bad{color:var(--ng)} .r-none{color:var(--sub)}
.bg-good{background:var(--ok)} .bg-mid{background:var(--warn)} .bg-bad{background:var(--ng)}
.hero{display:flex;gap:8px;margin-bottom:14px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;line-height:1.3}
.stat span{font-size:11px;color:var(--sub)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge{border-radius:12px;background:var(--bg);padding:8px 2px;text-align:center;font-size:10px;line-height:1.3;color:var(--sub)}
.badge i{display:block;font-style:normal;font-size:26px;line-height:1.3}
.badge.on{background:var(--gold-weak);color:var(--text);font-weight:700}
.badge:not(.on) i{filter:grayscale(1);opacity:.35}

/* ---------- settings ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .t{font-weight:600;font-size:15px}
.set-row .d{font-size:12px;color:var(--sub)}
.switch{position:relative;width:52px;height:30px;flex:0 0 52px}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span::before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::before{transform:translateX(22px)}
input[type=date]{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--card);color:var(--text)}
textarea{width:100%;min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1.5px solid var(--line);border-radius:9px;padding:8px;background:var(--bg);color:var(--text)}
.help{font-size:14px;line-height:1.8;padding-left:1.2em;margin:0}

/* ---------- modal / celebration ---------- */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.basics{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}

j06:{p:'のれんは20年以内に定額法・直接法で償却する。',t:'減価償却累計額は使いません。科目は「のれん償却」です。'},
b01:{p:'本店の帳簿では、支店とのやり取りはすべて「支店」勘定で処理する。',t:'本店の「支店」勘定と支店の「本店」勘定は、いつも貸借逆で同じ金額になります（照合勘定）。'},
b02:{p:'支店の帳簿では、本店とのやり取りはすべて「本店」勘定で処理する。',t:'本店側の仕訳（支店 ／ 仕入）とセットで考えると間違えません。'},
b03:{p:'支店に立て替えてもらった → 本店は「支店」勘定の貸方（支店への借り）。',t:'自分の帳簿にどの勘定があるかを意識しましょう。本店の帳簿に「本店」勘定はありません。'},
b04:{p:'研究開発のためだけに使うものは、すべて「研究開発費」（費用）。',t:'機械を買っても「機械装置」にせず、給料も「給料」にしないのがポイントです。'},
r01:{p:'子会社の資本と親会社の投資（子会社株式）を消し、差額は「のれん」、外部株主の分は「非支配株主持分」。',t:'連結では「資本金」「利益剰余金」を使います。非支配株主持分 ＝ 子会社の資本 × 非支配株主の割合。'},
r02:{p:'連結上ののれんも定額法で償却し「のれん償却」とする。',t:'金額 ÷ 年数。個別会計ののれんと同じ考え方です。'},
r03:{p:'子会社の利益のうち非支配株主の分は「非支配株主に帰属する当期純利益」に振り替える。',t:'子会社の当期純利益 × 非支配株主の持分割合。同じ金額だけ非支配株主持分も増えます。'},
r04:{p:'グループ内の売買は「売上高」と「売上原価」を相殺消去する。',t:'連結では「売上」ではなく「売上高」、「仕入」ではなく「売上原価」を使います。'},
r05:{p:'グループ内の債権と債務（売掛金と買掛金など）を相殺消去する。',t:'貸倒引当金を設定している場合は、その調整も必要になります（今回は考慮しない）。'},
m01:{p:'材料の購入原価 ＝ 購入代価 ＋ 付随費用（引取運賃など）。',t:'引取運賃を費用にしないこと。3級の「仕入諸掛」と同じ考え方です。'},
m02:{p:'特定の製品に使った材料 ＝ 仕掛品、共通的に使った材料 ＝ 製造間接費。',t:'「製造指図書No.〇」と書いてあれば直接材料費 → 仕掛品。補修用・消耗品などは間接材料費 → 製造間接費。'},
m03:{p:'材料消費価格差異 ＝（予定価格 − 実際価格）× 実際消費量。マイナスなら不利差異（借方）。',t:'必ず「予定 − 実際」の順で計算。マイナス ＝ 借方差異（不利）、プラス ＝ 貸方差異（有利）。'},
m04:{p:'正常な範囲の棚卸減耗は間接経費 ＝ 製造間接費。',t:'帳簿 − 実地 ＝ 減耗額。異常な減耗なら原価に含めません（非原価項目）。'},
w01:{p:'賃金を支払ったら、総額を「賃金・給料」の借方に記入する。',t:'源泉所得税などを差し引いた分は「預り金」（負債）。会社が後で納めます。'},
w02:{p:'直接工の直接作業時間 ＝ 直接労務費（仕掛品）、間接作業時間と間接工 ＝ 間接労務費（製造間接費）。',t:'直接工でも「間接作業」の時間分は製造間接費！ここが一番のひっかけです。'},
w03:{p:'賃率差異 ＝ 予定消費額 − 実際消費額。マイナスなら不利差異（借方）。',t:'予定で消費した額と実際の差を、賃金・給料勘定から賃率差異勘定へ振り替えます。'},
w04:{p:'要支払額 ＝ 当月支払高 − 前月末未払高 ＋ 当月末未払高。',t:'「前月分を引いて、今月分を足す」。間接工の賃金は製造間接費へ。'},
e01:{p:'予定配賦額 ＝ 予定配賦率 × 実際の配賦基準（直接作業時間など）。',t:'製造間接費（集めた箱）から仕掛品へ移すので「仕掛品 ／ 製造間接費」。'},
e02:{p:'配賦差異 ＝ 予定配賦額 − 実際発生額。マイナス（配賦不足）なら不利差異（借方）。',t:'実際の方が多い ＝ 予定では足りなかった（配賦不足）＝ 不利差異。製造間接費勘定に残った分を差異勘定へ移します。'},
e03:{p:'外注加工賃は特定の製品のための「直接経費」＝ 仕掛品。',t:'直接経費の代表は外注加工賃と特許権使用料。それ以外の経費はたいてい間接経費です。'},
e04:{p:'電力料・ガス代・水道料は、その月の測定額を間接経費（製造間接費）にする。',t:'支払額ではなく「測定額」を使うのがポイントです。'},
e05:{p:'工場の機械の減価償却費は間接経費 ＝ 製造間接費。',t:'本社（営業部門）の減価償却費なら、製造原価ではなく販売費及び一般管理費になります。'},
p01:{p:'完成したら仕掛品から製品へ振り替える。',t:'仕掛品 ＝ 作りかけ、製品 ＝ 完成品（どちらも資産）。'},
p02:{p:'製品を売ったら「売上」と「製品 → 売上原価」の2本の仕訳。',t:'商業簿記の売上原価対立法と同じ形。「商品」が「製品」に変わるだけです。'},
p03:{p:'標準原価計算では、完成品は「標準原価 × 数量」で製品勘定へ振り替える。',t:'パーシャル・プランでもシングル・プランでも、完成品は標準原価で記入します。'},
p04:{p:'パーシャル・プランは、仕掛品勘定の借方に「実際原価」を記入する。',t:'シングル・プラン ＝ 仕掛品勘定はすべて標準原価、パーシャル・プラン ＝ 投入は実際原価・完成品は標準原価。'},
p05:{p:'不利差異（借方残高）は、年度末に売上原価に加算する。',t:'差異勘定の反対側（貸方）に記入して残高をゼロにするイメージです。'},
p06:{p:'有利差異（貸方残高）は、年度末に売上原価から差し引く。',t:'差異勘定の借方に記入して残高を消し、売上原価を貸方（減少）に記入します。'},
f01:{p:'工場の帳簿にない勘定（買掛金など）は「本社」勘定に置き換える。',t:'まず会社全体の仕訳（材料 ／ 買掛金）を考え、工場にない科目を「本社」に置き換えると簡単です。'},
f02:{p:'本社の帳簿にない勘定（賃金・給料など）は「工場」勘定に置き換える。',t:'会社全体の仕訳は 賃金・給料 ／ 現金。賃金・給料は工場にあるので、本社では「工場 ／ 現金」。'},
f03:{p:'工場にない製品勘定の代わりに「本社」勘定を使う。',t:'会社全体の仕訳は 製品 ／ 仕掛品。製品は本社にあるので、工場側は「本社 ／ 仕掛品」。'},
s08:{p:'返金が見込まれる分は売上にせず「返金負債」にする。',t:'売掛金は請求する全額、売上は返金見込みを差し引いた額。借方と貸方で金額の内訳が変わるのがポイントです。'},
s09:{p:'果たした分の対価のうち、まだ請求できないものは「契約資産」。',t:'請求できる＝売掛金、まだ請求できない＝契約資産。「代金は〇〇の後に請求」という条件が目印です。'},
s10:{p:'請求できるようになったら、契約資産を売掛金へ振り替える。',t:'売上はBの40,000円だけ。Aの売上は前回計上済みなので、二重に計上しないこと。'},
s11:{p:'先に受け取った対価は「契約負債」（前受金の仲間）。',t:'「契約負債」「前受金」のどちらを使うかは問題文で指定されます。必ず確認しましょう。'},
s12:{p:'サービス提供前にかかった費用は、いったん「仕掛品」にためる。',t:'サービス業でも仕掛品を使います。この時点ではまだ役務原価にはしません（次の「研修完了」の問題とセット）。'},
s13:{p:'サービス完了時は「役務収益」と「仕掛品→役務原価」をセットで計上。',t:'サービス業では売上・売上原価ではなく、役務収益・役務原価を使います。'},
s14:{p:'売上原価対立法の在庫は「商品」。棚卸減耗も商品から減らす。',t:'三分法なら繰越商品。記帳方法で使う科目が変わる、典型的なひっかけです。'},
t08:{p:'電子記録債権の譲渡＝手形の裏書譲渡と同じ形。',t:'自分の支払義務である「電子記録債務」を使うのはひっかけ。渡すのは持っている債権です。'},
t09:{p:'発生記録をされた（受け取る）側は「売掛金→電子記録債権」。',t:'発生記録を「した」側（払う側）が電子記録債務、「された」側（受け取る側）が電子記録債権です。'},
t10:{p:'電子記録債権の決済＝受取手形の決済と同じ形。',t:'売掛金はすでに電子記録債権に置き換わっているので、ここで売掛金を減らすのは誤りです。'},
t11:{p:'不渡手形の回収＝不渡手形を減らす。延滞利息は受取利息。',t:'償却債権取立益は「前期以前に貸倒れとして処理した債権」を回収したときの科目。今回はまだ貸倒れにしていません。'},
t12:{p:'前期発生の不渡手形が貸し倒れたら、まず貸倒引当金を使う。',t:'減らすのは受取手形ではなく不渡手形。不渡りの時点で受取手形からは振り替え済みです。'},
y08:{p:'何回かに分けて買った株は、平均単価で帳簿価額を計算する。',t:'1回目（@500円）や2回目（@560円）の単価で計算しないこと。まず平均単価を出すのが手順です。'},
y09:{p:'社債を売ったときに受け取る端数利息は「有価証券利息」の貸方。',t:'買ったときは借方（払う）、売ったときは貸方（受け取る）。売却益と利息を混ぜないこと。'},
y10:{p:'その他有価証券は、翌期首に評価差額を振り戻す（洗替法）。',t:'前期末の仕訳（その他有価証券／その他有価証券評価差額金）の貸借を逆にするだけです。'},
y11:{p:'社債の利息は「有価証券利息」。',t:'預金の利息＝受取利息、株式の配当＝受取配当金、社債の利息＝有価証券利息。もらう相手で科目が変わります。'},
y12:{p:'20%以上で重要な影響を与える会社の株式＝関連会社株式。',t:'50%超（支配）なら子会社株式。持株比率の数字を必ず確認しましょう。'},
k11:{p:'割賦購入の利息分は、いったん「前払利息」にしておく。',t:'備品は利息を除いた600,000円で計上。商品以外の購入なので手形は「営業外支払手形」です。'},
k12:{p:'手形を払うたびに、前払利息を1回分ずつ支払利息へ振り替える。',t:'2つの仕訳を1本にまとめた形です。利息の振替を忘れやすいので注意。'},
k13:{p:'生産高比例法は「使った分だけ」減価償却する。',t:'年数ではなく走行距離などの割合で計算します。間接法なので貸方は減価償却累計額。'},
k14:{p:'定率法＝期首の帳簿価額（取得原価−減価償却累計額）×償却率。',t:'取得原価×0.4（400,000円）にするのは定額法と混ざったミス。200%定率法の償却率は「1÷耐用年数×2」です。'},
k15:{p:'買換え＝「古い車両の売却」＋「新しい車両の購入」を1本にまとめる。',t:'期首の取引なので当期の減価償却費は不要。車両運搬具が借方・貸方の両方に出てきます。'},
k16:{p:'完成前の建物への支払いは「建設仮勘定」。',t:'まだ完成していないので「建物」ではありません。前払金も使いません。'},
k17:{p:'ソフトウェア仮勘定は「ソフトウェア版の建設仮勘定」。',t:'残額の後払いは商品ではないので「未払金」。研究開発目的ではないので研究開発費でもありません。'},
k18:{p:'オペレーティング・リースは「支払リース料」で処理するだけ。',t:'リース資産・リース債務を使うのはファイナンス・リース。種類の見分けがポイントです。'},
k19:{p:'利子込み法はリース料総額で計上する。',t:'利子抜き法なら見積現金購入価額550,000円。どちらの方法か問題文で必ず確認しましょう。'},
k20:{p:'ファイナンス・リースで計上したリース資産も減価償却する。',t:'リース料の支払い（リース債務の返済）と減価償却は別の仕訳です。'},
k21:{p:'保険金＞未決算なら「保険差益」、保険金＜未決算なら「火災損失」。',t:'まだ入金されていないので相手科目は「未収入金」。'},
k22:{p:'補助金を受け取ったら「国庫補助金受贈益」（収益）。',t:'返す必要はないので借入金ではありません。圧縮記帳は資産を買ったときに行います。'},
h08:{p:'差額補充法＝必要な額と今の残高の差だけ繰り入れる。',t:'60,000円を全額繰り入れるのはミス。受取手形も対象に含めるのを忘れずに。'},
h09:{p:'前期以前に貸し倒れた債権の回収＝償却債権取立益。',t:'売掛金はすでに帳簿から消えているので、売掛金を減らすのは誤り。'},
h10:{p:'個別評価も「貸倒引当金繰入／貸倒引当金」。',t:'まだ貸し倒れたわけではないので、売掛金は減らしません。'},
h11:{p:'退職給付引当金の繰入は「退職給付費用」で処理する。',t:'他の引当金と違い「〇〇引当金繰入」ではない点がひっかけです。'},
h12:{p:'引当金の設定は「〇〇引当金繰入／〇〇引当金」。',t:'実際に修繕したときに引当金を取り崩します（引当金の別の問題とセットで）。'},
h13:{p:'商品保証引当金の設定は「商品保証引当金繰入／商品保証引当金」。',t:'前期の残高がある場合は、戻入（洗替法）か差額補充かの指示を確認しましょう。'},
g06:{p:'輸出も輸入と同じく、取引日の為替相場（HR）で換算する。',t:'この時点では為替差損益は出ません。'},
g07:{p:'売掛金（資産）は、円高になると受取額が減って損。',t:'買掛金（負債）とは損と益が逆になります。「円で見ていくら増えた・減ったか」で考えましょう。'},
g08:{p:'前受金は受取時のレートのまま。残りだけ当日のレートで換算する。',t:'売上全体を5,000ドル×145円で計算するのはひっかけ。'},
g09:{p:'取引後に為替予約をしたら、買掛金を予約レートに直し、差額は為替差損益。',t:'仕入はすでに計上済みなので修正しません。動かすのは買掛金だけです。'},
g10:{p:'買掛金（負債）は、円安になると支払額が増えて損。',t:'売掛金の換算替えとは損益の向きが逆になります。'},
z07:{p:'売ったときに受け取った消費税は「仮受消費税」。',t:'買ったとき＝仮払消費税、売ったとき＝仮受消費税。逆にしないように。'},
z08:{p:'確定申告での納付は、未払法人税等を減らすだけ。',t:'ここで「法人税、住民税及び事業税」をもう一度計上すると二重計上になります。'},
z09:{p:'損金不算入（将来減算一時差異）×税率＝繰延税金資産。',t:'減価償却費の金額そのものは修正しません。税効果の仕訳は「繰延税金資産／法人税等調整額」の形です。'},
z10:{p:'一時差異が解消したら、発生時の税効果の仕訳を逆にする。',t:'解消時は法人税等調整額が借方（税金費用が増える側）になります。'},
j07:{p:'増資のときの株式発行費用は「株式交付費」。',t:'会社設立時の株式発行費用なら「創立費」。設立か増資かで科目が変わります。'},
j08:{p:'会社設立のための費用＝創立費。',t:'設立後、営業を始めるまでの準備費用は「開業費」。時期で見分けます。'},
j09:{p:'設立後、営業開始までの準備費用＝開業費。',t:'設立そのものの費用は創立費。「設立前・設立のため」か「設立後・開業準備」かで判断します。'},
j10:{p:'財源が「その他資本剰余金」なら資本準備金、「繰越利益剰余金」なら利益準備金を積み立てる。',t:'資本の仲間（資本剰余金→資本準備金）、利益の仲間（利益剰余金→利益準備金）とセットで覚えましょう。'},
j11:{p:'配当金の支払い＝未払配当金を減らすだけ。',t:'繰越利益剰余金は決議のときにすでに減らしています。'},
j12:{p:'積立金の取崩し＝積立金から繰越利益剰余金への振替。',t:'積み立てたときの仕訳（繰越利益剰余金／別途積立金）の逆です。'},
j13:{p:'当期純損失は「繰越利益剰余金／損益」。',t:'純利益のとき（損益／繰越利益剰余金）の逆です。'},
b05:{p:'本店集中計算制度では、支店どうしの取引も相手を「本店」として処理する。',t:'東京支店の帳簿に「大阪支店」勘定はありません。'},
b06:{p:'本店は「受け取った支店に借方、送った支店に貸方」。',t:'本店の現金は動いていないので、現金は使いません。'},
b07:{p:'本店から支店への商品の発送（原価）は「支店／仕入」。',t:'会社の内部の移動なので売上にはしません。支店側は 仕入／本店 です。'},
b08:{p:'支店の利益は、本店で「支店／損益」として受け入れる。',t:'支店側の仕訳は 損益／本店。セットで覚えましょう。'},
b09:{p:'支店の利益は「損益／本店」で本店へ送る。',t:'繰越利益剰余金は本店（会社全体）にしかありません。'},
r06:{p:'期末在庫に含まれる内部利益は「売上原価／商品」で消去する。',t:'親会社→子会社（ダウンストリーム）なので、非支配株主への負担はありません。'},
r07:{p:'内部の売掛金を消したら、それに対応する貸倒引当金も消す。',t:'売掛金の相殺（買掛金／売掛金）とは別の仕訳です。'},

}

<tr><td>完成品総合原価</td><td>[[f1]]</td><td>[[f2]]</td><td>[[f3]]</td></tr></table>

 ans:{m1:200000, m2:120000, m3:320000, f1:1000000, f2:1200000, f3:2200000, u:1100},
 pts:{m1:2, m2:2, m3:2, f1:2, f2:2, f3:3, u:3},
 ex:`<p><b>直接材料費（始点投入なので数量そのまま）</b><br>(180,000＋1,020,000)÷(完成2,000＋月末400)＝1,200,000÷2,400＝500円/個<br>月末：400個×500＝<b>200,000</b>　完成品：1,200,000−200,000＝<b>1,000,000</b></p>
<p><b>加工費（完成品換算量）</b>　月末 400×50%＝200個<br>(96,000＋1,224,000)÷(2,000＋200)＝1,320,000÷2,200＝600円/個<br>月末：200個×600＝<b>120,000</b>　完成品：1,320,000−120,000＝<b>1,200,000</b></p>
<p><b>完成品総合原価</b> 1,000,000＋1,200,000＝<b>2,200,000</b>、単位原価 2,200,000÷2,000個＝<b>1,100円</b></p>
<p class="tip">💡 平均法は「月初＋当月」をまとめて平均単価を出す。加工費は必ず換算量（進捗度をかけた数）で割る。</p>`},

{id:'k03', grp:'工業', part:'第4問(2)', min:15, title:'総合原価計算（先入先出法・正常仕損）',
 body:`<p>当工場では単純総合原価計算を採用している。次の資料にもとづいて、各問に答えなさい。月末仕掛品の評価は<b>先入先出法</b>による。正常仕損は工程の<b>終点</b>で発生しており、正常仕損費は<b>度外視法</b>により処理する。仕損品の処分価額はない。</p>
<table class="tb"><tr><th colspan="2">生産データ</th><th colspan="3">原価データ（円）</th></tr>
<tr><td>月初仕掛品</td><td class="n">500個（40%）</td><td></td><th>直接材料費</th><th>加工費</th></tr>
<tr><td>当月投入</td><td class="n">3,000個</td><td>月初仕掛品</td><td class="n">240,000</td><td class="n">85,000</td></tr>
<tr><td>合計</td><td class="n">3,500個</td><td>当月製造費用</td><td class="n">1,500,000</td><td class="n">1,650,000</td></tr>
<tr><td>正常仕損品</td><td class="n">100個</td><td colspan="3" rowspan="3"></td></tr>
<tr><td>月末仕掛品</td><td class="n">600個（50%）</td></tr>
<tr><td>完成品</td><td class="n">2,800個</td></tr></table>
<p class="note2">材料はすべて工程の始点で投入している。（　）内は加工進捗度。</p>`,
 sheet:`<p>問1　月末仕掛品原価　直接材料費 [[a1]] 円　加工費 [[a2]] 円　合計 [[a]] 円</p>
<p>問2　完成品総合原価　[[b]] 円</p>
<p>問3　完成品単位原価　[[c]] 円/個</p>`,
 ans:{a1:300000, a2:165000, a:465000, b:3010000, c:1075},
 pts:{a1:2, a2:2, a:2, b:4, c:2},
 ex:`<p><b>① 仕損の負担先</b>　仕損は終点で発生。月末仕掛品（50%）は終点を通っていないので、<b>完成品だけが仕損費を負担</b>する。度外視法なので、仕損品の数量を当月投入に含めたまま計算し、その原価を完成品に負担させる。</p>
<p><b>② 直接材料費</b>　当月投入 3,000個（＝完成2,800−月初500＋仕損100＋月末600）<br>単価 1,500,000÷3,000＝500円　月末 600×500＝<b>300,000</b></p>
<p><b>③ 加工費</b>　当月投入（換算）＝完成2,800−月初500×40%＋仕損100×100%＋月末600×50%＝2,800−200＋100＋300＝3,000個<br>単価 1,650,000÷3,000＝550円　月末 300×550＝<b>165,000</b></p>
<p><b>④ 完成品</b>　(240,000＋85,000)＋(1,500,000＋1,650,000)−465,000＝<b>3,010,000</b>　単位原価 3,010,000÷2,800＝<b>1,075円</b></p>
<p class="tip">💡 先入先出法は「当月投入分だけ」の単価で月末を評価する。月初仕掛品の原価はすべて完成品へ。</p>`},

{id:'k04', grp:'工業', part:'第5問', min:12, title:'CVP分析（損益分岐点）',
 body:`<p>製品Yを製造・販売する当社の当期の資料は次のとおりである。期首・期末に製品・仕掛品の在庫はない。各問に答えなさい。</p>
<table class="tb"><tr><td>販売単価</td><td class="n">2,000円</td></tr><tr><td>当期の販売量</td><td class="n">4,000個</td></tr>
<tr><td>変動製造原価</td><td class="n">1,000円/個</td></tr><tr><td>変動販売費</td><td class="n">200円/個</td></tr>
<tr><td>固定製造原価</td><td class="n">1,600,000円</td></tr><tr><td>固定販売費及び一般管理費</td><td class="n">800,000円</td></tr></table>`,
 sheet:`<p>問1　貢献利益率　[[a:s]] %</p>
<p>問2　損益分岐点の売上高　[[b]] 円　　販売量　[[c]] 個</p>
<p>問3　安全余裕率　[[d:s]] %</p>
<p>問4　営業利益 1,200,000円を達成する売上高　[[e]] 円</p>
<p>問5　経営レバレッジ係数　[[f:s]]</p>
<p>問6　販売量が10%増加したときの営業利益　[[g]] 円</p>
<p>問7　固定費を200,000円削減したときの損益分岐点の売上高　[[h]] 円</p>`,
 ans:{a:40, b:6000000, c:3000, d:25, e:9000000, f:4, g:1120000, h:5500000},
 pts:{a:1, b:2, c:1, d:2, e:2, f:1, g:2, h:1},
 ex:`<p><b>直接原価計算の損益計算書をまず作る</b><br>売上高 2,000×4,000＝8,000,000／変動費 (1,000＋200)×4,000＝4,800,000<br>貢献利益 3,200,000／固定費 2,400,000／営業利益 800,000</p>
<p>問1 貢献利益率 3,200,000÷8,000,000＝<b>40%</b></p>
<p>問2 損益分岐点売上高 固定費2,400,000÷40%＝<b>6,000,000円</b>　販売量 6,000,000÷2,000＝<b>3,000個</b><br>（1個あたり貢献利益800円 → 2,400,000÷800＝3,000個 でもOK）</p>
<p>問3 安全余裕率 (8,000,000−6,000,000)÷8,000,000＝<b>25%</b></p>
<p>問4 (固定費2,400,000＋目標利益1,200,000)÷40%＝<b>9,000,000円</b></p>
<p>問5 経営レバレッジ係数 貢献利益3,200,000÷営業利益800,000＝<b>4</b></p>
<p>問6 売上が10%増えると営業利益は 10%×4＝40%増える → 800,000×1.4＝<b>1,120,000円</b><br>（検算：貢献利益 3,520,000−固定費2,400,000＝1,120,000）</p>
<p>問7 (2,400,000−200,000)÷40%＝<b>5,500,000円</b></p>
<p class="tip">💡 CVPは「売上高をS」とおいて S×40%−2,400,000＝目標利益 の一次方程式を立てれば全部解ける。安全余裕率と損益分岐点比率は足して100%。</p>`},

{id:'k05', grp:'工業', part:'第5問', min:12, title:'直接原価計算と全部原価計算',
 body:`<p>製品Zを製造・販売する当社の第1期の資料は次のとおりである。期首の製品・仕掛品はなく、期末仕掛品もない。</p>
<table class="tb"><tr><td>生産量</td><td class="n">1,000個</td><td>販売量</td><td class="n">800個</td></tr>
<tr><td>販売単価</td><td class="n">5,000円</td><td>変動製造原価</td><td class="n">2,000円/個</td></tr>
<tr><td>固定製造原価</td><td class="n">1,200,000円</td><td>変動販売費</td><td class="n">300円/個</td></tr>
<tr><td>固定販売費及び一般管理費</td><td class="n">600,000円</td><td></td><td></td></tr></table>`,
 sheet:`<div class="two"><div><p class="sh2">問1　全部原価計算の損益計算書</p>
<table class="tb"><tr><td>売上高</td><td class="n">4,000,000</td></tr><tr><td>売上原価</td><td>[[a]]</td></tr><tr><td>売上総利益</td><td>[[b]]</td></tr><tr><td>販売費及び一般管理費</td><td>[[c]]</td></tr><tr><td>営業利益</td><td>[[d]]</td></tr></table></div>
<div><p class="sh2">問2　直接原価計算の損益計算書</p>
<table class="tb"><tr><td>売上高</td><td class="n">4,000,000</td></tr><tr><td>変動売上原価</td><td>[[e]]</td></tr><tr><td>変動製造マージン</td><td>[[f]]</td></tr><tr><td>変動販売費</td><td>[[g]]</td></tr><tr><td>貢献利益</td><td>[[h]]</td></tr><tr><td>固定費</td><td>[[i]]</td></tr><tr><td>営業利益</td><td>[[j]]</td></tr></table></div></div>
<p>問3　両者の営業利益の差額は [[k]] 円で、これは期末製品に含まれる固定製造原価の金額に一致する。</p>`,
 ans:{a:2560000, b:1440000, c:840000, d:600000, e:1600000, f:2400000, g:240000, h:2160000, i:1800000, j:360000, k:240000},
 pts:{a:2, b:1, c:2, d:2, e:1, f:1, g:1, h:1, i:1, j:2, k:2},
 ex:`<p><b>全部原価計算</b>　製品1個の製造原価＝変動2,000＋固定1,200,000÷生産1,000個＝3,200円<br>売上原価 800個×3,200＝<b>2,560,000</b>　売上総利益 <b>1,440,000</b><br>販管費 300×800＋600,000＝<b>840,000</b>　営業利益 <b>600,000</b></p>
<p><b>直接原価計算</b>　固定製造原価は全額その期の費用<br>変動売上原価 800×2,000＝<b>1,600,000</b>　変動製造マージン <b>2,400,000</b><br>変動販売費 800×300＝<b>240,000</b>　貢献利益 <b>2,160,000</b><br>固定費 1,200,000＋600,000＝<b>1,800,000</b>　営業利益 <b>360,000</b></p>
<p><b>差額</b> 600,000−360,000＝<b>240,000</b>＝期末製品200個×固定製造原価1,200円</p>
<p class="tip">💡 生産量＞販売量のとき、全部原価計算の利益のほうが大きくなる（固定費の一部が在庫として翌期に繰り越されるため）。</p>`},

{id:'k06', grp:'工業', part:'第4問(2)', min:15, title:'部門別原価計算（直接配賦法）',
 body:`<p>当工場には製造部門として切削部・組立部、補助部門として動力部・修繕部がある。次の資料にもとづいて、各問に答えなさい。補助部門費の配賦は<b>直接配賦法</b>による。</p>
<p class="sh2">［資料1］当月の部門費（第1次集計後）</p>
<table class="tb"><tr><th>切削部</th><th>組立部</th><th>動力部</th><th>修繕部</th></tr><tr><td class="n">1,800,000円</td><td class="n">1,400,000円</td><td class="n">600,000円</td><td class="n">400,000円</td></tr></table>
<p class="sh2">［資料2］補助部門費の配賦基準</p>
<table class="tb"><tr><th></th><th>切削部</th><th>組立部</th><th>動力部</th><th>修繕部</th></tr>
<tr><td>動力供給量</td><td class="n">600kWh</td><td class="n">400kWh</td><td class="n">—</td><td class="n">100kWh</td></tr>
<tr><td>修繕作業時間</td><td class="n">30時間</td><td class="n">50時間</td><td class="n">20時間</td><td class="n">—</td></tr></table>
<p class="sh2">［資料3］当月の配賦基準</p>
<p>切削部：機械作業時間 1,100時間　　組立部：直接作業時間 1,050時間</p>`,
 sheet:`<p>問1　部門費配賦表を完成させなさい。（単位：円）</p>
<table class="tb"><tr><th></th><th>切削部</th><th>組立部</th></tr>
<tr><td>部門費</td><td class="n">1,800,000</td><td class="n">1,400,000</td></tr>
<tr><td>動力部費</td><td>[[a1]]</td><td>[[a2]]</td></tr>
<tr><td>修繕部費</td><td>[[b1]]</td><td>[[b2]]</td></tr>
<tr><td>製造部門費</td><td>[[c1]]</td><td>[[c2]]</td></tr></table>
<p>問2　実際配賦率　切削部 [[d1:s]] 円/時間　　組立部 [[d2:s]] 円/時間</p>
<p>問3　切削部の予定配賦率が 2,000円/時間 のとき、切削部の製造部門費配賦差異は [[e]] 円（[[ec=借方|貸方]]差異）</p>`,
 ans:{a1:360000, a2:240000, b1:150000, b2:250000, c1:2310000, c2:1890000, d1:2100, d2:1800, e:110000, ec:'借方'},
 pts:{a1:1, a2:1, b1:1, b2:1, c1:2, c2:2, d1:2, d2:2, e:4},
 ex:`<p><b>直接配賦法</b>は補助部門どうしのやりとりを<b>無視</b>して、製造部門にだけ配賦する。</p>
<p>動力部費 600,000 を 600：400 で配賦 → 切削 <b>360,000</b>／組立 <b>240,000</b>（修繕部の100kWhは使わない）</p>
<p>修繕部費 400,000 を 30：50 で配賦 → 切削 400,000×30/80＝<b>150,000</b>／組立 <b>250,000</b>（動力部の20時間は使わない）</p>
<p>切削部 1,800,000＋360,000＋150,000＝<b>2,310,000</b>　組立部 1,400,000＋240,000＋250,000＝<b>1,890,000</b>（合計4,200,000で一致 ✓）</p>
<p>実際配賦率　切削 2,310,000÷1,100＝<b>2,100円</b>　組立 1,890,000÷1,050＝<b>1,800円</b></p>
<p>予定配賦額 2,000×1,100＝2,200,000 − 実際 2,310,000 ＝ −110,000 → 実際のほうが多いので<b>借方差異（不利差異）110,000円</b></p>
<p class="tip">💡 相互配賦法（簡便法）では、第1次配賦だけ補助部門にも配る。問題文の「直接」「相互」を必ず確認。</p>`},

{id:'k07', grp:'工業', part:'第4問(2)', min:15, title:'個別原価計算（仕掛品勘定）',
 body:`<p>当工場では受注生産を行っており、個別原価計算を採用している。次の資料にもとづいて、各問に答えなさい。</p>
<p class="sh2">［資料1］製造指図書別のデータ（当月）</p>
<table class="tb"><tr><th>指図書</th><th>直接材料費</th><th>直接作業時間</th><th>備考</th></tr>
<tr><td>#101</td><td class="n">—</td><td class="n">150時間</td><td>前月着手。当月完成・引渡し</td></tr>
<tr><td>#102</td><td class="n">500,000円</td><td class="n">400時間</td><td>当月着手。当月完成、月末未引渡し</td></tr>
<tr><td>#103</td><td class="n">350,000円</td><td class="n">250時間</td><td>当月着手。月末未完成</td></tr></table>
<p class="sh2">［資料2］その他</p>
<ol class="ol2"><li>#101の前月末までの原価：直接材料費 300,000円、直接労務費 200,000円、製造間接費 240,000円</li>
<li>直接労務費は予定賃率 1,000円/時間 で計算する。</li>
<li>製造間接費は直接作業時間を基準に、予定配賦率 1,200円/時間 で配賦する。当月の実際発生額は 1,000,000円。</li>
<li>製造間接費配賦差異は売上原価に賦課する。</li></ol>`,
 sheet:`<p>問1　仕掛品勘定を完成させなさい。（単位：円）</p>
<table class="tb taccount"><tr><th colspan="2">借方</th><th colspan="2">貸方</th></tr>
<tr><td>前月繰越</td><td class="n">740,000</td><td>製品</td><td>[[f]]</td></tr>
<tr><td>直接材料費</td><td>[[a]]</td><td>次月繰越</td><td>[[g]]</td></tr>
<tr><td>直接労務費</td><td>[[b]]</td><td></td><td></td></tr>
<tr><td>製造間接費</td><td>[[c]]</td><td></td><td></td></tr></table>
<p>問2　製造間接費配賦差異　[[h]] 円（[[hc=借方|貸方]]差異）</p>
<p>問3　配賦差異を賦課した後の当月の売上原価　[[i]] 円</p>`,
 ans:{a:850000, b:800000, c:960000, f:2450000, g:900000, h:40000, hc:'借方', i:1110000},
 pts:{a:2, b:2, c:2, f:3, g:3, h:2, i:2},
 ex:`<p><b>指図書別原価計算表を余白に作る</b></p>
<table class="tb"><tr><th></th><th>#101</th><th>#102</th><th>#103</th></tr>
<tr><td>前月繰越</td><td class="n">740,000</td><td></td><td></td></tr>
<tr><td>直接材料費</td><td class="n">0</td><td class="n">500,000</td><td class="n">350,000</td></tr>
<tr><td>直接労務費</td><td class="n">150,000</td><td class="n">400,000</td><td class="n">250,000</td></tr>
<tr><td>製造間接費</td><td class="n">180,000</td><td class="n">480,000</td><td class="n">300,000</td></tr>
<tr><th>合計</th><td class="n">1,070,000</td><td class="n">1,380,000</td><td class="n">900,000</td></tr>
<tr><td>状態</td><td>完成・引渡</td><td>完成（製品）</td><td>仕掛品</td></tr></table>
<p>仕掛品勘定の借方：直接材料費 850,000／直接労務費 1,000円×800時間＝800,000／製造間接費 1,200円×800時間＝960,000<br>貸方：製品（完成した#101＋#102）＝<b>2,450,000</b>　次月繰越（#103）＝<b>900,000</b>　貸借合計3,350,000で一致 ✓</p>
<p>配賦差異 予定960,000−実際1,000,000＝−40,000 → <b>借方差異40,000</b></p>
<p>売上原価 引き渡した#101の1,070,000＋借方差異40,000＝<b>1,110,000</b></p>
<p class="tip">💡 「完成」なら製品へ、「引渡し」なら売上原価へ。#102は完成したが未引渡しなので、売上原価には入らない。</p>`},

{id:'k08', grp:'工業', part:'第4問(2)', min:12, title:'材料費・労務費の計算',
 body:`<p>次の資料にもとづいて、当月（5月）の各金額を計算しなさい。</p>
<p class="sh2">［資料1］材料Aの受払（払出単価は<b>先入先出法</b>）</p>
<table class="tb"><tr><td>5/1</td><td>前月繰越</td><td class="n">200kg</td><td class="n">@500円</td></tr>
<tr><td>5/8</td><td>仕入</td><td class="n">600kg</td><td class="n">@520円</td></tr>
<tr><td>5/10</td><td>出庫</td><td class="n">500kg</td><td></td></tr>

<p class="sh2">［資料2］直接工の賃金</p>
<ol class="ol2"><li>消費賃金は予定賃率 1,100円/時間 で計算している。</li>
<li>当月の作業時間：直接作業 900時間、間接作業 100時間</li>
<li>当月の賃金支払額 1,100,000円、前月末未払額 280,000円、当月末未払額 310,000円</li></ol>`,

 ex:`<p><b>先入先出法</b>（古いものから払い出す）</p>
<p>5/10：200kg×500＋300kg×520＝100,000＋156,000＝<b>256,000</b>（残り 5/8分 300kg）<br>5/25：300kg×520＋200kg×540＝156,000＋108,000＝<b>264,000</b>（残り 5/20分 200kg）<br>消費額 <b>520,000</b>　帳簿残高 200kg×540＝108,000</p>
<p>棚卸減耗 (200−190)kg×540＝<b>5,400</b>（月末に残っているのは@540円の材料）</p>
<p><b>賃金</b>　要支払額＝当月支払1,100,000−前月未払280,000＋当月未払310,000＝<b>1,130,000</b><br>直接労務費 900×1,100＝<b>990,000</b>　間接労務費 100×1,100＝<b>110,000</b><br>賃率差異 予定消費額1,100,000−実際1,130,000＝−30,000 → <b>不利差異30,000</b></p>

{id:'s01', grp:'商業', part:'第2問', min:15, title:'連結会計（のれん・非支配株主持分）',
 body:`<p>P社はX1年3月31日にS社の発行済株式の60%を1,000,000円で取得し、支配を獲得した。次の資料にもとづいて、各問に答えなさい。会計期間はいずれも4月1日から3月31日までの1年間である。</p>
<ol class="ol2"><li>X1年3月31日のS社の純資産：資本金 1,000,000円、利益剰余金 400,000円。S社の資産・負債の時価は帳簿価額と等しい。</li>
<li>のれんは支配獲得の翌期から10年間で定額法により償却する。</li>
<li>X2年3月期のS社：当期純利益 300,000円、剰余金の配当 100,000円</li>
<li>X2年3月31日のP社の個別貸借対照表の利益剰余金は 2,000,000円（S社からの受取配当金を含む）。</li>
<li>P社とS社の間の取引は、剰余金の配当のみである。</li></ol>`,
 sheet:`<p>問1　支配獲得日（X1年3月31日）</p>
<p>のれん [[a]] 円　　非支配株主持分 [[b]] 円</p>
<p>問2　X2年3月期の連結財務諸表</p>
<table class="tb"><tr><td>のれん償却額</td><td>[[c]] 円</td></tr>
<tr><td>非支配株主に帰属する当期純利益</td><td>[[d]] 円</td></tr>
<tr><td>連結貸借対照表の のれん</td><td>[[e]] 円</td></tr>
<tr><td>連結貸借対照表の 非支配株主持分</td><td>[[f]] 円</td></tr>
<tr><td>連結貸借対照表の 利益剰余金</td><td>[[g]] 円</td></tr></table>`,
 ans:{a:160000, b:560000, c:16000, d:120000, e:144000, f:640000, g:2104000},
 pts:{a:3, b:3, c:2, d:3, e:2, f:3, g:4},
 ex:`<p><b>① 投資と資本の相殺消去（開始仕訳）</b><br>（借）資本金 1,000,000／利益剰余金 400,000／のれん 160,000　（貸）S社株式 1,000,000／非支配株主持分 560,000<br>非支配株主持分 1,400,000×40%＝<b>560,000</b>　のれん 1,000,000−1,400,000×60%＝<b>160,000</b></p>
<p><b>② X2年3月期の連結修正</b><br>のれん償却 160,000÷10年＝<b>16,000</b><br>当期純利益の振替 300,000×40%＝<b>120,000</b>（非支配株主に帰属する当期純利益／非支配株主持分）<br>配当の修正：P社分 60,000 は受取配当金と相殺、非支配株主分 40,000 は非支配株主持分を減らす</p>
<p><b>③ 期末残高</b><br>のれん 160,000−16,000＝<b>144,000</b><br>非支配株主持分 560,000＋120,000−40,000＝<b>640,000</b>（検算：S社純資産1,600,000×40%）<br>利益剰余金 P社2,000,000＋S社の取得後増加分(600,000−400,000)×60%−のれん償却16,000＝<b>2,104,000</b></p>
<p class="tip">💡 タイムテーブル（取得日 → 当期末の資本の推移）を余白に描くと、非支配株主持分とのれんがすぐ出る。</p>`},

{id:'s02', grp:'商業', part:'第2問', min:12, title:'株主資本等変動計算書',
 body:`<p>当社（会計期間 4/1〜3/31）の当期の資料は次のとおりである。株主資本等変動計算書の当期末残高を答えなさい。</p>
<p class="sh2">［資料1］当期首残高</p>
<table class="tb"><tr><td>資本金</td><td class="n">5,000,000円</td><td>資本準備金</td><td class="n">600,000円</td></tr>
<tr><td>その他資本剰余金</td><td class="n">200,000円</td><td>利益準備金</td><td class="n">400,000円</td></tr>
<tr><td>別途積立金</td><td class="n">300,000円</td><td>繰越利益剰余金</td><td class="n">1,500,000円</td></tr></table>
<p class="sh2">［資料2］当期中の取引</p>
<ol class="ol2"><li>6/25 株主総会で、繰越利益剰余金を財源として配当 800,000円を行うことと、別途積立金 100,000円の積立てが決議された。あわせて会社法の規定による利益準備金を積み立てる。</li>
<li>9/1 新株200株を1株あたり10,000円で発行し、全額の払込みを受けた。資本金には会社法の規定する最低額を計上する。</li>
<li>3/31 当期純利益は 900,000円であった。</li></ol>`,
 sheet:`<p>問1　6/25 に積み立てる利益準備金の額　[[a]] 円</p>
<p>問2　当期末残高</p>
<table class="tb"><tr><td>資本金</td><td>[[b]] 円</td><td>資本準備金</td><td>[[c]] 円</td></tr>
<tr><td>利益準備金</td><td>[[d]] 円</td><td>別途積立金</td><td>[[e]] 円</td></tr>
<tr><td>繰越利益剰余金</td><td>[[f]] 円</td><td>株主資本合計</td><td>[[g]] 円</td></tr></table>`,
 ans:{a:80000, b:6000000, c:1600000, d:480000, e:400000, f:1420000, g:10100000},
 pts:{a:4, b:2, c:2, d:2, e:2, f:4, g:4},
 ex:`<p><b>利益準備金の積立額</b>（配当の1/10 と、資本金の1/4−準備金合計 の小さいほう）<br>配当の1/10：800,000×1/10＝80,000<br>上限までの残り：5,000,000×1/4−(資本準備金600,000＋利益準備金400,000)＝250,000<br>→ 小さいほうの <b>80,000</b></p>
<p><b>増資</b> 200株×10,000＝2,000,000。最低額は払込額の1/2 → 資本金 1,000,000、資本準備金 1,000,000</p>
<p>資本金 5,000,000＋1,000,000＝<b>6,000,000</b>　資本準備金 600,000＋1,000,000＝<b>1,600,000</b><br>利益準備金 400,000＋80,000＝<b>480,000</b>　別途積立金 300,000＋100,000＝<b>400,000</b><br>繰越利益剰余金 1,500,000−800,000−80,000−100,000＋900,000＝<b>1,420,000</b></p>
<p>株主資本合計 期首8,000,000＋増資2,000,000−配当800,000＋当期純利益900,000＝<b>10,100,000</b>（準備金・積立金への振替は合計を変えない）</p>
<p class="tip">💡 合計欄は「外部とのやりとり（増資・配当・利益）」だけで動く。内部の振替は合計に影響しない、と覚えると検算が速い。</p>`},

{id:'s03', grp:'商業', part:'第3問', min:20, title:'損益計算書の作成',
 body:`<p>次の決算整理前残高試算表（一部）と決算整理事項にもとづいて、損益計算書を完成させなさい。会計期間は X1年4月1日〜X2年3月31日。</p>

<div class="two"><table class="tb"><tr><th colspan="2">借方</th></tr>
<tr><td>売掛金</td><td class="n">1,200,000</td></tr><tr><td>繰越商品</td><td class="n">300,000</td></tr><tr><td>建物</td><td class="n">3,000,000</td></tr><tr><td>備品</td><td class="n">1,000,000</td></tr><tr><td>仕入</td><td class="n">5,200,000</td></tr><tr><td>給料</td><td class="n">1,200,000</td></tr><tr><td>支払家賃</td><td class="n">600,000</td></tr></table>
<table class="tb"><tr><th colspan="2">貸方</th></tr>

<p class="sh2">［資料2］決算整理事項</p>
<ol class="ol2"><li>期末商品帳簿棚卸高は 350,000円、実地棚卸高は 340,000円。棚卸減耗損は売上原価の内訳科目として表示する。</li>

<li>建物：定額法（耐用年数30年、残存価額ゼロ）。備品：200%定率法（耐用年数5年、償却率0.4）。</li>
<li>支払家賃のうち 50,000円 は翌期分である。</li>
<li>法人税、住民税及び事業税は、税引前当期純利益の30%とする。</li></ol>`,

<tr><td>当期純利益</td><td></td><td>[[k]]</td></tr></table>`,
 ans:{a:350000, b:10000, c:5160000, d:2840000, e:550000, f:14000, g:356000, h:2120000, i:720000, j:216000, k:504000},
 pts:{a:1, b:1, c:2, d:2, e:2, f:2, g:2, h:2, i:2, j:2, k:2},
 ex:`<p><b>売上原価</b>　期首300,000＋仕入5,200,000−期末(帳簿)350,000＋減耗10,000＝<b>5,160,000</b><br>（期末商品は<b>帳簿棚卸高</b>350,000で差し引き、減耗分(350,000−340,000)を足す）</p>

{id:'s04', grp:'商業', part:'第2問', min:15, title:'有価証券の期末評価',
 body:`<p>当社（決算日 3月31日）が当期（X1年4月1日〜X2年3月31日）に保有した有価証券について、各問に答えなさい。</p>
<ol class="ol2"><li><b>A社社債</b>：X1年4月1日に額面 1,000,000円を 970,000円で取得（満期保有目的）。満期日 X6年3月31日、年利率2%、利払日 9月末・3月末。取得価額と額面金額の差額は金利の調整と認められ、償却原価法（定額法）を適用する。</li>
<li><b>B社株式</b>：X1年10月1日に売買目的で1,000株を@800円で取得し、手数料8,000円を支払った。X2年2月1日に400株を@850円で売却。期末時価は@790円。</li>
<li><b>C社株式</b>：前期に取得したその他有価証券。取得原価 500,000円、期末時価 560,000円。全部純資産直入法を採用し、税効果会計（実効税率30%）を適用する。</li></ol>`,
 sheet:`<p>問1　A社社債の期末の貸借対照表価額 [[a]] 円、当期の有価証券利息 [[b]] 円</p>
<p>問2　B社株式の売却損益 [[c]] 円（[[cc=益|損]]）、期末の評価損益 [[d]] 円（[[dc=益|損]]）</p>
<p>問3　C社株式のその他有価証券評価差額金 [[e]] 円、繰延税金負債 [[f]] 円</p>`,
 ans:{a:976000, b:26000, c:16800, cc:'益', d:10800, dc:'損', e:42000, f:18000},
 pts:{a:4, b:3, c:4, d:3, e:3, f:3},
 ex:`<p><b>A社社債</b>　差額 30,000 を5年で配分 → 年6,000<br>期末 970,000＋6,000＝<b>976,000</b>　有価証券利息 1,000,000×2%＋6,000＝<b>26,000</b></p>
<p><b>B社株式</b>　取得原価 (800×1,000＋8,000)÷1,000株＝@808円（手数料は取得原価に含める）<br>売却 400×(850−808)＝<b>16,800 の売却益</b><br>期末 600株×(790−808)＝<b>−10,800 の評価損</b></p>
<p><b>C社株式</b>　評価差額 560,000−500,000＝60,000<br>繰延税金負債 60,000×30%＝<b>18,000</b>　評価差額金 60,000−18,000＝<b>42,000</b></p>
<p class="tip">💡 売買目的は損益（P/L）、その他有価証券は純資産（B/S）。税効果はその他有価証券の評価差額にだけかかる。</p>`},

{id:'s05', grp:'商業', part:'第3問', noMock:true, min:8, title:'本支店会計（未達取引）',
 body:`<p>決算にあたり、本店の支店勘定と支店の本店勘定の残高が一致しなかった。調べたところ次の未達事項が判明した。各問に答えなさい。</p>
<p>本店の支店勘定：740,000円（借方残高）　支店の本店勘定：700,000円（貸方残高）</p>
<ol class="ol2"><li>本店から支店に発送した商品 80,000円（原価）が、支店に未着である。</li>
<li>支店が本店の売掛金 50,000円 を回収したが、その連絡が本店に未達である。</li>
<li>本店が支店負担の広告宣伝費 10,000円 を立替払いしたが、その連絡が支店に未達である。</li></ol>`,
 sheet:`<p>問1　未達事項整理前の、支店勘定と本店勘定の差額　[[a]] 円</p>
<p>問2　未達事項整理後の　本店の支店勘定 [[b]] 円　　支店の本店勘定 [[c]] 円</p>
<p>問3　支店の当期純利益 120,000円 を本店に振り替えた後の、本店の支店勘定 [[d]] 円</p>`,
 ans:{a:40000, b:790000, c:790000, d:910000},
 pts:{a:2, b:3, c:3, d:2},
 ex:`<p><b>未達の処理は「知らない側」が仕訳する</b></p>
<p>1. 支店：（借）仕入 80,000（貸）本店 80,000<br>2. 本店：（借）支店 50,000（貸）売掛金 50,000<br>3. 支店：（借）広告宣伝費 10,000（貸）本店 10,000</p>
<p>支店勘定 740,000＋50,000＝<b>790,000</b>　本店勘定 700,000＋80,000＋10,000＝<b>790,000</b>（一致 ✓）</p>
<p>当期純利益の振替　本店：（借）支店 120,000（貸）損益 120,000 → 790,000＋120,000＝<b>910,000</b></p>
<p class="tip">💡 支店勘定と本店勘定は、貸借が逆の「鏡」。どちらの帳簿に記録が足りないかを考える。</p>`},

{id:'s06', grp:'商業', part:'第2問', min:10, title:'リース取引（利子抜き法・利子込み法）',
 body:`<p>当社（決算日 3月31日）は X1年4月1日に次の条件で備品のリース契約（ファイナンス・リース取引、所有権移転外）を結んだ。各問に答えなさい。</p>
<table class="tb"><tr><td>リース期間</td><td class="n">5年</td></tr><tr><td>リース料</td><td class="n">年額 240,000円（毎年3月31日に後払い）</td></tr>
<tr><td>見積現金購入価額</td><td class="n">1,050,000円</td></tr><tr><td>減価償却</td><td class="n">定額法、耐用年数はリース期間、残存価額ゼロ</td></tr></table>`,
 sheet:`<p>問1　<b>利子抜き法</b>（利息相当額は定額法で各期に配分）</p>
<table class="tb"><tr><td>リース資産の計上額</td><td>[[a]] 円</td></tr><tr><td>X2年3月期の支払利息</td><td>[[b]] 円</td></tr>
<tr><td>X2年3月期の減価償却費</td><td>[[c]] 円</td></tr><tr><td>X2年3月31日のリース債務残高</td><td>[[d]] 円</td></tr></table>
<p>問2　<b>利子込み法</b></p>
<table class="tb"><tr><td>リース資産の計上額</td><td>[[e]] 円</td></tr><tr><td>X2年3月期の減価償却費</td><td>[[f]] 円</td></tr></table>`,
 ans:{a:1050000, b:30000, c:210000, d:840000, e:1200000, f:240000},
 pts:{a:3, b:4, c:3, d:4, e:3, f:3},
 ex:`<p><b>利子抜き法</b>　リース資産は見積現金購入価額 <b>1,050,000</b><br>利息総額 240,000×5−1,050,000＝150,000 → 定額法で年 <b>30,000</b><br>3/31 支払：（借）リース債務 210,000／支払利息 30,000（貸）現金 240,000<br>減価償却 1,050,000÷5年＝<b>210,000</b>　リース債務残高 1,050,000−210,000＝<b>840,000</b></p>
<p><b>利子込み法</b>　リース料総額 240,000×5＝<b>1,200,000</b>で計上、減価償却 1,200,000÷5＝<b>240,000</b>（支払利息は出てこない）</p>
<p class="tip">💡 利子抜き法では、毎年の支払額から利息を引いた分だけリース債務が減る。</p>`},
{id:'s07', grp:'商業', part:'第3問', min:20, title:'貸借対照表の作成',
 body:`<p>次の決算整理前残高試算表（一部）と決算整理事項にもとづいて、貸借対照表（一部）を完成させなさい。会計期間は X1年4月1日〜X2年3月31日。</p>
<p class="sh2">［資料1］決算整理前残高試算表（一部・単位：円）</p>
<div class="two"><table class="tb"><tr><th colspan="2">借方</th></tr>
<tr><td>現金預金</td><td class="n">820,000</td></tr><tr><td>受取手形</td><td class="n">400,000</td></tr><tr><td>売掛金</td><td class="n">600,000</td></tr><tr><td>繰越商品</td><td class="n">250,000</td></tr><tr><td>仮払法人税等</td><td class="n">80,000</td></tr><tr><td>建物</td><td class="n">2,400,000</td></tr><tr><td>備品</td><td class="n">600,000</td></tr><tr><td>土地</td><td class="n">1,500,000</td></tr></table>
<table class="tb"><tr><th colspan="2">貸方</th></tr>
<tr><td>支払手形</td><td class="n">300,000</td></tr><tr><td>買掛金</td><td class="n">450,000</td></tr><tr><td>長期借入金</td><td class="n">1,000,000</td></tr><tr><td>貸倒引当金</td><td class="n">8,000</td></tr><tr><td>建物減価償却累計額</td><td class="n">720,000</td></tr><tr><td>備品減価償却累計額</td><td class="n">216,000</td></tr></table></div>
<p class="sh2">［資料2］決算整理事項</p>
<ol class="ol2"><li>売掛金のうち 50,000円 は、前期に発生したもので、得意先の倒産により回収不能となった。貸倒引当金を充当し、不足額は貸倒損失とする。</li>
<li>受取手形と売掛金の期末残高に対して2%の貸倒引当金を差額補充法により設定する。</li>
<li>期末商品帳簿棚卸高は 280,000円、実地棚卸高は 270,000円である。</li>
<li>建物：定額法（耐用年数30年、残存価額ゼロ）。備品：200%定率法（耐用年数5年、償却率0.4）。</li>
<li>長期借入金のうち 200,000円 は X3年3月31日に返済期日をむかえる。</li>
<li>支払利息の未払分が 15,000円、保険料の前払分が 24,000円 ある。</li>
<li>法人税、住民税及び事業税の確定額は 180,000円 である。</li></ol>`,
 sheet:`<p class="sh2">貸借対照表（一部・単位：円）</p>
<div class="two"><table class="tb pl"><tr><th colspan="2">資産の部</th></tr>
<tr><td>現金預金</td><td class="n">820,000</td></tr>
<tr><td>受取手形</td><td class="n">400,000</td></tr>
<tr><td>売掛金</td><td>[[a]]</td></tr>
<tr><td class="in">貸倒引当金</td><td>△[[b]]</td></tr>
<tr><td>商品</td><td>[[c]]</td></tr>
<tr><td>前払費用</td><td>[[d]]</td></tr>
<tr><th>流動資産合計</th><td>[[e]]</td></tr>
<tr><td>建物減価償却累計額</td><td>△[[f]]</td></tr>
<tr><td>備品減価償却累計額</td><td>△[[g]]</td></tr></table>
<table class="tb pl"><tr><th colspan="2">負債の部</th></tr>
<tr><td>支払手形</td><td class="n">300,000</td></tr>
<tr><td>買掛金</td><td class="n">450,000</td></tr>
<tr><td>1年以内返済の長期借入金</td><td>[[h]]</td></tr>
<tr><td>未払費用</td><td>[[i]]</td></tr>
<tr><td>未払法人税等</td><td>[[j]]</td></tr>
<tr><td>長期借入金（固定負債）</td><td>[[k]]</td></tr></table></div>`,
 ans:{a:550000, b:19000, c:270000, d:24000, e:2045000, f:800000, g:369600, h:200000, i:15000, j:100000, k:800000},
 pts:{a:2, b:2, c:2, d:2, e:2, f:2, g:2, h:1, i:2, j:2, k:1},
 ex:`<p><b>① 貸倒れ</b>　売掛金 600,000−50,000＝<b>550,000</b>。貸倒引当金 8,000 を全部使い、残り42,000 は貸倒損失 → 引当金の残高は0</p>
<p><b>② 貸倒引当金</b>　(受取手形400,000＋売掛金550,000)×2%＝<b>19,000</b>（残高0なので繰入額も19,000）</p>
<p><b>③ 商品</b>　B/Sには<b>実地棚卸高</b> <b>270,000</b>（減耗10,000は費用）</p>
<p><b>④ 減価償却</b>　建物 2,400,000÷30年＝80,000 → 累計額 720,000＋80,000＝<b>800,000</b><br>備品 (600,000−216,000)×0.4＝153,600 → 累計額 216,000＋153,600＝<b>369,600</b></p>
<p><b>⑤ 借入金</b>　決算日の翌日から1年以内（X3年3月31日まで）に返済する 200,000 は<b>流動負債</b>、残り <b>800,000</b> は固定負債</p>
<p><b>⑥ 経過勘定</b>　未払利息 → 未払費用 <b>15,000</b>、前払保険料 → 前払費用 <b>24,000</b></p>
<p><b>⑦ 法人税等</b>　確定額180,000−中間納付80,000＝未払法人税等 <b>100,000</b></p>
<p><b>流動資産合計</b> 820,000＋400,000＋550,000−19,000＋270,000＋24,000＝<b>2,045,000</b></p>
<p class="tip">💡 B/Sは「期末の残高」。費用の金額（繰入額・減価償却費）ではなく、引当金や累計額の<b>残高</b>を書く。</p>`},

{id:'s08', grp:'商業', part:'第2問', min:15, title:'連結会計（未実現利益・債権債務の消去）',
 body:`<p>P社は数年前からS社の発行済株式の80%を保有し、支配している。当期（X2年4月1日〜X3年3月31日）の資料にもとづいて、連結財務諸表の各金額を答えなさい。のれんは考慮しなくてよい。</p>
<p class="sh2">［資料1］個別財務諸表の金額（一部・単位：円）</p>
<table class="tb"><tr><th></th><th>P社</th><th>S社</th></tr>
<tr><td>売上高</td><td class="n">8,000,000</td><td class="n">3,000,000</td></tr>
<tr><td>売上原価</td><td class="n">6,000,000</td><td class="n">2,200,000</td></tr>
<tr><td>当期純利益</td><td class="n">900,000</td><td class="n">400,000</td></tr>
<tr><td>売掛金</td><td class="n">1,500,000</td><td class="n">700,000</td></tr>
<tr><td>貸倒引当金</td><td class="n">30,000</td><td class="n">14,000</td></tr>
<tr><td>商品</td><td class="n">900,000</td><td class="n">500,000</td></tr>
<tr><td>土地</td><td class="n">2,000,000</td><td class="n">1,000,000</td></tr></table>
<p class="sh2">［資料2］連結会社間の取引</p>
<ol class="ol2"><li>P社は当期からS社に商品を販売しており、原価に25%の利益を加算している。当期のP社のS社への売上高は 1,000,000円。</li>
<li>S社の期首商品のうち 150,000円、期末商品のうち 200,000円 はP社から仕入れたものである。</li>
<li>P社の売掛金のうち 300,000円 はS社に対するもの。P社は売掛金の期末残高に2%の貸倒引当金を設定している。</li>
<li>当期中に、S社は帳簿価額 500,000円 の土地を 600,000円 でP社に売却した。P社は期末もこの土地を保有している。</li></ol>`,
 sheet:`<table class="tb"><tr><td>連結損益計算書の 売上高</td><td>[[a]] 円</td></tr>
<tr><td>連結損益計算書の 売上原価</td><td>[[b]] 円</td></tr>
<tr><td>連結貸借対照表の 商品</td><td>[[c]] 円</td></tr>
<tr><td>連結貸借対照表の 売掛金</td><td>[[d]] 円</td></tr>
<tr><td>連結貸借対照表の 貸倒引当金</td><td>[[e]] 円</td></tr>
<tr><td>連結貸借対照表の 土地</td><td>[[f]] 円</td></tr>
<tr><td>非支配株主に帰属する当期純利益</td><td>[[g]] 円</td></tr></table>`,
 ans:{a:10000000, b:7210000, c:1360000, d:1900000, e:38000, f:2900000, g:60000},
 pts:{a:2, b:4, c:3, d:2, e:3, f:3, g:3},
 ex:`<p><b>① 売上と仕入の相殺</b>　売上高 8,000,000＋3,000,000−1,000,000＝<b>10,000,000</b>（売上原価からも1,000,000を引く）</p>
<p><b>② 商品の未実現利益（P社→S社：ダウンストリーム）</b>　利益率は 25/125＝20%<br>期末：200,000×20%＝40,000 → 売上原価に加算・商品から控除<br>期首：150,000×20%＝30,000 → 前期の未実現利益が当期に実現 → 売上原価から控除<br>売上原価 6,000,000＋2,200,000−1,000,000＋40,000−30,000＝<b>7,210,000</b><br>商品 900,000＋500,000−40,000＝<b>1,360,000</b></p>
<p><b>③ 債権債務の相殺</b>　売掛金 1,500,000＋700,000−300,000＝<b>1,900,000</b><br>貸倒引当金 300,000×2%＝6,000 も減らす → 30,000＋14,000−6,000＝<b>38,000</b></p>
<p><b>④ 土地の未実現利益（S社→P社：アップストリーム）</b>　600,000−500,000＝100,000 を消去 → 土地 2,000,000＋1,000,000−100,000＝<b>2,900,000</b><br>売ったのは子会社なので、未実現利益のうち20%（20,000）は非支配株主に負担させる</p>
<p><b>⑤ 非支配株主に帰属する当期純利益</b>　S社の当期純利益400,000×20%−土地の未実現利益の負担分20,000＝<b>60,000</b></p>
<p class="tip">💡 「誰が売ったか」がポイント。親会社が売ったら（ダウン）全額親会社の負担、子会社が売ったら（アップ）非支配株主も持分割合だけ負担する。</p>`},

{id:'k09', grp:'工業', part:'第4問(2)', min:15, title:'工程別総合原価計算（累加法）',
 body:`<p>当工場では2つの工程で製品を連続生産しており、累加法による工程別総合原価計算を採用している。次の資料にもとづいて、各問に答えなさい。月初仕掛品はない。</p>
<table class="tb"><tr><th></th><th>第1工程</th><th>第2工程</th></tr>
<tr><td>当月投入</td><td class="n">1,000個</td><td class="n">800個（第1工程完了品）</td></tr>
<tr><td>月末仕掛品</td><td class="n">200個（50%）</td><td class="n">100個（40%）</td></tr>
<tr><td>完成品</td><td class="n">800個</td><td class="n">700個</td></tr>
<tr><td>直接材料費（当月）</td><td class="n">600,000円</td><td class="n">—</td></tr>
<tr><td>加工費（当月）</td><td class="n">450,000円</td><td class="n">740,000円</td></tr></table>
<p class="note2">第1工程の材料は工程の始点で投入する。第1工程の完了品はすべて第2工程の始点に投入される。（　）内は加工進捗度。</p>`,
 sheet:`<p>問1　第1工程　月末仕掛品原価 [[a]] 円　　第1工程完了品原価 [[b]] 円</p>
<p>問2　第2工程　月末仕掛品原価のうち 前工程費 [[c]] 円、加工費 [[d]] 円</p>
<p>問3　最終完成品の総合原価 [[e]] 円　　完成品単位原価 [[f]] 円/個</p>`,
 ans:{a:170000, b:880000, c:110000, d:40000, e:1470000, f:2100},
 pts:{a:2, b:3, c:2, d:2, e:4, f:3},
 ex:`<p><b>第1工程</b><br>材料 600,000÷1,000個＝600円 → 月末 200×600＝120,000<br>加工 換算量 800＋200×50%＝900個、450,000÷900＝500円 → 月末 100×500＝50,000<br>月末仕掛品 <b>170,000</b>　完了品 1,050,000−170,000＝<b>880,000</b>（800個、@1,100円）</p>
<p><b>第2工程</b>　第1工程完了品の原価を<b>前工程費</b>として、始点投入の材料と同じように扱う<br>前工程費 880,000÷800個＝1,100円 → 月末 100×1,100＝<b>110,000</b><br>加工 換算量 700＋100×40%＝740個、740,000÷740＝1,000円 → 月末 40×1,000＝<b>40,000</b></p>
<p><b>完成品</b> 880,000＋740,000−150,000＝<b>1,470,000</b>　単位原価 1,470,000÷700＝<b>2,100円</b></p>
<p class="tip">💡 累加法は「前工程費＝第2工程の材料」と考えるだけ。工程ごとにボックス図を1つずつ描こう。</p>`},

{id:'k10', grp:'工業', part:'第5問', min:12, title:'標準原価計算（勘定記入・シングルプラン）',
 body:`<p>当社は製品Wを量産しており、標準原価計算を採用している。仕掛品勘定には<b>シングル・プラン</b>で記入する。次の資料にもとづいて、各問に答えなさい。</p>
<p class="sh2">［資料1］製品W 1個あたりの標準原価</p>
<table class="tb"><tr><td>直接材料費</td><td>300円/kg × 4kg</td><td class="n">1,200円</td></tr>
<tr><td>直接労務費</td><td>1,000円/時間 × 1.5時間</td><td class="n">1,500円</td></tr>
<tr><td>製造間接費</td><td>1,200円/時間 × 1.5時間</td><td class="n">1,800円</td></tr>
<tr><th colspan="2">合計</th><td class="n"><b>4,500円</b></td></tr></table>
<p class="sh2">［資料2］当月の生産データ</p>
<p>月初仕掛品 200個（50%）／完成品 1,800個／月末仕掛品 300個（40%）　材料は工程の始点で投入</p>
<p class="sh2">［資料3］当月の実際発生額</p>
<p>直接材料費 2,350,000円／直接労務費 2,700,000円／製造間接費 3,300,000円</p>`,
 sheet:`<p>問1　仕掛品勘定（単位：円）</p>
<table class="tb taccount"><tr><th colspan="2">借方</th><th colspan="2">貸方</th></tr>
<tr><td>月初有高</td><td>[[a]]</td><td>製品</td><td>[[e]]</td></tr>
<tr><td>直接材料費</td><td>[[b]]</td><td>月末有高</td><td>[[f]]</td></tr>
<tr><td>直接労務費</td><td>[[c]]</td><td></td><td></td></tr>
<tr><td>製造間接費</td><td>[[d]]</td><td></td><td></td></tr></table>
<p>問2　原価差異（総差異）</p>
<table class="tb"><tr><td>直接材料費差異</td><td>[[g]] 円</td><td>[[gc=有利|不利]]</td></tr>
<tr><td>直接労務費差異</td><td>[[h]] 円</td><td>[[hc=有利|不利]]</td></tr>
<tr><td>製造間接費差異</td><td>[[i]] 円</td><td>[[ic=有利|不利]]</td></tr></table>
<p>問3　パーシャル・プランの場合、仕掛品勘定の借方の当月投入額（直接材料費など）は [[j=標準原価|実際原価]] で記入する。</p>`,
 ans:{a:570000, b:2280000, c:2730000, d:3276000, e:8100000, f:756000, g:70000, gc:'不利', h:30000, hc:'有利', i:24000, ic:'不利', j:'実際原価'},

               finger:false, penSeen:false}};     // 指でも書く／Apple Pencilを使ったことがある

      const d = defaults();
      const m = {...d, ...s, set:{...d.set, ...(s.set||{})}, best:{...d.best, ...(s.best||{})}, ox:{...d.ox, ...(s.ox||{})}, badges:s.badges||{}};
      if(typeof s.xp !== 'number'){ // 旧バージョンの記録からXPを引き継ぐ

function todayKey(d = new Date()){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function countToday(){ const t = todayKey(); S.days[t] = (S.days[t]||0) + 1; }
function record(id, ok){
  const r = S.rec[id] || {n:0, c:0};
  if(r.s === undefined) r.s = r.last ? 1 : 0;
  r.n++; if(ok) r.c++; r.last = ok; r.s = ok ? r.s + 1 : 0; r.ts = Date.now();
  S.rec[id] = r;
  countToday(); save();
}
function wrongIds(){ return QS.filter(q => S.rec[q.id] && S.rec[q.id].last === false).map(q => q.id); }
function stars(id){ const r = S.rec[id]; if(!r) return 0; return Math.min(r.s !== undefined ? r.s : (r.last ? 1 : 0), 3); }

function totalAnswers(){ return Object.values(S.days).reduce((a, b) => a + b, 0); }
function streak(){

  if(!S.days[todayKey(d)]) d.setDate(d.getDate()-1);
  while(S.days[todayKey(d)]){ n++; d.setDate(d.getDate()-1); }

}

function lvInfo(xp){

function closeCeleb(){ clearTimeout(celebTimer); document.getElementById('celebrate').classList.remove('show'); flushCelebrate(); }

function confetti(n = 80){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.getElementById('confetti'), ctx = cv.getContext('2d');
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ['#0f766e','#2dd4bf','#f59e0b','#ef4444','#7c3aed','#3b82f6','#22c55e'];
  const ps = Array.from({length:n}, () => ({x:W/2 + (Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4,
    s:Math.random()*6+4, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)]}));
  let frames = 0;
  (function tick(){
    ctx.clearRect(0, 0, W, H);
    let alive = 0;
    ps.forEach(p => {
      p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      if(p.y < H + 20){ alive++; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
    });
    if(alive && ++frames < 240) requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
  })();
}

const DAY = 86400000, GAP = [0, 1, 3, 7, 14];
function smartPick(n, pool = QS){
  const now = Date.now();
  return pool.map(q => {
    const r = S.rec[q.id]; let w;
    if(!r) w = 1.6;                       // 未学習
    else if(r.last === false) w = 3;      // 前回まちがえた
    else {
      const s = Math.min(r.s !== undefined ? r.s : 1, 4);
      w = (now - (r.ts||0) >= GAP[s]*DAY) ? (s >= 3 ? 1.2 : 2) : 0.15; // 復習のタイミングが来たか
    }
    return {id:q.id, k:Math.pow(Math.random(), 1/w)};
  }).sort((a, b) => b.k - a.k).slice(0, n).map(o => o.id);
}

function collect(side){
  const lines = []; let err = null;
  view.querySelectorAll(`.rows[data-side="${side}"] .row`).forEach(r => {

    if(!a){ err = '勘定科目が入っていない行があります'; return; }
    if(S.set.amount && !raw){ err = '金額が入力されていない行があります'; return; }
    lines.push([a, S.set.amount ? Number(raw) : 0]);
  });
  return {lines, err};

function jtable(d, c, opt = {}){
  const n = Math.max(d.length, c.length, 1);
  const cell = (l, side) => {
    if(!l) return '<td></td>';
    let cls = '';
    if(opt.check){ const m = opt.check[side]; cls = (m.has(l[0]) && (!opt.useAmt || m.get(l[0])===l[1])) ? 'okc' : 'ngc'; }
    return `<td class="${cls}"><span class="a">${esc(l[0])}</span>${opt.noAmt?'':`<span class="m">${yen(l[1])}</span>`}</td>`;
  };
  let h = '<table class="jt"><thead><tr><th>借方</th><th>貸方</th></tr></thead><tbody>';
  for(let i=0;i<n;i++) h += `<tr>${cell(d[i],'d')}${cell(c[i],'c')}</tr>`;
  return h + '</tbody></table>';
}

   ========================================================= */
let oxs = null, oxTimer = null;
function makeOx(q){
  if(Math.random() < 0.5) return {id:q.id, d:q.d, c:q.c, truth:true};
  const nums = [...new Set((q.q.match(/[\d,]+(?=円)/g)||[]).map(s => +s.replace(/,/g,'')).filter(n => n >= 1000))];
  for(let k = 0; k < 12; k++){
    let d = q.d.map(l => [...l]), c = q.c.map(l => [...l]);
    const kind = pick(['swap','acc','acc','amt']);
    if(kind === 'swap'){ [d, c] = [c, d]; }
    else if(kind === 'acc'){
      const used = new Set([...d, ...c].map(l => l[0])), cands = q.x.filter(x => !used.has(x));
      if(!cands.length) continue;
      pick([...d, ...c])[0] = pick(cands);
    } else {
      if(d.length === 1 && c.length === 1){ const alt = nums.filter(n => n !== d[0][1]); if(!alt.length) continue; d[0][1] = c[0][1] = pick(alt); }
      else { const l = pick([...d, ...c]), alt = nums.filter(n => n !== l[1]); if(!alt.length) continue; l[1] = pick(alt); }
    }
    if(!(sameMap(merge(d), merge(q.d), true) && sameMap(merge(c), merge(q.c), true))) return {id:q.id, d, c, truth:false};
  }
  return {id:q.id, d:q.d, c:q.c, truth:true};
}
function startOx(){
  oxs = {cards:smartPick(10).map(id => makeOx(QMAP[id])), i:0, ok:0, combo:0, xp:0, t0:Date.now(), results:[]};
  sess = {newBadges:[]};
  go('ox'); renderOx();
  oxTimer = setInterval(() => { const t = document.getElementById('oxtime'); if(t) t.textContent = ((Date.now()-oxs.t0)/1000).toFixed(1)+'秒'; }, 100);
}
function renderOx(){
  const card = oxs.cards[oxs.i], q = QMAP[card.id], cat = CMAP[q.cat];
  oxs.answered = false;
  newPage();
  view.innerHTML = `
    <div class="qhead"><div class="qtop"><button class="homebtn" data-act="home">🏠 ホーム</button>
      <div class="qtop-r">${oxs.combo>=2?`<span class="combo">🔥${oxs.combo}</span>`:''}<span class="timer" id="oxtime">${((Date.now()-oxs.t0)/1000).toFixed(1)}秒</span><span class="prog">${oxs.i+1} / ${oxs.cards.length}</span>${padBtnHTML()}</div></div>
    <div class="bar"><span style="width:${oxs.i/oxs.cards.length*100}%"></span></div></div>
    <div class="card" id="oxcard">
      <div class="tags"><span class="tag ${cat.grp==='商業'?'g1':'g2'}">${cat.grp}簿記</span><span class="tag">${esc(cat.name)}</span></div>
      <p class="oxq">${esc(q.q)}</p>
      <p class="oxask">この仕訳は正しい？</p>
      ${jtable(card.d, card.c)}
    </div>
    <div id="oxfb"></div>
    <div class="oxbtns sticky" id="oxbtns">
      <button class="oxo" data-act="oxans" data-v="1">○<small>正しい</small></button>
      <button class="oxx" data-act="oxans" data-v="0">×<small>まちがい</small></button>
    </div>`;
}
function answerOx(choice){
  if(oxs.answered) return;
  oxs.answered = true;
  const card = oxs.cards[oxs.i], q = QMAP[card.id], ok = (choice === card.truth);
  oxs.results.push({id:card.id, ok});
  S.ox.n++; if(ok){ S.ox.c++; oxs.ok++; }
  oxs.combo = ok ? oxs.combo + 1 : 0;
  if(oxs.combo > S.best.combo) S.best.combo = oxs.combo;
  const xp = ok ? 3 : 1; oxs.xp += xp;
  countToday(); addXP(xp); checkBadges();
  document.getElementById('oxcard').classList.add(ok ? 'flash-ok' : 'flash-ng');
  const lastCard = oxs.i === oxs.cards.length - 1;
  if(ok && card.truth){
    buzz(12); confetti(20);
    document.getElementById('oxfb').innerHTML = `<div class="verdict center" style="justify-content:center"><b style="color:var(--ok)">○ 正解！</b><span class="xpgain">+${xp} XP</span></div>`;
    document.getElementById('oxbtns').style.visibility = 'hidden';
    setTimeout(() => { if(celebQ.length){ flushCelebrate(); showOxNext(lastCard); } else oxNext(); }, 650);

const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

const MOCK_MIN = 90, J_PT = 4; // 本試験：90分・仕訳1問4点
// 採点の単位：金額＋有利/不利（キー＋c）は1セット
function exItems(p){

const exTotal = p => exItems(p).reduce((a, it) => a + it.pt, 0);
function blankHTML(part, key, mod, no){

function sheetHTML(part){

// 第1問・第4問(1)の仕訳（本試験CBTと同じく、勘定科目は選択・金額は入力）

/* cfg … {mode:'single'|'mock', secs:[{n:'第1問', js:[{id,opts}], parts:[{id, full}]}], t0, id} */
function buildEx(cfg){
  const e = {cfg, mode:cfg.mode, t0:cfg.t0 || Date.now(), graded:false, saved:false, mk:{}, ch:{}, parts:[], js:[], akeys:{}};
  cfg.secs.forEach((sc, si) => {
    sc._parts = sc.parts.map((x, pi) => { const part = {p:EXMAP[x.id], full:x.full, pre:`s${si}p${pi}_`, si}; e.parts.push(part);
      Object.entries(part.p.ans).forEach(([k, v]) => e.akeys[part.pre+k] = {part, k, v}); return part; });
    sc._js = sc.js.map((x, ji) => { const j = {...x, pre:`s${si}j${ji}`, si}; e.js.push(j); return j; });

}
function startExam(id){

function secPts(sc){ return sc._js.length*J_PT + sc._parts.reduce((a, pt) => a + (pt.full || exTotal(pt.p)), 0); }
function tickEx(){

function collectJ(pre){

      const a = view.querySelector(`.jamt[data-j="${pre}"][data-sd="${sd}"][data-r="${s.dataset.r}"]`), n = toNum(a.value);
      if(s.value) lines.push([s.value, n || 0]); else if(n) bad = true; });

function gradeExam(){

    ${mock ? `<table class="tb mres">${secs.map((sc, si) => `<tr><td><button class="link" data-act="msec" data-v="${si}">${sc.n}</button></td><td class="n"><b>${secScore(sc)}</b> / ${secPts(sc)}点</td><td><span class="meter"><span class="bg-${rateClass(Math.round(secScore(sc)/secPts(sc)*100))}" style="width:${secScore(sc)/secPts(sc)*100}%"></span></span></td></tr>`).join('')}</table>` : ''}
    ${left ? `<p class="selfq">あと <b>${left}か所</b> ○×をつけてください${mock ? '（各大問のタブで確認）' : ''}。<button class="mini" data-act="markrest" style="margin-left:6px">残りを全部○にする</button></p>`

/* =========================================================
   自分の過去問・問題集（PDF・写真）を取り込んで書き込む
   データは IndexedDB（このブラウザの中）に保存
   ========================================================= */
const DB = {
  p: null,
  open(){ return this.p || (this.p = new Promise((res, rej) => {
    const r = indexedDB.open('boki2_docs', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('docs', {keyPath:'id'}); r.result.createObjectStore('ink'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  })); },
  async run(store, mode, fn){
    const d = await this.open();
    return new Promise((res, rej) => { const t = d.transaction(store, mode), q = fn(t.objectStore(store)); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  docs(){ return this.run('docs', 'readonly', s => s.getAll()); },
  doc(id){ return this.run('docs', 'readonly', s => s.get(id)); },
  putDoc(d){ return this.run('docs', 'readwrite', s => s.put(d)); },
  ink(k){ return this.run('ink', 'readonly', s => s.get(k)); },
  putInk(k, v){ return this.run('ink', 'readwrite', s => s.put(v, k)); },
  async delDoc(d){ await this.run('docs', 'readwrite', s => s.delete(d.id)); await this.run('ink', 'readwrite', s => { d.pages.forEach((_, i) => s.delete(d.id+':'+i)); s.delete(d.id+':marks'); }); },
};
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function pdfPages(file, prog){
  if(!window.pdfjsLib){ await loadScript(PDFJS + 'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise, out = [];
  for(let i = 1; i <= pdf.numPages; i++){
    prog(`PDFを変換中… ${i}/${pdf.numPages}ページ`);
    const page = await pdf.getPage(i), v0 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(1600 / v0.width, 3)});
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    out.push({blob: await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)), w:c.width, h:c.height});
    c.width = c.height = 0;
  }
  return out;
}
async function imgPage(file){
  const url = URL.createObjectURL(file), img = new Image();
  img.src = url; await img.decode(); URL.revokeObjectURL(url);
  const k = Math.min(1, 1600 / img.naturalWidth), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth*k); c.height = Math.round(img.naturalHeight*k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)), w = c.width, h = c.height; c.width = c.height = 0;
  return {blob, w, h};
}
const MK = {o:{t:'○', n:'できた'}, s:{t:'△', n:'あやしい'}, x:{t:'×', n:'できなかった'}};
const ROLE = {prob:'問題', sheet:'解答用紙', ans:'解答'};
async function docMarks(id){ try{ return (await DB.ink(id+':marks')) || {}; }catch(e){ return {}; } }
function markSummary(m, n){
  const c = {o:0, s:0, x:0}; Object.values(m).forEach(v => { if(v && c[v.v] !== undefined) c[v.v]++; });
  const done = c.o + c.s + c.x;
  return done ? `<span class="r-good">○${c.o}</span> <span class="r-mid">△${c.s}</span> <span class="r-bad">×${c.x}</span>${done < n ? `・未${n-done}` : ''}` : '未着手';
}
/* 1問 ＝ 問題（prob）・解答用紙（sheet）・解答（ans）のセット
   doc.v=2：pages[i] = {blob,w,h, role:'prob'|'sheet', q}、ans[i] = {blob,w,h, q}
   旧形式（v なし）：1ページ＝1問、解答は全問共通 */
function docItems(d){
  if(d.v !== 2) return d.pages.map((_, i) => ({prob:[i], sheet:[], ans:(d.ans || []).map((_, j) => j)}));
  const n = Math.max(0, ...d.pages.map(p => p.q + 1), ...(d.ans || []).map(a => a.q == null ? 0 : a.q + 1));
  const items = Array.from({length:n}, () => ({prob:[], sheet:[], ans:[]}));
  d.pages.forEach((p, i) => items[p.q][p.role === 'sheet' ? 'sheet' : 'prob'].push(i));
  (d.ans || []).forEach((a, j) => { if(a.q == null) items.forEach(it => it.ans.push(j)); else items[a.q].ans.push(j); });
  return items;
}
function toV2(d){
  if(d.v === 2) return d;
  d.pages.forEach((p, i) => { p.role = 'prob'; p.q = i; });
  (d.ans || []).forEach(a => { a.q = null; });
  d.v = 2; return d;
}

async function filesToPages(files, prog){
  const pages = [];
  for(const f of files){
    if(f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) pages.push(...await pdfPages(f, prog));
    else { prog(`画像を読み込み中… ${pages.length+1}枚目`); pages.push(await imgPage(f)); }
  }
  return pages;
}

  const qi = Math.min(Math.max(opt.q || 0, 0), docv.items.length - 1);

  if(opt.answers) showAnswers();
}
function qLabel(i){ const m = docv.marks[i]; return `問${i+1}${m ? ' ' + MK[m.v].t : ''}`; }
function inkPage(i, wrap){
  const g = INKS.doc, dv = docv, key = dv.id+':'+i;
  const save = () => { clearTimeout(dv.timers[i]); delete dv.pending[i]; return DB.putInk(key, k.strokes).catch(() => toast('書き込みを保存できませんでした')); };
  const k = new Ink(wrap, {name:'doc', norm:true, scroll:true, paper:true, width:2.8, tool:g.tool,
    onDown: () => { g.cur = i; }, onPush: () => g.pushed(i),
    onChange: () => { if(docv !== dv) return; dv.cache[i] = k.strokes; clearTimeout(dv.timers[i]); dv.pending[i] = save; dv.timers[i] = setTimeout(save, 400); }});
  g.add(i, k);
  if(dv.cache[i]){ k.strokes = dv.cache[i]; k.redraw(); }
  else DB.ink(key).then(st => { if(st && st.length && docv === dv){ dv.cache[i] = st; if(!k.strokes.length){ k.strokes = st; k.redraw(); } } }).catch(() => {});
  return k;
}
const pageHTML = (i, label) => { const p = docv.d.pages[i];
  return `<div class="pgwrap"><div class="inkwrap pg" data-i="${i}" style="aspect-ratio:${p.w}/${p.h}"><img src="${docv.urls[i]}" alt="${label}" draggable="false"></div></div>`; };
function showDocQ(qi){
  if(!docv) return;

    <div class="docpages">${main.map(i => pageHTML(i, hasSheet ? '解答用紙' : '問題')).join('')}</div>
    <div class="pgfoot"><span class="pgno">問${qi+1} / ${n}</span>
      <span class="pmk">${['o','s','x'].map(v => `<button class="pmb ${v} ${m && m.v===v?'on':''}" data-act="pmark" data-v="${v}" aria-label="${MK[v].n}">${MK[v].t}</button>`).join('')}</span>
      <button class="link" data-act="pclear">🧹 書き込みを消す</button></div>
    ${qi < n-1 ? `<button class="btn primary" data-act="docq" data-v="1">次の問題へ ▶</button>` : '<p class="sub center">最後の問題です</p>'}`;
  // 横のパネル：📄 問題（解答用紙があるときだけ）と 📖 解答（この問題のぶんだけ）
  document.body.classList.toggle('has-prob', hasSheet);
  document.body.classList.toggle('has-ans', it.ans.length > 0);
  document.getElementById('padProb').innerHTML = hasSheet ? `<div class="zwrap" style="width:${docv.zoom*100}%">${it.prob.map(i => pageHTML(i, '問題')).join('')}</div>` : '';
  document.getElementById('padAns').innerHTML = `<div class="zwrap" style="width:${docv.zoom*100}%">${it.ans.map((j, k) => { const p = docv.d.ans[j];
    return `<img src="${docv.ansUrls[j]}" alt="解答${k+1}" style="aspect-ratio:${p.w}/${p.h}"><p class="pgno">解答 ${k+1} / ${it.ans.length}</p>`; }).join('')}</div>`;
  const g = new InkGroup('doc'); INKS.doc = g;
  view.querySelectorAll('#docq .pg').forEach(w => inkPage(+w.dataset.i, w));
  document.querySelectorAll('#padProb .pg').forEach(w => inkPage(+w.dataset.i, w));
  g.cur = main[0] ?? 0;
  syncBar('doc');
  // 次の問題に進んだら、解答はいったん隠す（ネタバレ防止）
  const b = document.body.classList;
  if(b.contains('pad-ans') || b.contains('pad-prob') || hasSheet) hasSheet ? openPadIfWide('prob') : setPadTab('memo');
  window.scrollTo({top:0});
}
function openPadIfWide(tab){
  if(S.set.padEx || IS_WIDE_NOW()) openPad(tab); else setPadTab(tab);
}
const IS_WIDE_NOW = () => matchMedia('(min-width: 900px)').matches;
function docGo(step){
  if(!docv) return;
  const n = docv.items.length; let i = docv.qi;
  do { i += step; } while(docv.filter && i >= 0 && i < n && docv.marks[i] && docv.marks[i].v === 'o');
  if(i < 0 || i >= n){ toast(step > 0 ? (docv.filter ? '×・△の問題はここまでです' : '最後の問題です') : '最初の問題です'); return; }
  showDocQ(i);
}
function markPage(b){
  if(!docv) return;

  if(m[i] && m[i].v === v) delete m[i]; else m[i] = {v, ts:Date.now()};
  DB.putInk(docv.id+':marks', m).catch(() => toast('保存できませんでした'));
  view.querySelectorAll('.pmb').forEach(x => x.classList.toggle('on', !!m[i] && x.dataset.v === m[i].v));
  const sel = document.getElementById('docqsel'); if(sel) sel.options[i].textContent = `${qLabel(i)} / ${docv.items.length}問`;
